<template id="tpl-storm-2" data-class="storm storm--year seam" data-label="year-title">
<a class="stage-skip" href="#inspect">Skip the year</a>
<div class="year-head wrap">
<span class="label chapter-label"><span class="br">〔</span> 9:41 pm <span class="br">〕</span></span>
<h2 id="year-title" class="t-display cast-host" data-split>The year in one roof.</h2>
<p class="year-deck">Ohio weather works on a roof all year. Here is what each month does to it, and what to check.</p>
<div class="threats" role="tablist" aria-label="Ohio's four threats to a roof" data-threats>
<button type="button" role="tab" id="th-hail" aria-controls="tp-hail" aria-selected="false" tabindex="-1" data-threat="hail">Hail</button>
<button type="button" role="tab" id="th-wind" aria-controls="tp-wind" aria-selected="false" tabindex="-1" data-threat="wind">Wind</button>
<button type="button" role="tab" id="th-freeze" aria-controls="tp-freeze" aria-selected="false" tabindex="-1" data-threat="freeze">Freeze-thaw</button>
<button type="button" role="tab" id="th-ice" aria-controls="tp-ice" aria-selected="false" tabindex="-1" data-threat="ice">Ice dams</button>
</div>
<div class="threat-panels">
<div role="tabpanel" id="tp-hail" aria-labelledby="th-hail" tabindex="0" hidden><p><b>What it does.</b> Hail bruises shingles and knocks the granules loose. From the street the roof looks fine; the bare spots age fast in the sun.</p><p><b>What to check.</b> Granules in the gutters, dents on gutters and downspouts, dings on a car or grill from the same storm.</p></div>
<div role="tabpanel" id="tp-wind" aria-labelledby="th-wind" tabindex="0" hidden><p><b>What it does.</b> Wind gets under the bottom edge of a shingle, breaks the seal strip and creases the tab. The next rain finds the gap.</p><p><b>What to check.</b> Shingles in the yard, tabs that look creased or raised, bare strips along the ridge.</p></div>
<div role="tabpanel" id="tp-freeze" aria-labelledby="th-freeze" tabindex="0" hidden><p><b>What it does.</b> Ohio can swing 50 degrees in a week from November to March. Water in a small crack freezes, expands and opens it wider.</p><p><b>What to check.</b> Cracked or lifted shingles after a thaw, loose flashing at the chimney and pipes.</p></div>
<div role="tabpanel" id="tp-ice" aria-labelledby="th-ice" tabindex="0" hidden><p><b>What it does.</b> In January and February, attic heat melts snow that refreezes at the cold eave. The ice holds back meltwater, and it backs up under the shingles.</p><p><b>What to check.</b> Thick icicles at the gutters, stains on ceilings near outside walls, damp insulation at the eaves.</p></div>
</div>
</div>
<div class="year-stage" data-year-stage>
<div class="year-sticky">
<div class="sunarc" aria-hidden="true"><svg viewBox="0 0 1200 120" preserveAspectRatio="none"><path data-sunpath d="M0 110 C 260 110, 330 14, 600 14 C 870 14, 940 110, 1200 110"/></svg><i data-sun></i></div>
<ol class="months" data-months>
<li data-m="0"><b>January</b><span class="what">Ice dams form at the eaves when attic heat melts snow that refreezes at the cold edge.</span><span class="chk">Check: thick icicles, stains near outside walls.</span></li>
<li data-m="1"><b>February</b><span class="what">Meltwater backs up behind the ice and under the shingles.</span><span class="chk">Check: damp attic insulation at the eaves.</span></li>
<li data-m="2"><b>March</b><span class="what">Freeze-thaw: 50-degree swings in a week open small cracks wider.</span><span class="chk">Check: cracked or lifted shingles after a thaw.</span></li>
<li data-m="3"><b>April</b><span class="what">Hail season starts. It runs here from April to July.</span><span class="chk">Check: granules in the gutters after each storm.</span></li>
<li data-m="4"><b>May</b><span class="what">Storm lines bring hail and gusts that lift and crease tabs.</span><span class="chk">Check: shingles in the yard, creased tabs.</span></li>
<li data-m="5"><b>June</b><span class="what">Ohio averages about 19 hail days a year, most of them in these months.</span><span class="chk">Check: dents on gutters, dings on cars or grills.</span></li>
<li data-m="6"><b>July</b><span class="what">The end of hail season, and the hottest attics of the year.</span><span class="chk">Check: curling on the sunny side.</span></li>
<li data-m="7"><b>August</b><span class="what">Heat dries shingles out, and a hot attic ages them from below.</span><span class="chk">Check: attic vents clear, shingles lying flat.</span></li>
<li data-m="8"><b>September</b><span class="what">The first leaves start filling the gutters.</span><span class="chk">Check: gutters and valleys clear.</span></li>
<li data-m="9"><b>October</b><span class="what">Full gutters overflow behind the fascia and into the walls.</span><span class="chk">Check: downspouts running, valleys clear.</span></li>
<li data-m="10"><b>November</b><span class="what">Freeze-thaw returns, and the first hard freezes find loose flashing.</span><span class="chk">Check: flashing at the chimney and pipes.</span></li>
<li data-m="11"><b>December</b><span class="what">Snow load and freeze-thaw on an older roof.</span><span class="chk">Check: attic ventilation before the snow settles.</span></li>
</ol>
</div>
</div>

<div class="sample-body" data-reveal>
<p><b>Prepared for:</b> a homeowner in Centerville, Ohio. <b>Roof:</b> main roof, 6/12 pitch, about 26 squares; detached garage, 4/12 pitch, about 5 squares.</p>
<ol class="sample-lines">
<li>Tear off the existing roof down to the deck, one layer of shingles. Haul away and dispose of everything.</li>
<li>Inspect every deck board. Replace soft decking, priced per sheet, photographed and shown to you before any board is replaced. <button type="button" class="note-btn" aria-expanded="false" data-note="n-deck">Why we list the deck separately</button><span class="note" id="n-deck" hidden>The deck is the one thing nobody can see until the old roof is off. Listing it per sheet means you know the price of a soft board before we find one.</span></li>
<li>Drip edge at every eave and rake.</li>
<li>Ice and water barrier: two rows at the eaves and in every valley.</li>
<li>Synthetic underlayment over the rest of the deck.</li>
<li>Starter strip along the eaves and rakes.</li>
<li>Shingles: Owens Corning TruDefinition Duration, in the color you choose. <button type="button" class="note-btn" aria-expanded="false" data-note="n-prod">Why we name the product</button><span class="note" id="n-prod" hidden>An estimate that only says "architectural shingles" could mean anything. Ours names the maker and the product line, so you can look them up.</span></li>
<li>Flashing: new step flashing where the roof meets the walls, chimney counter-flashing re-cut, new pipe boots. <button type="button" class="note-btn" aria-expanded="false" data-note="n-flash">What flashing means here</button><span class="note" id="n-flash" hidden>Leaks start at the edges more often than in the middle. Flashing is the metal where walls, chimneys and pipes meet the roof.</span></li>
<li>Ridge vent, with hip and ridge caps.</li>
<li>Clean-up: a magnet sweep of the lawn, beds and driveway for nails.</li>
<li>Final walkthrough with the progress photos, and warranty registration.</li>

<template id="tpl-insurance-3" data-class="claim claim--office seam on-plaster" data-label="office-title">
<div class="wrap">
<span class="label chapter-label"><span class="br">〔</span> 5:20 pm <span class="br">〕</span></span>
<h2 id="office-title" class="t-h2">Your questions, answered by the office</h2>
<div class="oq" data-oq>
<ul class="oq-list">
<li><button type="button" aria-expanded="false" aria-controls="oa1">Can you talk to my insurance company for me?</button></li>
<li><button type="button" aria-expanded="false" aria-controls="oa2">What if the adjuster says no?</button></li>
<li><button type="button" aria-expanded="false" aria-controls="oa3">Will you start before my insurer approves?</button></li>
<li><button type="button" aria-expanded="false" aria-controls="oa4">Do I pay anything for the inspection?</button></li>
<li><button type="button" aria-expanded="false" aria-controls="oa5">Can I pay monthly?</button></li>
<li><button type="button" aria-expanded="false" aria-controls="oa6">Is there a discount for veterans?</button></li>
</ul>
<div class="oq-ans" aria-live="polite">
<div id="oa1" hidden><p>The claim is between you and your insurer. If you want us there, we meet the adjuster on your roof with our photos, and you get a copy of everything we document.</p><p class="signed">Answered by the Rembrandt office</p></div>
<div id="oa2" hidden><p>Ask for the reasons in writing. You can share our photos and our written estimate with your insurer. We can't promise a result, and we won't.</p><p class="signed">Answered by the Rembrandt office</p></div>
<div id="oa3" hidden><p>Nothing starts without your written approval of our written estimate. When you sign is your call.</p><p class="signed">Answered by the Rembrandt office</p></div>
<div id="oa4" hidden><p>No. The inspection and the written estimate are free.</p><p class="signed">Answered by the Rembrandt office</p></div>
<div id="oa5" hidden><p>Yes. We offer in-house financing with flexible monthly payments. Ask us for the terms; we don't print rates on the site.</p><p class="signed">Answered by the Rembrandt office</p></div>
<div id="oa6" hidden><p>Yes. Military members, veterans and first responders get a discount on every project. Ask us how much it is for your job.</p><p class="signed">Answered by the Rembrandt office</p></div>
<p class="oq-hint" data-oq-hint>Tap a question.</p>

<template id="tpl-faq-2" data-class="faq faq--sit seam on-plaster" data-label="faq2-title">
<div class="wrap">
<span class="label chapter-label"><span class="br">〔</span> 6:00 pm <span class="br">〕</span></span>
<h2 id="faq2-title" class="t-h2">Plain answers, by what's going on</h2>
<div class="sitq">
<section class="sitg" aria-labelledby="sg1"><h3 id="sg1">A storm came through</h3>
<details id="faq-hail"><summary>How do I know if I have hail damage?</summary><div class="ans"><p>From the ground you usually can't. Look for granules in the gutters, dents on the gutters or downspouts, and dings on a grill or car from the same storm. The roof itself needs a look in low light. We do that for free.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
<details id="faq-soon"><summary>How soon can you come out?</summary><div class="ans"><p>Usually within a few business days. Call before 4 pm on a weekday and we'll set a time the same day.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
</section>
<section class="sitg" aria-labelledby="sg2"><h3 id="sg2">It's leaking</h3>
<details id="faq-repair"><summary>Do you do repairs, or only replacements?</summary><div class="ans"><p>Both. We have a dedicated repair crew, and if a repair is enough, that's what we'll recommend.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
</section>
<section class="sitg" aria-labelledby="sg3"><h3 id="sg3">It's getting old</h3>
<details id="faq-time"><summary>How long does a roof replacement take?</summary><div class="ans"><p>Most homes are one day, two for large or steep roofs. The roof is dried in before the crew leaves each day.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
<details id="faq-home"><summary>Do I need to be home?</summary><div class="ans"><p>Not for the work. We like you there for the final walkthrough, because that's when we show you the photos and you sign off.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
<details id="faq-warranty"><summary>What does the warranty cover?</summary><div class="ans"><p>Our workmanship, for life, from the day you sign off. The Owens Corning materials carry 50 years of non-prorated coverage on a full system. Storm damage after the job is an insurance matter, not a warranty one.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
</section>
<section class="sitg" aria-labelledby="sg4"><h3 id="sg4">Insurance claim</h3>
<details id="faq-insurance"><summary>Will my insurance pay?</summary><div class="ans"><p>It depends on your policy and on whether the damage came from a covered storm. We can't promise a result, but we document the damage properly and meet your adjuster with the photos if you want us there.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
</section>
<section class="sitg" aria-labelledby="sg5"><h3 id="sg5">Just check it</h3>
<details id="faq-area"><summary>What areas do you serve?</summary><div class="ans"><p>Springboro and 23 towns around Dayton, roughly 25 miles out. Check your ZIP above.</p><p class="signed">Answered by the Rembrandt office</p></div></details>
</section>
</div>
</div>
</template>

<button type="button" aria-expanded="false" aria-controls="pa4"><img src="assets/img/sym-icicles-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Icicles at the eave</span></button>
<button type="button" aria-expanded="false" aria-controls="pa5"><img src="assets/img/sym-attic-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Daylight in the attic</span></button>
<button type="button" aria-expanded="false" aria-controls="pa6"><img src="assets/img/sym-curl-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Curled or cracked shingles</span></button>

<div class="pic-ans" aria-live="polite">
<div id="pa1" hidden><h3>Grit in the gutters</h3><p>Some grit after a new roof is normal. A lot of it after a storm can mean hail knocked the granules loose.</p><p class="next"><b>Next step:</b> book a free inspection. We look in low light and photograph what we find.</p></div>
<div id="pa2" hidden><h3>A lifted tab</h3><p>Wind has broken the seal under the shingle. The next rain can get under it.</p><p class="next"><b>Next step:</b> a repair is often enough. Text us a photo from the ground.</p></div>
<div id="pa3" hidden><h3>A ceiling stain</h3><p>Water has usually been getting in for a while before it shows. Put a bucket under any drip and photograph the stain.</p><p class="next"><b>Next step:</b> call <a class="phone" href="tel:+19377467377">(937) 746-7377</a>. Leaks come first.</p></div>
<div id="pa4" hidden><h3>Icicles at the eave</h3><p>Thick icicles can mean an ice dam: attic heat melting snow that refreezes at the cold edge and backs water up under the shingles.</p><p class="next"><b>Next step:</b> don't chip at the ice. Ask us to check the attic ventilation.</p></div>
<div id="pa5" hidden><h3>Daylight in the attic</h3><p>Light through the deck boards means gaps that water can find.</p><p class="next"><b>Next step:</b> photograph it from the attic and text it to us.</p></div>
<div id="pa6" hidden><h3>Curled or cracked shingles</h3><p>Curling and cracking usually mean a roof near the end of its life.</p><p class="next"><b>Next step:</b> a free inspection and a written estimate. If a repair is enough, we'll say so.</p></div>
</div>
<p class="t-caption pic-cap">Photos are stock examples, not Rembrandt jobs.</p>
