<template id="tpl-install-2" data-class="install install--lapse on-plaster seam" data-label="lapse-title">
 <div class="lapse-stage" data-lapse-stage>
  <div class="lapse-sticky">
   <figure class="lapse-fig">
    <img data-lapse-img src="assets/img/install-1-1080.webp" srcset="assets/img/install-1-1080.webp 1080w, assets/img/install-1-1600.webp 1600w" sizes="100vw" alt="One roof replacement through a morning, from tarps going down to the new roof on" width="1600" height="936" decoding="async">
    <div class="lapse-shade"></div>
   </figure>
   <div class="lapse-copy wrap">
    <span class="label chapter-label"><span class="br">〔</span> 10:00 am <span class="br">〕</span></span>
    <h2 id="lapse-title" class="t-h2">One day, time-lapse</h2>
    <p class="lapse-clock" aria-live="off"><b data-lapse-time>8:40 am</b><span data-lapse-cap>Tarps down over the beds. The old roof starts coming off.</span></p>
    <div class="lapse-bar" aria-hidden="true"><i data-lapse-bar></i></div>
    <p class="t-caption lapse-credit">Illustrative stock sequence: one roof replacement in June 2022, photos by Famartin (CC BY-SA 4.0). Not a Rembrandt job.</p>
   </div>
  </div>
 </div>
 <ol class="sr-only"><li>8:40 am: tarps down over the beds, the old roof starts coming off.</li><li>11:17 am: old roof off, underlayment going on.</li><li>12:50 pm: the new roof is on and the lawn is cleared.</li></ol>
</template>

<template id="tpl-install-3" data-class="install install--clock on-plaster seam" data-label="clock-title">
 <div class="clock-stage" data-clock-stage>
  <div class="clock-sticky">
   <div class="wrap clock-wrap">
    <div class="clock-head">
     <span class="label chapter-label"><span class="br">〔</span> 10:00 am <span class="br">〕</span></span>
     <h2 id="clock-title" class="t-h2">Install day on the clock</h2>
     <p>How long will your roof be open? On most homes, from breakfast to before lunch.</p>
    </div>
    <svg class="clockface" viewBox="-110 -110 220 220" aria-hidden="true" data-clockface>
     <circle r="104" class="rim"/>
     <g class="nums"></g>
     <rect class="hand h" x="-2" y="-52" width="4" height="58" rx="2" data-hand-h/>
     <rect class="hand m" x="-1.5" y="-82" width="3" height="88" rx="1.5" data-hand-m/>
     <circle r="5" class="hub"/>
    </svg>
    <div class="clock-steps">
     <p class="clock-now" aria-live="polite"><b data-clock-time>7:30 am</b><span data-clock-step>The crew arrives, covers the beds and lays plywood where trucks meet the driveway.</span></p>
     <ol class="clock-list" data-clock-list>
      <li data-t="450"><b>7:30</b> Crew arrives, beds covered</li>
      <li data-t="480"><b>8:00</b> Tear-off begins</li>
      <li data-t="720"><b>12:00</b> Deck checked, roof dried in</li>
      <li data-t="990"><b>4:30</b> Magnet sweep for nails</li>
      <li data-t="1020"><b>5:00</b> Walkthrough with you</li>
     </ol>
    </div>
   </div>
  </div>
 </div>
</template>
