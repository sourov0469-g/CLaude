<template id="tpl-inspect-2" data-class="inspect inspect--blinds seam" data-label="blinds-title">
 <div class="blind-stage" data-blind-stage>
  <div class="blind-sticky">
   <div class="blind-view" data-blind-view>
    <img class="street" src="assets/img/hero-1600.webp" alt="A house seen from the street after rain; the roof looks fine" width="1600" height="1091" decoding="async">
    <div class="slits" data-slits aria-hidden="true"></div>
    <p class="blind-label" aria-live="polite"><span data-blind-label>From the street</span></p>
   </div>
   <div class="blind-copy wrap">
    <span class="label chapter-label"><span class="br">〔</span> 6:12 am <span class="br">〕</span></span>
    <h2 id="blinds-title" class="t-display cast-host" data-split>From the street, it looks fine.</h2>
    <p>Up on the roof at 7 in the morning, with the sun low, the same kind of roof shows its bruises. That's why we inspect at an angle, photograph everything, and show you the photos.</p>
    <a class="btn btn-blue" href="#estimate" data-cta="inspect2-book" data-adds="roof">Book a free inspection</a>
    <p class="t-caption blind-cap">Illustrative stock: a street view and a close-up in low light. Two different roofs.</p>
   </div>
  </div>
 </div>
 <div class="wrap honest">
  <p class="t-display cast-host" data-split>If your roof is fine, we'll tell you. <u>In writing.</u></p>
 </div>
</template>

<template id="tpl-inspect-3" data-class="inspect inspect--ask seam" data-label="ask-title">
 <div class="wrap ask">
  <div class="ask-head">
   <span class="label chapter-label"><span class="br">〔</span> 6:12 am <span class="br">〕</span></span>
   <h2 id="ask-title" class="t-display cast-host" data-split>Ask the roof.</h2>
   <p>Five things you can check from the ground or the attic. Tap the photo if you see it.</p>
  </div>
  <div class="ask-grid">
   <ol class="ask-qs" data-ask>
    <li data-zone="gutter"><button type="button" class="ask-photo" aria-pressed="false" data-yes><img src="assets/img/sym-gutter-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Do you see granules or grit in your gutters?</span></button><button type="button" class="ask-no" aria-pressed="false" data-no>Not that I can see</button></li>
    <li data-zone="tabs"><button type="button" class="ask-photo" aria-pressed="false" data-yes><img src="assets/img/sym-tab-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Any shingle edges lifted or curling?</span></button><button type="button" class="ask-no" aria-pressed="false" data-no>Not that I can see</button></li>
    <li data-zone="ceiling"><button type="button" class="ask-photo" aria-pressed="false" data-yes><img src="assets/img/sym-stain-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>A brown stain on a ceiling or upstairs wall?</span></button><button type="button" class="ask-no" aria-pressed="false" data-no>Not that I can see</button></li>
    <li data-zone="attic"><button type="button" class="ask-photo" aria-pressed="false" data-yes><img src="assets/img/sym-attic-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Daylight through the boards in the attic?</span></button><button type="button" class="ask-no" aria-pressed="false" data-no>Not that I can see</button></li>
    <li data-zone="field"><button type="button" class="ask-photo" aria-pressed="false" data-yes><img src="assets/img/sym-curl-480.webp" alt="" width="480" height="480" loading="lazy" decoding="async"><span>Shingles cracked, buckled or missing?</span></button><button type="button" class="ask-no" aria-pressed="false" data-no>Not that I can see</button></li>
   </ol>
   <div class="ask-side">
    <svg class="ask-house" viewBox="0 0 320 220" role="img" aria-label="A cross-section of a roof that lights the parts you answer yes to: shingles, tab edges, gutters, attic and ceiling">
     <path class="z" data-z="field" d="M20 116 L160 18 L300 116 L293.1 125.8 L160 32.6 L26.9 125.8 Z"/>
     <path class="z" data-z="tabs" d="M20 116 L44.6 98.8 L51.5 108.6 L26.9 125.8 Z M300 116 L275.4 98.8 L268.5 108.6 L293.1 125.8 Z"/>
     <path class="z" data-z="attic" d="M48 140 V111 L160 32.6 L272 111 V140 Z"/>
     <rect class="z" data-z="ceiling" x="48" y="140" width="224" height="10"/>
     <path class="z" data-z="gutter" d="M8 120 h14 v12 h-14 Z M298 120 h14 v12 h-14 Z"/>
     <path class="ln2" d="M35.6 105.1 L42.4 114.9 M284.4 105.1 L277.6 114.9 M51.1 94.2 L58 104 M268.9 94.2 L262 104 M66.7 83.3 L73.6 93.1 M253.3 83.3 L246.4 93.1 M82.3 72.4 L89.1 82.2 M237.7 72.4 L230.9 82.2 M97.8 61.5 L104.7 71.3 M222.2 61.5 L215.3 71.3 M113.4 50.6 L120.3 60.5 M206.6 50.6 L199.7 60.5 M129 39.7 L135.8 49.6 M191 39.7 L184.2 49.6 M144.5 28.8 L151.4 38.7 M175.5 28.8 L168.6 38.7 M160 32.6 V140"/>
     <path class="ln" d="M20 116 L160 18 L300 116 M26.9 125.8 L160 32.6 L293.1 125.8 M20 116 L26.9 125.8 M300 116 L293.1 125.8 M8 120 V132 H22 V120 M298 120 V132 H312 V120 M48 111 V208 M272 111 V208 M48 140 H272 M48 150 H272 M24 208 H296"/>
     <g class="lb" aria-hidden="true"><text x="230" y="50">Shingles</text><text x="2" y="84">Tab edges</text><text x="15" y="146" text-anchor="middle">Gutter</text><text x="206" y="124" text-anchor="middle">Attic</text><text x="160" y="166" text-anchor="middle">Ceiling</text></g>
    </svg>
    <div class="ask-result" role="status" aria-live="polite" data-ask-result><p>Answer the five questions and the roof will tell you where to look.</p></div>
   </div>
  </div>
  <div class="ask-end">
   <p class="t-display cast-host" data-split>If your roof is fine, we'll tell you. <u>In writing.</u></p>
   <a class="btn btn-blue" href="#estimate" data-cta="inspect3-book" data-adds="roof">Book a free inspection</a>
  </div>
  <p class="t-caption ask-cap">Photos are stock examples of each sign, not Rembrandt jobs.</p>
 </div>
</template>
