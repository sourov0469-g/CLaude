  <div class="wv3-pin">

      <h2 class="t-h2" data-cursor="text"><span class="ln"><span>Same house.</span></span></h2>
      <p class="wv3-state" aria-hidden="true"><span class="wv3-sb is-on">Before</span><span class="wv3-sa">After</span></p>

      <div class="wv3-stage" data-cursor="view">

        <figure class="wv3-fa ph"><img data-img="ba2-after" alt="After: the same house with its new roof" decoding="async"><figcaption class="wv3-cap">After</figcaption></figure>

      </div>
    </div>
