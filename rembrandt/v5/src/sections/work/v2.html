<div class="wv wv2">
  <div class="wv2-pin">
    <div class="wv2-head">
      <h2 class="t-h2" data-cursor="text"><span class="ln"><span>House by house.</span></span></h2>
      <a class="tlink" href="#call" data-cursor="link">Get an estimate</a>
    </div>
    <div class="wv2-view" tabindex="0" role="region" aria-label="Photos of Rembrandt jobs, scroll sideways">
      <ul class="wv2-track" role="list">
        <li class="wv2-f" data-cursor="view"><figure class="ph"><img data-img="ba2-before" alt="Before: a brick home with its old, dark roof" decoding="async"></figure><p class="wv2-c">Before</p></li>
        <li class="wv2-f" data-cursor="view"><figure class="ph"><img data-img="ba2-after" alt="After: the same brick home with its new roof" decoding="async"></figure><p class="wv2-c">After</p></li>
        <li class="wv2-f" data-cursor="view"><figure class="ph"><img data-img="tudor" alt="A Tudor-style home under old shade trees" decoding="async"></figure></li>
        <li class="wv2-f" data-cursor="view"><figure class="ph"><img data-img="job-charcoal" alt="A brick ranch with a new charcoal roof and a blue gable" decoding="async"></figure></li>
        <li class="wv2-f" data-cursor="view"><figure class="ph"><img data-img="ba1-after" alt="A blue-sided home with a Rembrandt yard sign by the walk" decoding="async"></figure></li>
        <li class="wv2-f" data-cursor="view"><figure class="ph"><img data-img="job-truck" alt="The Rembrandt truck parked at a brick ranch" decoding="async"></figure></li>
      </ul>
    </div>
    <div class="wv2-prog" aria-hidden="true"><span></span></div>
  </div>
</div>
