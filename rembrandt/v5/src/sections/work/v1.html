<div class="wv wv1">
  <div class="wv1-head">
    <h2 class="t-h2" data-cursor="text"><span class="ln"><span>Same house.</span></span><span class="ln"><span>New roof.</span></span></h2>
    <a class="tlink" href="#call" data-cursor="link">Get an estimate</a>
  </div>
  <label class="vh" for="wv1-range">Divider between the before and after photos</label>
  <input class="wv1-range" id="wv1-range" type="range" min="15" max="85" step="1" value="50" aria-valuetext="Even split">
  <div class="wv1-stage" data-cursor="drag">
    <figure class="wv1-p wv1-pb ph"><img data-img="ba2-before" alt="Before: the house with its old, dark roof" decoding="async"></figure>
    <figure class="wv1-p wv1-pa ph"><img data-img="ba2-after" alt="After: the same house with its new roof" decoding="async"></figure>
    <div class="wv1-bar" aria-hidden="true"><span class="wv1-knob">ICON_SPLIT</span></div>
  </div>
  <div class="wv1-caps" aria-hidden="true"><span class="wv1-cap wv1-cb">Before</span><span class="wv1-cap wv1-ca">After</span></div>
</div>
