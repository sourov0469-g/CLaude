<div class="fv fv2">
  <h2 class="vh">The family, year by year</h2>
  <div class="fv2-tl">
    <span class="fv2-rail" aria-hidden="true"><span class="fv2-fill"></span></span>
    <ol class="fv2-list" role="list">
      <li class="fv2-step">
        <span class="fv2-dot" aria-hidden="true"></span>
        <h3 class="fv2-y num" data-cursor="text"><span class="ln"><span>1995</span></span></h3>
        <p class="fv2-t">Bunk Walker starts Rembrandt.</p>
        <span class="fv2-gh num" aria-hidden="true" data-sy="70"><span data-pd="-0.025">1995</span></span>
      </li>
      <li class="fv2-step">
        <span class="fv2-dot" aria-hidden="true"></span>
        <h3 class="fv2-y num" data-cursor="text" data-from="1995"><span class="ln"><span>2015</span></span></h3>
        <p class="fv2-t">His son Wade takes the lead.</p>
        <span class="fv2-gh num" aria-hidden="true" data-sy="70"><span data-pd="-0.025">2015</span></span>
      </li>
      <li class="fv2-step fv2-now">
        <span class="fv2-dot" aria-hidden="true"></span>
        <h3 class="fv2-y" data-cursor="text"><span class="ln"><span>Today</span></span></h3>
        <p class="fv2-t">Rachel answers the phone.</p>
        <a class="tlink fv2-cta" href="#call" data-cursor="link">Get an estimate</a>
        <figure class="fv2-ph ph" data-cursor="view">
          <div class="fv2-sy" data-sy="12"><div class="fv2-pd" data-pd="0.02"><img data-img="team" alt="Nine Rembrandt staff in company shirts outside the office, under the Rembrandt roofing and restoration sign" decoding="async"></div></div>
        </figure>
      </li>
    </ol>
  </div>
</div>
