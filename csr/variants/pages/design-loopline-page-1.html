<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{ margin:0; padding:0; width:1600px; height:900px; overflow:hidden; }
</style>
</head><body>
<div class="design-loopline" style="display:contents">
<style>
    .design-loopline {
      --ink-bg:#142B26;
      --ink-surface:#1B3832;
      --ink-text:#EDEFEA;
      --paper-bg:#F1F3EE;
      --paper-surface:#E3E7DE;
      --paper-text:#142B26;
      --accent:#E4544E;
      --strength:#5B8C6C;
      --gap:#B06A3A;
      --font-display:'Space Grotesk', sans-serif;
      --font-body:'IBM Plex Sans', sans-serif;
      --font-mono:'IBM Plex Mono', monospace;
      font-family: var(--font-body);
      box-sizing: border-box;
    }
    .design-loopline *, .design-loopline *::before, .design-loopline *::after {
      box-sizing: border-box;
    }

    .design-loopline .d-page {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ---------- grounds ---------- */
    .design-loopline .d-page.ink { background: var(--ink-bg); color: var(--ink-text); }
    .design-loopline .d-page.paper { background: var(--paper-bg); color: var(--paper-text); }

    /* ---------- header rail ---------- */
    .design-loopline .rail-head {
      flex: 0 0 clamp(30px, 5.2%, 44px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 3.2%, 36px);
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: clamp(16px, 1.05vw, 18px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.72;
      z-index: 3;
    }
    .design-loopline .d-page.ink .rail-head { border-bottom: 1px solid rgba(237,239,234,0.14); }
    .design-loopline .d-page.paper .rail-head { border-bottom: 1px solid rgba(20,43,38,0.14); }

    /* ---------- content zone: fixed height, grid-centered ---------- */
    .design-loopline .zone {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      place-items: center;
      position: relative;
      padding: clamp(14px, 2.4%, 28px) clamp(28px, 4.6%, 52px);
      z-index: 2;
    }
    .design-loopline .zone > .zone-inner {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    /* ---------- footer rail: the ambient Loopline ---------- */
    .design-loopline .rail-foot {
      flex: 0 0 48px;
      position: relative;
      overflow: hidden;
      z-index: 3;
    }
    .design-loopline .d-page.ink .rail-foot { border-top: 1px solid rgba(237,239,234,0.14); }
    .design-loopline .d-page.paper .rail-foot { border-top: 1px solid rgba(20,43,38,0.14); }
    .design-loopline .rail-foot svg { width: 100%; height: 100%; display: block; }
    .design-loopline .rail-foot .loop-track {
      fill: none;
      stroke-width: 1.6;
      opacity: 0.35;
    }
    .design-loopline .d-page.ink .rail-foot .loop-track { stroke: var(--ink-text); }
    .design-loopline .d-page.paper .rail-foot .loop-track { stroke: var(--paper-text); }
    .design-loopline .rail-foot .loop-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
    }
    .design-loopline .rail-foot .loop-node {
      fill: var(--accent);
    }

    /* ---------- shared type ---------- */
    .design-loopline .headline {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .design-loopline .sub {
      font-family: var(--font-body);
      font-weight: 400;
      line-height: 1.4;
      margin: 0;
    }
    .design-loopline .tag-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .design-loopline .tag {
      font-family: var(--font-mono);
      font-size: clamp(16px, 0.95vw, 17px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 11px;
      border: 1px solid currentColor;
      opacity: 0.85;
      white-space: nowrap;
    }
    .design-loopline .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: clamp(16px, 0.9vw, 17px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 11px 4px 9px;
      white-space: nowrap;
    }
    .design-loopline .chip.strength { background: var(--strength); color: #0E1F1A; }
    .design-loopline .chip.gap { background: var(--gap); color: #1E1108; }
    .design-loopline .chip.accent { background: var(--accent); color: #2A0906; }
    .design-loopline .chip.high { background: var(--paper-text); color: var(--paper-bg); }
    .design-loopline .chip .dot {
      width: 6px; height: 6px; background: currentColor; display: inline-block;
    }

    /* corner tick mark frame — the only "container" motif besides loop curves */
    .design-loopline .instrument {
      position: relative;
      border: 1px solid currentColor;
    }
    .design-loopline .instrument::before,
    .design-loopline .instrument::after,
    .design-loopline .instrument .tick-tl,
    .design-loopline .instrument .tick-br {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
    }
    .design-loopline .instrument::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
    }
    .design-loopline .instrument::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--accent);
      border-right: 2px solid var(--accent);
    }
    .design-loopline .instrument img,
    .design-loopline .instrument video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .design-loopline .instrument-cap {
      position: absolute;
      left: 8px;
      bottom: 8px;
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(20,43,38,0.72);
      color: #EDEFEA;
      padding: 3px 8px;
      z-index: 2;
    }

    /* ============ PAGE 1 — TITLE ============ */
    .design-loopline .p1-zone { grid-template-columns: 1fr; }
    .design-loopline .p1-inner {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: clamp(20px, 3vw, 40px);
      width: 100%;
      height: 100%;
    }
    .design-loopline .p1-left {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2vw, 20px);
      justify-content: center;
    }
    .design-loopline .p1-left .headline {
      font-size: clamp(30px, 4.1vw, 50px);
    }
    .design-loopline .p1-left .sub {
      font-size: clamp(16px, 1.5vw, 19px);
      opacity: 0.82;
      max-width: 34ch;
    }
    .design-loopline .p1-right {
      display: grid;
      place-items: center;
      height: 100%;
    }
    .design-loopline .p1-right svg { width: 88%; height: auto; max-height: 100%; }

    /* ============ PAGE 2 — COMMUNITY ============ */
    .design-loopline .p2-inner {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      grid-template-rows: 100%;
      gap: clamp(22px, 3.4vw, 42px);
      align-items: center;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .design-loopline .p2-left {
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8vw, 18px);
    }
    .design-loopline .p2-left .headline { font-size: clamp(24px, 3vw, 34px); }
    .design-loopline .fact {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: clamp(10px, 1.4vw, 14px) 0;
      border-top: 1px solid rgba(237,239,234,0.16);
    }
    .design-loopline .fact:first-of-type { border-top: 1px solid rgba(237,239,234,0.16); }
    .design-loopline .fact-title {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: clamp(16px, 1.5vw, 19px);
    }
    .design-loopline .fact-body {
      font-size: clamp(16px, 1.15vw, 17px);
      line-height: 1.4;
      opacity: 0.88;
      max-width: 48ch;
    }
    .design-loopline .reading-line {
      font-size: clamp(16px, 1.05vw, 16.5px);
      opacity: 0.75;
      line-height: 1.35;
      max-width: 52ch;
    }
    .design-loopline .reading-line b { color: var(--accent); font-weight: 600; }
    .design-loopline .p2-right {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: clamp(10px, 1.6vw, 16px);
      height: 100%;
      min-height: 0;
    }
    .design-loopline .p2-right .instrument { height: 100%; min-height: 0; overflow: hidden; }

    /* ============ PAGE 3 — SUGGESTION DIAGRAM ============ */
    .design-loopline .p3-inner {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(6px, 1vw, 10px);
    }
    .design-loopline .p3-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .design-loopline .p3-head-left { display: flex; flex-direction: column; gap: 6px; max-width: 58%; }
    .design-loopline .p3-head .headline { font-size: clamp(21px, 2.6vw, 28px); }
    .design-loopline .p3-head .sub { font-size: clamp(16px, 1.05vw, 16.5px); opacity: 0.78; max-width: 50ch; }
    .design-loopline .p3-body {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: clamp(10px, 1.4vw, 16px);
      min-height: 0;
    }
    .design-loopline .p3-diagram {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      min-height: 0;
    }
    .design-loopline .p3-diagram-box {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 720 / 300;
      margin: 0 auto;
    }
    .design-loopline .p3-diagram-box svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .design-loopline .loop-node-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: var(--font-mono);
      font-size: clamp(16px, 1.05vw, 17px);
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--paper-text);
      white-space: nowrap;
    }
    .design-loopline .p3-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(12px, 1.6vw, 20px);
    }
    .design-loopline .instrument-card {
      background: var(--paper-surface);
      border: 1px solid rgba(20,43,38,0.28);
      padding: clamp(8px, 1vw, 12px) clamp(10px, 1.2vw, 14px);
    }
    .design-loopline .instrument-card .ic-label {
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.62;
      margin-bottom: 4px;
    }
    .design-loopline .instrument-card .ic-value {
      font-family: var(--font-body);
      font-size: clamp(16px, 1vw, 16.5px);
      line-height: 1.3;
      font-weight: 400;
    }

    /* ============ PAGE 4 — IMPACT & ROI ============ */
    .design-loopline .p4-inner {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: clamp(8px, 1.4vw, 14px);
    }
    .design-loopline .p4-inner .headline { font-size: clamp(21px, 2.6vw, 29px); }
    .design-loopline .p4-table {
      width: 100%;
      display: grid;
      grid-template-columns: 26px 1.2fr 1.15fr 1.55fr 0.68fr;
      align-items: stretch;
      border-top: 1px solid rgba(20,43,38,0.22);
    }
    .design-loopline .p4-table .cell {
      padding: clamp(6px, 1vw, 10px) 10px;
      border-bottom: 1px solid rgba(20,43,38,0.14);
      display: flex;
      align-items: center;
      font-size: clamp(16px, 1.02vw, 16.5px);
      line-height: 1.28;
    }
    .design-loopline .p4-table .cell.head {
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
      border-bottom: 1px solid rgba(20,43,38,0.3);
      padding-bottom: 8px;
    }
    .design-loopline .p4-table .cell.glyph { justify-content: center; padding: 6px 4px; }
    .design-loopline .p4-table .cell.glyph svg { width: 22px; height: 22px; }
    .design-loopline .p4-table .cell.init { font-weight: 600; font-family: var(--font-body); }
    .design-loopline .p4-table .cell.priority-wrap { padding-left: 6px; }
    .design-loopline .p4-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: clamp(16px, 1vw, 16.5px);
      letter-spacing: 0.04em;
      opacity: 0.8;
      border-top: 1px solid rgba(20,43,38,0.22);
      padding-top: clamp(6px, 1vw, 10px);
    }
    .design-loopline .p4-foot .foot-dot {
      width: 7px; height: 7px; background: var(--paper-text); opacity: 0.6; display: inline-block; margin-right: 8px;
    }
  </style>

<span class="tag">Business Ethics</span>

<div class="p1-right">

</div>
</div>

</div>
