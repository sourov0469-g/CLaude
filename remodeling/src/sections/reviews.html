<section id="reviews" class="sec reviews g-surface" data-section="reviews" aria-labelledby="reviews-h">
  <!-- OWNER (after the finalize): the constellation is back. 343 small stars, one per published Google review, fly in
       together and assemble into the average, 4.8. The pointer scatters them; they spring back on their own. Touch: a tap
       scatters them. Aggregate-led ONLY: the two published figures, 4.8 and 343, and a link to the firm's own listing.
       No quote, no reviewer name, nothing invented. -->
  <div class="ver rv" data-v="1">
    <div class="wrap rv__head">
      <div>
        <p class="eyebrow"><svg class="eyebrow__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M38 7.5 H10 V40.5 H38"/></svg>Google reviews</p>
        <h2 class="t-head" id="reviews-h"><span class="nums">343</span> reviews. <span class="acc">One average.</span></h2>

      <p class="t-lead rv__lead">Every star here is one review on our Google listing. Touch them or run a pointer through them: they scatter, then find their way back to the average.</p>

      <figure class="rv__sky">

    <div class="wrap rv__acts">

    </div>
