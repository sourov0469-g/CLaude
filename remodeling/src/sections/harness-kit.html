<section id="harness-kit" class="sec g-surface" data-section="harness-kit" aria-labelledby="harness-h">
  <!-- FINALIZE Phase 2 test harness (not shipped): one element of every kind the companion reacts to. -->
  <div class="ver" data-v="1">
    <div class="wrap" style="padding-block:120px 160px;display:grid;gap:56px">
      <h2 class="t-head" id="harness-h">Companion harness</h2>
      <div style="display:flex;gap:48px;align-items:center;flex-wrap:wrap">
        <a id="k-link" class="link" href="#harness-kit">A text link to the projects</a>
        <a id="k-cta" class="btn" href="#harness-kit"><span class="btn__label">Book a consultation</span></a>
        <button id="k-btn" type="button" class="btn btn--ghost"><span class="btn__label">A secondary button</span></button>
        <a id="k-tel" class="link nums" href="tel:+17542360675">(754)&nbsp;236&#8209;0675</a>
        <button id="k-dis" type="button" class="btn" disabled><span class="btn__label">Disabled</span></button>
      </div>
      <div style="display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap">
        <figure id="k-img" style="margin:0;width:320px"><img data-img="k-navy-shaker" alt="Navy Blue Shaker Kitchen" width="320" height="220" style="width:320px;height:220px;object-fit:cover;background:var(--color-border-subtle)"></figure>
        <label style="display:grid;gap:6px">Your name <input id="k-type" type="text" style="width:260px;height:44px"></label>
        <fieldset style="border:0;padding:0;display:grid;gap:8px"><legend>Scope</legend>
          <label><input id="k-radio" type="radio" name="h"> Kitchen</label><label><input type="checkbox"> Not sure</label></fieldset>
      </div>
      <div style="display:flex;gap:48px;align-items:center;flex-wrap:wrap">
        <div id="k-slider" role="slider" tabindex="0" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" aria-label="Seam" style="width:260px;height:44px;border:1.5px solid var(--color-border-strong);border-radius:22px"></div>
        <div id="k-drag" data-drag style="width:120px;height:120px;background:var(--color-accent-subtle);border:1.5px solid var(--color-border-strong)">Drag box</div>
        <button id="k-town" type="button" data-buddy="point" class="link" style="background:none;border:0">Coral Gables</button>
      </div>
      <div id="k-watch" data-buddy-watch style="height:240px;background:var(--color-surface-sunken, #f3eee9);display:grid;place-items:center">A pinned scene the companion watches from the corner</div>
      <p id="k-text" style="max-width:60ch">Plain body copy. The companion follows the pointer here without reacting, and its eyes track the tip.</p>
    </div>
  </div>
</section>
