<section id="voices" class="sec voices g-base" data-section="voices" aria-labelledby="voices-h">
  <!-- OWNER (after the finalize): "it says 4.8 but it shows no reviews". The reviews themselves, right after the average:
       the twenty five-star reviews published on the firm's Google listing (FACTS.md "Published Google reviews"), quoted
       exactly as written, the reviewer's name and the date exactly as shown. Nothing invented, nothing tidied inside the
       quote marks. Mobile first: a swipeable row of cards, long reviews folded with "Read all", filters by room. -->
  <div class="ver vc" data-v="1">
    <div class="wrap vc__head">
      <div>
        <p class="eyebrow"><svg class="eyebrow__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M38 7.5 H10 V40.5 H38"/></svg>In their words</p>
        <h2 class="t-head" id="voices-h">What homeowners <span class="acc">wrote.</span></h2>
      </div>
      <p class="t-lead vc__lead">Twenty of the <span class="nums">343</span> reviews on our Google listing, quoted exactly as they were written.</p>
    </div>
    <div class="wrap vc__bar">
      <div class="vc__chips" role="group" aria-label="Show reviews about">
        <button type="button" class="vc__chip" data-f="all" aria-pressed="true">All</button>
        <button type="button" class="vc__chip" data-f="kitchen" aria-pressed="false">Kitchens</button>
        <button type="button" class="vc__chip" data-f="bath" aria-pressed="false">Bathrooms</button>
        <button type="button" class="vc__chip" data-f="other" aria-pressed="false">Other projects</button>
      </div>
      <div class="vc__nav">
        <span class="vc__count nums" aria-live="polite"></span>
        <button type="button" class="vc__btn" data-d="-1" aria-label="Previous reviews"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button type="button" class="vc__btn" data-d="1" aria-label="Next reviews"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <ul class="vc__rail" aria-label="Google reviews" tabindex="0"></ul>
    <div class="wrap vc__foot">
      <p class="vc__avg"><span class="vc__stars" aria-hidden="true">&#9733;&#9733;&#9733;&#9733;&#9733;</span><span><span class="nums">4.8</span> average across <span class="nums">343</span> Google reviews</span></p>
      <a class="btn" href="#consult"><span class="btn__label">Book a consultation</span></a>
    </div>
  </div>
</section>
