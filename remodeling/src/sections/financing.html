<section id="financing" class="sec financing g-surface" data-section="financing" aria-labelledby="financing-h">
  <!-- OWNER (second pass): the four cards in a row "look good but the layout does not make sense". Three layouts that read
       as question then answer. V1 ask then answer (pick your project on the left; only the partners that usually fit
       appear on the right, with the reason). V2 two kinds of money (consumer credit beside property-assessed; a switch
       for inside the home or outside and energy). V3 the wallet (a fanned stack of the four cards; pull one out to read
       it, including what it usually fits). Every figure and line is the partners' own as the firm publishes them
       (FACTS.md "Financing"); the routing is the firm's framing. The firm is not a lender: the line stays by the action. -->
  <div class="ver fa" data-v="1">
    <div class="wrap fa__grid">
      <div class="fa__side">
        <p class="eyebrow"><svg class="eyebrow__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M38 7.5 H10 V40.5 H38"/></svg>Financing partners</p>
        <h2 class="t-head" id="financing-h">What are you <span class="acc">building?</span></h2>
        <div class="fa__opts" role="group" aria-label="What are you building?"></div>
      </div>
      <div class="fa__ans" aria-live="polite">
        <p class="fa__lbl">Usually fits</p>
        <p class="fa__why"></p>
        <ul class="fa__list"></ul>
      </div>
    </div>
    <div class="wrap fz-foot"></div>
  </div>
  <div class="ver fb" data-v="2" hidden>
    <div class="wrap fb__head">
      <div>
        <p class="eyebrow"><svg class="eyebrow__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M38 7.5 H10 V40.5 H38"/></svg>Financing partners</p>
        <h2 class="t-head" id="financing-h-2">Two kinds of money. <span class="acc">Four partners.</span></h2>
      </div>
      <div class="fb__seg" role="group" aria-label="Where is the work?">
        <button type="button" class="fb__sb" data-w="in" aria-pressed="false">Inside the home</button>
        <button type="button" class="fb__sb" data-w="out" aria-pressed="false">Outside and energy</button>
        <button type="button" class="fb__sb" data-w="all" aria-pressed="true">Show both</button>
      </div>
    </div>
    <div class="wrap fb__split"></div>
    <div class="wrap fz-foot"></div>
  </div>
  <div class="ver fw" data-v="3" hidden>
    <div class="wrap fw__grid">
      <div class="fw__side">
        <p class="eyebrow"><svg class="eyebrow__mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M38 7.5 H10 V40.5 H38"/></svg>Financing partners</p>
        <h2 class="t-head" id="financing-h-3">Four partners. <span class="acc">Pull one out.</span></h2>
        <div class="fw__wallet" role="group" aria-label="The four financing partners"></div>
        <p class="fw__hint" aria-hidden="true">Point at a card, or tap it.</p>
      </div>
      <div class="fw__detail" aria-live="polite"></div>
    </div>
    <div class="wrap fz-foot"></div>
  </div>
</section>
