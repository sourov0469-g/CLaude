<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#17111D;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const q=new URLSearchParams(location.search);
const W=+q.get('w')||1600,H=+q.get('h')||900, MODE=q.get('mode')||'rest';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true});
r.setSize(W,H); r.setPixelRatio(1); r.outputColorSpace=THREE.SRGBColorSpace;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05; r.shadowMap.enabled=true;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.fog=new THREE.Fog(0x17111D,34,62);
const cam=new THREE.PerspectiveCamera(22,W/H,0.1,200);
cam.position.set(-13.5,11.5,19.5); cam.lookAt(0.9,4.0,0.6);
const L=new THREE.TextureLoader();
const load=(u,rx,ry)=>{const t=L.load(u);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);return t;};
const texSh=load('/d1/shingle.jpg',1,1), texOsb=load('/d1/osb.jpg',3,2), texBr=load('/d1/brick.jpg',1,1);
// lights
scene.add(new THREE.HemisphereLight(0x9a8fa8,0x17111D,0.55));
const key=new THREE.DirectionalLight(0xffd7a0,2.4); key.position.set(-14,18,10); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); Object.assign(key.shadow.camera,{left:-14,right:14,top:14,bottom:-14}); scene.add(key);
const rim=new THREE.DirectionalLight(0xEAA221,0.9); rim.position.set(12,6,-14); scene.add(rim);
// house body
const HW=10, HD=7, WH=3, RISE=2.3, OV=0.55;
const wallM=new THREE.MeshStandardMaterial({color:0x2b2233,roughness:.9});
const body=new THREE.Mesh(new THREE.BoxGeometry(HW,WH,HD),wallM); body.position.y=WH/2; body.castShadow=body.receiveShadow=true; scene.add(body);
const gs=new THREE.Shape(); gs.moveTo(-HD/2,0); gs.lineTo(HD/2,0); gs.lineTo(0,RISE); gs.closePath();
for(const s of [-1,1]){const g=new THREE.Mesh(new THREE.ShapeGeometry(gs),wallM); g.rotation.y=Math.PI/2*s; g.position.set(s*HW/2,WH,0); scene.add(g);}
// windows (amber lit, simple)
const winM=new THREE.MeshStandardMaterial({color:0x0e0a10,emissive:0xEAA221,emissiveIntensity:.025,roughness:.25,metalness:.2});
for(const x of [-3,0,3]){const w=new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.3),winM); w.position.set(x,1.6,HD/2+0.01); scene.add(w);}
// roof halves
const halfZ=HD/2+OV, slopeLen=Math.hypot(halfZ,RISE+OV*RISE/(HD/2)), ang=Math.atan2(RISE,HD/2);
const hover=MODE==='hover'?{u:0.44,v:0.46,rad:0.33}:null; // in roof-uv (u along ridge 0..1, v ridge->eave 0..1) front half
const seamM=new THREE.MeshBasicMaterial({color:0xEAA221});
function half(side){
  const g=new THREE.Group(); // local: x along ridge, -y down slope? use plane: x along ridge, z down slope from ridge
  const len=slopeLen, wid=HW+OV*2;
  g.position.set(0,WH+RISE,0); g.rotation.x = side>0? ang : -ang; if(side<0) g.rotation.y=Math.PI;
  // deck OSB (slightly below)
  const deck=new THREE.Mesh(new THREE.PlaneGeometry(wid,len),new THREE.MeshStandardMaterial({map:texOsb,roughness:.85}));
  deck.rotation.x=-Math.PI/2; deck.position.set(0,-0.045,len/2); deck.receiveShadow=true; g.add(deck);
  const rows=15, exp=len/rows, tabW=1.0;
  const geo=new THREE.BoxGeometry(1,1,1);
  for(let i=0;i<rows;i++){
    const off=(i%2)*tabW/2; const n=Math.ceil(wid/tabW)+1;
    for(let j=0;j<n;j++){
      const x0=-wid/2+j*tabW-off; const xa=Math.max(x0,-wid/2), xb=Math.min(x0+tabW,wid/2); if(xb-xa<0.05) continue;
      const cx=(xa+xb)/2, w=(xb-xa)-0.03;
      const z0=i*exp; // top edge of this course
      const uvU=(cx+wid/2)/wid, uvV=(z0+exp/2)/len;
      const m=new THREE.MeshStandardMaterial({map:texSh.clone(),roughness:.78,metalness:0});
      m.map.repeat.set(0.16,0.12); m.map.offset.set((uvU*5.3)%0.84, (uvV*3.7)%0.88); m.map.needsUpdate=true;
      const tint=0.80+((i*7+j*13)%5)*0.04; m.color.setRGB(tint,tint,tint);
      const pivot=new THREE.Group(); pivot.position.set(cx,0,z0); g.add(pivot);
      const tab=new THREE.Mesh(geo,m); tab.scale.set(w,0.035,exp*1.35); tab.position.set(0,0.0+(i*0.0004),exp*1.35/2); tab.castShadow=tab.receiveShadow=true; pivot.add(tab);
      if(hover&&side>0){
        const du=(uvU-hover.u)*wid/len, dv=(uvV-hover.v); const d=Math.hypot(du,dv)/hover.rad;
        if(d<1){ const k=Math.pow(1-d,1.3); pivot.rotation.x=-k*1.15; pivot.rotation.z=(((i*3+j)%5)-2)*0.05*k; pivot.position.y+=k*k*0.9;
          if(k>0.08){const s=new THREE.Mesh(new THREE.BoxGeometry(w,0.012,0.03),seamM); s.position.set(cx,-0.03,z0+0.02); g.add(s);} }
      }
    }
  }
  // ridge cap
  if(side>0){const rc=new THREE.Mesh(new THREE.BoxGeometry(wid,0.12,0.5),new THREE.MeshStandardMaterial({color:0x1e1a20,roughness:.8})); rc.position.set(0,0.05,0.05); g.add(rc);}
  scene.add(g); return g;
}
const front=half(1); half(-1);
if(hover){ // amber light in the opening
  const wid=HW+OV*2; const lx=-wid/2+hover.u*wid, lz=hover.v*slopeLen;
  const p=new THREE.PointLight(0xEAA221,40,4.6,1.4); p.position.set(lx,0.35,lz); front.add(p);
  const p2=new THREE.PointLight(0xffc766,6,2.2,2); p2.position.set(lx,0.05,lz); front.add(p2);
}
// chimney with brick from v22
const ch=new THREE.Mesh(new THREE.BoxGeometry(0.9,3.4,0.9),new THREE.MeshStandardMaterial({map:texBr,roughness:.9}));
ch.position.set(2.6,WH+RISE+0.2,-1.0); ch.castShadow=true; scene.add(ch);
const cap=new THREE.Mesh(new THREE.BoxGeometry(1.05,0.12,1.05),new THREE.MeshStandardMaterial({color:0x6b6460})); cap.position.set(2.6,WH+RISE+1.95,-1.0); scene.add(cap);
// soft ground shadow catcher
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.ShadowMaterial({opacity:.45})); gnd.rotation.x=-Math.PI/2; gnd.receiveShadow=true; scene.add(gnd);
THREE.DefaultLoadingManager.onLoad=()=>{ r.render(scene,cam); requestAnimationFrame(()=>{r.render(scene,cam); window.__done=true;}); };
setTimeout(()=>{ if(!window.__done){r.render(scene,cam); window.__done=true;} },8000);
</script></body></html>
