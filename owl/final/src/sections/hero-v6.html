<style>

.hero6 .trust{margin-top:clamp(16px,2vw,24px)}
.hero6 .lede,.hero6 .keys,.hero6 .ans{opacity:0;transform:translateY(12px);transition:opacity .7s var(--ease),transform .7s var(--ease)}

</style>
