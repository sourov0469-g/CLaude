<section class="sec hero2" aria-labelledby="h2-a">
<style>
/* V2 · Living Owl — the hero artwork in slight 3D: depth planes, a breathing owl whose head, eye and wings move a little.
   ⟦S0489⟧ creature motion · ⟦S1330⟧ split depth · ⟦S1338⟧⟦S1331⟧ flowmap surface · ⟦S0407⟧ runoff lines · ⟦S0451⟧ title */
section.hero2{padding-top:clamp(10px,1.2vw,18px);padding-bottom:clamp(36px,4vw,64px);overflow:hidden}
.hero2 .top{position:relative;z-index:3;text-align:center;max-width:1100px;margin-inline:auto}
.hero2 .eyebrow{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:16px;color:var(--ink-70)}
.hero2 .eyebrow svg{width:64px;height:10px;flex:none;overflow:visible}
.hero2 .eyebrow path{fill:none;stroke:var(--amber);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.77,0,.175,1) .5s}
.hero2.go .eyebrow path{stroke-dashoffset:0}
.hero2 .h1{font-size:clamp(40px,5vw,72px);margin-top:6px}
.hero2 .lede{margin:10px auto 0;max-width:62ch;opacity:0;transform:translateY(10px);transition:opacity .8s var(--ease) .75s,transform .8s var(--ease) .75s}
.hero2.go .lede{opacity:1;transform:none}
.hero2 .stage{position:relative;width:min(100%,980px);margin:4px auto 0;--px:0;--py:0}
.hero2 .art{position:relative;aspect-ratio:1180/766}
.hero2 .plane{position:absolute;inset:0;transition:transform .9s cubic-bezier(.22,1,.36,1)}
.hero2 .sky{transform:translate3d(calc(var(--px) * -14px),calc(var(--py) * -8px),0)}
.hero2 .owlp{transform:translate3d(calc(var(--px) * 5px),calc(var(--py) * 3px),0)}
.hero2 .fore{transform:translate3d(calc(var(--px) * 26px),calc(var(--py) * 14px),0);pointer-events:none}
.hero2 svg.sk{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hero2 .cloud{fill:none;stroke:rgba(23,17,29,.09);stroke-width:2.2;stroke-linecap:round}
.hero2 .runoff{fill:none;stroke-linecap:round;stroke-width:3;stroke-dasharray:2 26;animation:h2run 1.6s linear infinite}
.hero2 .runoff.a{stroke:rgba(23,17,29,.28)}.hero2 .runoff.b{stroke:rgba(199,135,26,.55);animation-duration:2.3s;stroke-width:2.4}
@keyframes h2run{to{stroke-dashoffset:-28}}
.hero2 .drop{stroke:rgba(23,17,29,.28);stroke-width:1.6;stroke-linecap:round}
.hero2 .glow{position:absolute;left:30%;right:20%;bottom:4%;height:30%;background:radial-gradient(closest-side,rgba(234,162,33,.28),transparent);filter:blur(6px)}
.hero2 canvas.gl,.hero2 img.still{position:absolute;inset:0;width:100%;height:100%}
.hero2 img.still{object-fit:contain;padding:1.5%}
.hero2.gl-on img.still{visibility:hidden}
.hero2 .fore i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(220,212,190,.35) 60%,transparent 70%);filter:blur(1.5px);box-shadow:inset 0 0 0 1px rgba(23,17,29,.05)}
.hero2 .ctas{position:absolute;inset:auto 0 7% 0;display:flex;justify-content:space-between;align-items:end;gap:16px;z-index:4;pointer-events:none;padding-inline:1%}
.hero2 .ctas a{pointer-events:auto}
.hero2 .fold{position:absolute;right:0;top:0;z-index:4;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--paper);font-weight:600;font-size:15px;box-shadow:0 1px 0 #fff inset,0 10px 22px -12px rgba(23,17,29,.45),0 0 0 1px rgba(23,17,29,.06)}
.hero2 .fold[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.hero2 .fold svg{width:20px;height:20px}
.hero2 .trust{margin-top:clamp(18px,2.4vw,30px)}
@media (max-width:760px){.hero2 .ctas{position:static;flex-direction:column;align-items:stretch;gap:20px;margin-top:10px;padding:0}.hero2 .ctas .btn-tab{width:100%}.hero2 .fold{position:relative;display:flex;margin:6px auto 0;top:auto}.hero2 .eyebrow svg{display:none}}
@media (prefers-reduced-motion:reduce){.hero2 .runoff{animation:none}.hero2 .plane{transition:none}.hero2 .lede{opacity:1;transform:none;transition:none}.hero2 .eyebrow path{stroke-dashoffset:0;transition:none}}
</style>

<script>
OWL.reg('hero','2',function(root){
  /* the owl is one painting; to move its head, eye and wings without cutting it apart, the painting is laid on a
     fine mesh and the mesh is bent around pivots (neck, shoulders, feet). Rules from ⟦S0489⟧: small amplitudes, arcs
     around pivots, follow-through by delay, blink ~110 ms close / 40 ms hold / 190 ms open every 3–4 s, never teleport,
     frame 0 is a good drawing. */
  var h1 = root.querySelector('.h1'), stage = root.querySelector('.stage'), cv = root.querySelector('canvas.gl'), img = root.querySelector('img.still'), fold = root.querySelector('.fold');
  var sec = root.querySelector('section'); OWL.split(h1, 120); OWL.reveal(h1); requestAnimationFrame(function(){ sec.classList.add('go'); });
  var NS = 'http://www.w3.org/2000/svg';
  /* rain falls only until it meets the runoff line over the wings ⟦S1341⟧ (seeded, linear, ±20 % speed) */
  (function rain(){
    var g = root.querySelector('.rain'); if (OWL.reduce) return;
    var paths = root.querySelectorAll('.runoff.a'), pts = [];
    paths.forEach(function(pa){ var L = pa.getTotalLength(); for (var k = 0; k <= 80; k++){ var q = pa.getPointAtLength(L * k / 80); pts.push([q.x, q.y]); } });
    function topY(x){ var best = 1e9, y = 700; pts.forEach(function(q){ var d = Math.abs(q[0] - x); if (d < best && q[1] < y + 400){ best = d; y = q[1]; } }); return best < 40 ? y : 700; }
    for (var i = 0; i < 34; i++){
      var r = (Math.sin(i * 91.7) + 1) / 2, r2 = (Math.sin(i * 37.3 + 2) + 1) / 2, x = 10 + r * 1160, y1 = topY(x) - 10;
      if (y1 > 600 || y1 < 90) continue;
      var l = document.createElementNS(NS, 'line'); l.setAttribute('class', 'drop'); l.setAttribute('x1', x); l.setAttribute('x2', x - 4); l.setAttribute('y1', 10); l.setAttribute('y2', 24); g.appendChild(l);
      l.animate([{transform:'translate(0,0)', opacity:0},{opacity:1, offset:.15},{transform:'translate(-8px,' + (y1 - 20) + 'px)', opacity:.9, offset:.96},{transform:'translate(-8px,' + (y1 - 20) + 'px)', opacity:0}], {duration: (900 + r2 * 500) * (1 + y1 / 700), iterations: Infinity, delay: -r2 * 2000, easing:'linear'});
    }
  })();
  /* depth planes from one damped pointer ⟦S1330⟧: alpha = 1 − (1 − .055)^(dt·60), split across planes by unequal, opposing amounts */
  var tx = 0, ty = 0, sx = 0, sy = 0, shelter = 0, shelterT = 0;
  if (OWL.fine && !OWL.reduce){
    root.addEventListener('pointermove', function(e){ tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, {passive:true});
    root.addEventListener('pointerleave', function(){ tx = 0; ty = 0; });
  }
  root.querySelectorAll('.ctas a').forEach(function(a){ a.addEventListener('pointerenter', function(){ if (a.getAttribute('href') === '#book') shelterT = 1; }); a.addEventListener('pointerleave', function(){ if (fold.getAttribute('aria-pressed') !== 'true') shelterT = 0; }); a.addEventListener('focus', function(){ if (a.getAttribute('href') === '#book') shelterT = 1; }); a.addEventListener('blur', function(){ if (fold.getAttribute('aria-pressed') !== 'true') shelterT = 0; }); });
  fold.addEventListener('click', function(){ var on = fold.getAttribute('aria-pressed') !== 'true'; fold.setAttribute('aria-pressed', on); shelterT = on ? 1 : 0; if (OWL.reduce) shelter = shelterT; });
  if (OWL.reduce) return;
  /* WebGL mesh */
  var gl = cv.getContext('webgl', {premultipliedAlpha:true, alpha:true, antialias:true});
  if (!gl) return;
  var VS = 'attribute vec2 a;uniform vec2 uRes;uniform vec4 uBox;uniform float uT,uHeadA,uHeadS,uNod,uWL,uWR,uBr,uSh;varying vec2 vUv;' +
  'vec2 rot(vec2 p,vec2 c,float t){p-=c;float s=sin(t),k=cos(t);return c+vec2(k*p.x-s*p.y,s*p.x+k*p.y);}' +
  'float box(vec2 p,vec4 b,float f){return smoothstep(b.x-f,b.x,p.x)*(1.-smoothstep(b.z,b.z+f,p.x))*smoothstep(b.y-f,b.y,p.y)*(1.-smoothstep(b.w,b.w+f,p.y));}' +
  'void main(){vUv=a;vec2 p=a*vec2(1180.,766.),q=p;' +
  'float house=box(p,vec4(492.,470.,900.,760.),18.);float ground=smoothstep(690.,716.,p.y);float keep=(1.-house)*(1.-ground);' +
  /* left wing: hinged at the shoulder, tips lag (follow-through by phase along the wing) */
  'float wl=clamp((570.-p.x)/520.,0.,1.)*smoothstep(240.,320.,p.y)*keep;' +
  'q+=(rot(p,vec2(560.,330.),(uWL*sin(uT*1.5-wl*1.3)-uSh*.085)*wl)-p);' +
  /* right wing: the arc over the head and the right side, hinged near the shoulder */
  'float arc=(1.-smoothstep(105.,150.,p.y))*smoothstep(380.,430.,p.x);float side=smoothstep(800.,880.,p.x);float wr=max(arc,side)*keep*clamp(distance(p,vec2(790.,240.))/380.,0.,1.);' +
  'q+=(rot(p,vec2(790.,240.),(uWR*sin(uT*1.32+1.3-wr*1.1)+uSh*.065)*wr)-p);' +
  /* body breathes from the feet, which stay planted on the roof ridge */
  'float body=box(p,vec4(520.,100.,930.,560.),60.)*keep;q+=(p-vec2(760.,560.))*uBr*body;' +
  /* head: turns on the neck, slides a little in depth toward the look (2.5D), nods */
  'float hd=1.-smoothstep(92.,150.,distance(p,vec2(628.,250.)));' +
  'q+=(rot(p,vec2(650.,350.),uHeadA)-p)*hd;q.x+=uHeadS*hd*(1.-smoothstep(0.,120.,distance(p,vec2(615.,262.))))*1.;q.y+=uNod*hd;' +
  'vec2 c=(uBox.xy+q/vec2(1180.,766.)*uBox.zw)/uRes*2.-1.;gl_Position=vec4(c.x,-c.y,0.,1.);}';
  var FS = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nvarying vec2 vUv;uniform sampler2D uTex,uFlow;uniform vec2 uRes,uLook;uniform float uTf,uLid;uniform vec3 uLidC;' +
  'float lidAt(vec2 p,vec2 c,vec2 r,inout vec3 col,float a){vec2 e=(p-c)/r;float inE=1.-smoothstep(.9,1.02,length(e));float y=-1.05+2.15*uLid;float cov=inE*(1.-smoothstep(y-.08,y+.08,e.y));float edge=inE*step(.04,uLid)*(1.-smoothstep(0.,.14,abs(e.y-y)));col=mix(col,uLidC*a,cov);col=mix(col,vec3(.1,.07,.04)*a,edge*.85);return inE;}' +
  'void main(){vec2 s=gl_FragCoord.xy/uRes;s.y=1.-s.y;float f=texture2D(uFlow,s).a;vec2 p=vUv*vec2(1180.,766.);' +
  /* the pupils glide toward the look inside the iris */
  'float iris=1.-smoothstep(10.,17.,distance(p,vec2(638.,254.)));vec2 uv=vUv-iris*vec2(uLook.x*3.2,uLook.y*2.2)/vec2(1180.,766.);' +
  /* the splash: where the cursor passed, the feathers ripple for a moment */
  'vec2 hb=step(vec2(484.,462.),p)*step(p,vec2(910.,770.));f*=1.-hb.x*hb.y;f*=1.-step(690.,p.y);'+
  'uv+=vec2(sin(vUv.y*96.+uTf*4.2),cos(vUv.x*74.+uTf*3.4))*.0028*f;' +
  'vec4 t=texture2D(uTex,uv);vec3 col=t.rgb;lidAt(p,vec2(638.,254.),vec2(22.,21.),col,t.a);lidAt(p,vec2(552.,253.),vec2(9.,14.),col,t.a);' +
  'col+=vec3(.07,.045,.0)*f*t.a;gl_FragColor=vec4(col,t.a);}';
  function sh(type, src){ var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(pr)); return; } gl.useProgram(pr);
  var NX = 72, NY = 48, vtx = [], idx = [];
  for (var j = 0; j <= NY; j++) for (var i = 0; i <= NX; i++) vtx.push(i / NX, j / NY);
  for (j = 0; j < NY; j++) for (i = 0; i < NX; i++){ var k = j * (NX + 1) + i; idx.push(k, k + 1, k + NX + 1, k + 1, k + NX + 2, k + NX + 1); }
  var vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vtx), gl.STATIC_DRAW);
  var ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
  var aLoc = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  var U = {}; ['uRes','uBox','uT','uTf','uHeadA','uHeadS','uNod','uWL','uWR','uBr','uSh','uTex','uFlow','uLook','uLid','uLidC'].forEach(function(n){ U[n] = gl.getUniformLocation(pr, n); });
  function tex(unit){ var t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; }
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  var tImg = tex(0), tFlow = tex(1), flow = OWL.flow(stage, {w: 128, radius: .12});
  gl.uniform1i(U.uTex, 0); gl.uniform1i(U.uFlow, 1);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  var W = 0, H = 0, dpr = Math.min(2, devicePixelRatio || 1), visible = true, ready = false, last = performance.now(), t = 0;
  function size(){ var r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); gl.viewport(0, 0, cv.width, cv.height); }
  /* blink schedule: every 3–4 s, sometimes a double blink, always one on a big head turn */
  var nextBlink = 1800, blinkAt = -1, lastHead = 0;
  function lid(now){ if (blinkAt < 0) return 0; var e = now - blinkAt; if (e < 110) return e / 110; if (e < 150) return 1; if (e < 340) return 1 - (e - 150) / 190; blinkAt = -1; return 0; }
  function load(){
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tImg); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    var c2 = document.createElement('canvas'); c2.width = 12; c2.height = 6; var x = c2.getContext('2d'); x.drawImage(img, 626, 222, 24, 12, 0, 0, 12, 6); var d = x.getImageData(0, 0, 12, 6).data, r = 0, g = 0, b = 0; for (var i = 0; i < d.length; i += 4){ r += d[i]; g += d[i+1]; b += d[i+2]; }
    var n = d.length / 4; gl.uniform3f(U.uLidC, r / n / 255 * .9, g / n / 255 * .88, b / n / 255 * .86);
    size(); ready = true; root.classList.add('gl-on'); requestAnimationFrame(frame);
  }
  function frame(now){
    requestAnimationFrame(frame);
    if (!visible || document.hidden) { last = now; return; }
    var dt = Math.min(1/30, (now - last) / 1000); last = now; t += dt;
    var al = 1 - Math.pow(1 - .055, dt * 60); sx += (tx - sx) * al; sy += (ty - sy) * al;
    shelter += (shelterT - shelter) * (1 - Math.pow(1 - .06, dt * 60));
    stage.style.setProperty('--px', sx.toFixed(3)); stage.style.setProperty('--py', sy.toFixed(3));
    var headA = sx * .05 + .022 * Math.sin(t * 2 * Math.PI / 4.6), headS = sx * 6, nod = sy * 4 + 1.2 * Math.sin(t * 2 * Math.PI / 5.2 + 1);
    if (Math.abs(headA - lastHead) > .03){ lastHead = headA; if (blinkAt < 0) blinkAt = now; }
    if (now > nextBlink && blinkAt < 0){ blinkAt = now; nextBlink = now + 3000 + Math.random() * 1000 + (Math.random() < .18 ? -2600 : 0); }
    flow.step(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tFlow); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, flow.canvas);
    var bx = W * .015, by = H * .015;
    gl.uniform2f(U.uRes, W, H); gl.uniform4f(U.uBox, bx, by, W - 2*bx, H - 2*by); gl.uniform1f(U.uT, t); gl.uniform1f(U.uTf, t);
    gl.uniform1f(U.uHeadA, headA); gl.uniform1f(U.uHeadS, headS); gl.uniform1f(U.uNod, nod);
    gl.uniform1f(U.uWL, .014); gl.uniform1f(U.uWR, .011); gl.uniform1f(U.uBr, .006 * Math.sin(t * 2 * Math.PI / 3.8)); gl.uniform1f(U.uSh, shelter);
    gl.uniform2f(U.uLook, sx, sy); gl.uniform1f(U.uLid, lid(now));
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawElements(gl.TRIANGLES, idx.length, gl.UNSIGNED_SHORT, 0);
  }
  try { if (img.complete && img.naturalWidth) load(); else img.addEventListener('load', load); } catch (e) { root.classList.remove('gl-on'); console.warn(e); }
  new ResizeObserver(function(){ if (ready) size(); }).observe(cv);
  if ('IntersectionObserver' in window) new IntersectionObserver(function(e){ visible = e[0].isIntersecting; }).observe(root);
  cv.addEventListener('webglcontextlost', function(e){ e.preventDefault(); root.classList.remove('gl-on'); visible = false; });
});
</script>
