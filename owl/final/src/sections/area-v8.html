<section class="sec area8" id="areas-8" aria-labelledby="ar8-h">
<style>
.area8 .hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 40px;margin-bottom:clamp(18px,2.6vw,30px)}
.area8 .lede{margin-top:12px;max-width:44ch}
.area8 .find{display:flex;gap:10px;min-width:min(100%,380px)}
.area8 .find input{flex:1;min-width:0;min-height:52px;padding:0 16px;border-radius:14px;border:2px solid rgba(23,17,29,.16);background:#fff;font:inherit;font-size:17px}
.area8 .find input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.area8 .say{min-height:28px;margin:0 0 14px;font-weight:800;font-size:18px}
.area8 .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:clamp(14px,2.4vw,26px);border-radius:24px;background:radial-gradient(120% 90% at 30% 10%,#FFFDF7,#F2ECDD);box-shadow:inset 0 0 0 1px rgba(23,17,29,.06),0 30px 50px -36px rgba(23,17,29,.5)}
.area8 .pm{position:relative;display:block;width:100%;padding:0;aspect-ratio:1;border-radius:50%;background:transparent;transform:rotate(var(--r,0deg));transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.area8 .pm svg{display:block;width:100%;height:100%;overflow:visible}
.area8 .pm:hover{transform:rotate(0deg) scale(1.06)}
.area8 .pm:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.area8 .wall.filtering .pm:not(.hit){opacity:.28}
.area8 .pm .ok{opacity:0;transform:scale(1.5) rotate(-18deg);transform-origin:center;transform-box:fill-box;transition:opacity .2s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.area8 .pm[aria-pressed="true"] .ok{opacity:1;transform:scale(1) rotate(-18deg)}
@media (max-width:520px){.area8 .wall{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}}
@media (prefers-reduced-motion:reduce){.area8 .pm,.area8 .pm .ok{transition:none}}
</style>
<div class="wrap">
 <div class="hd"><div><span class="kick">Service area</span><h2 class="h2" id="ar8-h" style="margin-top:12px">Postmarks</h2>
  <p class="lede rv">Twenty-nine towns we roof in, one postmark each. Find yours and we’ll stamp it.</p></div>
  <form class="find" role="search" novalidate><label for="ar8-q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Find your town</label><input id="ar8-q" placeholder="Find your town" autocomplete="off"><button class="btn btn-amber" type="submit" data-mag data-owl="hoot">Find</button></form></div>
 <p class="say" aria-live="polite">Shoreview is home: 1000 County Rd E #230.</p>
 <div class="wall" role="group" aria-label="The 29 towns Owl Roofing serves" data-owl="say:Find yours"></div>
</div>
<script>
OWL.reg('area','8',function(root){
  var T = ['Shoreview','North Oaks','Arden Hills','Vadnais Heights','Little Canada','Roseville','Mounds View','New Brighton','Lino Lakes','Blaine','White Bear Lake','Maplewood','Fridley','Saint Paul','Minneapolis','Forest Lake','Coon Rapids','Oakdale','Stillwater','Woodbury','Maple Grove','Plymouth','Minnetonka','Edina','Eden Prairie','Bloomington','Eagan','Burnsville','Apple Valley'];
  var wall = root.querySelector('.wall'), say = root.querySelector('.say'), form = root.querySelector('.find'), q = root.querySelector('#ar8-q'), h2 = root.querySelector('h2');
  OWL.split(h2);
  var INK = ['#17111D', '#8E5A12', '#3F6E8C'];
  var marks = T.map(function(t, i){ var b = document.createElement('button'), ink = INK[i % 3], id = 'ar8a' + i, up = t.toUpperCase(), fs = up.length > 12 ? 11 : 13;
    b.type = 'button'; b.className = 'pm'; b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', t + (i ? '' : ', home'));
    b.style.setProperty('--r', (((i*37) % 13) - 6) + 'deg');
    b.innerHTML = '<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="' + ink + '"><circle cx="60" cy="60" r="52" stroke-width="3.5"/><circle cx="60" cy="60" r="44" stroke-width="1.5"/>'
      + '<path d="M104 46q8-5 16 0M104 56q8-5 16 0M104 66q8-5 16 0M104 76q8-5 16 0" stroke-width="2.5" opacity=".7"/></g>'
      + '<path id="' + id + '" d="M60 60m-36 0a36 36 0 0 1 72 0" fill="none"/><text font-size="' + fs + '" font-weight="900" letter-spacing="1" fill="' + ink + '" text-anchor="middle"><textPath href="#' + id + '" startOffset="50%">' + up + '</textPath></text>'
      + '<text x="60" y="68" text-anchor="middle" font-size="' + (i ? 15 : 13) + '" font-weight="900" fill="' + ink + '">' + (i ? '★' : 'HOME') + '</text><text x="60" y="92" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="3" fill="' + ink + '">MN</text>'
      + '<g class="ok"><rect x="10" y="48" width="100" height="26" rx="4" fill="#FBFAF6" stroke="#2E7D32" stroke-width="3"/><text x="60" y="65.5" text-anchor="middle" font-size="10.5" font-weight="900" fill="#2E7D32" textLength="86" lengthAdjust="spacingAndGlyphs">WE ROOF HERE</text></g></svg>';
    b.addEventListener('click', function(){ pick(i); });
    b.addEventListener('keydown', function(e){ var cols = Math.max(1, Math.round(wall.clientWidth/ (marks[0].offsetWidth + 10))), m = {ArrowRight:1, ArrowLeft:-1, ArrowDown:cols, ArrowUp:-cols}[e.key]; if (!m) return; var n = i + m; if (n < 0 || n >= T.length) return; e.preventDefault(); marks[n].focus(); });
    wall.appendChild(b); return b; });
  function pick(i){ marks.forEach(function(b, j){ b.setAttribute('aria-pressed', j === i); }); say.textContent = i ? 'Yes, we roof in ' + T[i] + '.' : 'Shoreview is home: 1000 County Rd E #230.'; }
  function norm(s){ return s.toLowerCase().replace(/^st\.?\s/, 'saint ').replace(/[^a-z]/g, ''); }
  q.addEventListener('input', function(){ var v = norm(q.value); wall.classList.toggle('filtering', !!v); marks.forEach(function(b, j){ b.classList.toggle('hit', !!v && norm(T[j]).indexOf(v) === 0); }); });
  form.addEventListener('submit', function(e){ e.preventDefault(); var v = norm(q.value); if (!v) return; var i = T.findIndex(function(t){ return norm(t) === v; }); if (i < 0) i = T.findIndex(function(t){ return norm(t).indexOf(v) === 0; });
    if (i >= 0){ pick(i); marks[i].scrollIntoView({block: 'nearest', behavior: OWL.reduce ? 'auto' : 'smooth'}); return; }
    marks.forEach(function(b){ b.setAttribute('aria-pressed', 'false'); }); say.textContent = q.value.replace(/[<>&]/g, '') + ' is not on our list of 29 towns. Call (651) 977-6027 to ask.'; });
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); pick(0); } }, {threshold:.3}); io.observe(wall);
});
</script>
</section>
