<section class="sec fam7" id="family-7" aria-labelledby="fm7-h">
<style>
.fam7{overflow:hidden}
.fam7 .hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 40px;margin-bottom:clamp(18px,2.6vw,30px)}
.fam7 .lede{margin-top:12px;max-width:46ch}
.fam7 .board{position:relative;aspect-ratio:16/9;border-radius:22px;background:radial-gradient(circle at 30% 20%,#D9B98A,#C49A62 70%);box-shadow:inset 0 0 0 14px #9C7448,inset 0 0 0 16px #7E5C38,0 44px 70px -46px rgba(23,17,29,.6);overflow:hidden;touch-action:none}
.fam7 .board::before{content:"";position:absolute;inset:16px;background:radial-gradient(#B98C55 1px,transparent 1.5px) 0 0/9px 9px,radial-gradient(#E0C49A 1px,transparent 1.5px) 4px 5px/11px 11px;opacity:.6;pointer-events:none}
.fam7 .patch{position:absolute;left:50%;top:50%;width:26%;transform:translate(-50%,-50%) rotate(-3deg);pointer-events:none}
.fam7 .patch svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 10px rgba(23,17,29,.3))}
.fam7 .st{stroke-dasharray:6 6;stroke-dashoffset:0}
.fam7 .sew .st{animation:fm7s 2.4s linear both}
@keyframes fm7s{from{stroke-dasharray:0 2000}to{stroke-dasharray:6 6}}
.fam7 .pr{position:absolute;left:0;top:0;width:22%;padding:8px 8px 34px;background:#FBFAF6;box-shadow:0 10px 16px -8px rgba(23,17,29,.45);transform:translate(var(--x),var(--y)) rotate(var(--r));cursor:grab;user-select:none;border:0;text-align:left}
.fam7 .pr.up{cursor:grabbing;box-shadow:0 30px 40px -16px rgba(23,17,29,.55)}
.fam7 .pr img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;pointer-events:none}
.fam7 .pr span{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;font-weight:700;color:#3A3540;line-height:1.2}
.fam7 .pr::before{content:"";position:absolute;left:50%;top:-6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F6C25F,#C7871A);box-shadow:0 3px 4px rgba(23,17,29,.4);z-index:1}
.fam7 .pr:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.fam7 .note{margin-top:12px;font-size:14px;color:var(--ink-70)}
@media (max-width:760px){.fam7 .board{aspect-ratio:2/3}.fam7 .pr{width:38%;padding:6px 6px 40px}.fam7 .pr span{font-size:11px}.fam7 .patch{width:48%;top:12%}}
@media (prefers-reduced-motion:reduce){.fam7 .sew .st{animation:none}}
</style>
<div class="wrap">
 <div class="hd"><div><span class="kick">Family-owned since 2025</span><h2 class="h2" id="fm7-h" style="margin-top:12px">The Pinboard</h2>
  <p class="lede rv">The people behind Owl Roofing, pinned up where we can see them. Move the prints around; they’re yours to arrange.</p></div>
  <button class="btn btn-line tidy" type="button" data-mag data-owl="peek">Tidy Up</button></div>
 <div class="board" data-owl="say:Drag a print">
  <div class="patch" aria-hidden="true"><svg viewBox="0 0 300 200">
   <rect x="6" y="6" width="288" height="188" rx="40" fill="#17111D"/><rect x="18" y="18" width="264" height="164" rx="30" fill="none" stroke="#EAA221" stroke-width="3" class="st"/>
   <text x="150" y="74" text-anchor="middle" font-size="34" font-weight="900" fill="#EAA221" letter-spacing="1">OWL ROOFING</text>
   <text x="150" y="110" text-anchor="middle" font-size="18" font-weight="800" fill="#F1EFE6" letter-spacing="3">FAMILY-OWNED</text>
   <text x="150" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#F1EFE6" letter-spacing="2">EST. 2025 · SHOREVIEW, MN</text>
   <text x="150" y="166" text-anchor="middle" font-size="14" font-weight="800" fill="#EAA221" letter-spacing="2">WE GIVE A HOOT</text>
  </svg></div>
 </div>
 <p class="note">Drag a print, or focus one and use the arrow keys. Tidy Up puts them back.</p>
</div>
<script>
OWL.reg('family','7',function(root){
  var board = root.querySelector('.board'), patch = root.querySelector('.patch'), h2 = root.querySelector('h2');
  OWL.split(h2);
  /* home positions as fractions of the board, and a little tilt each */
  var P = [
    {src:'{{A:browns.webp}}', alt:'Tim Brown with his wife and their children', cap:'Tim Brown & family', hx:.05, hy:.08, r:-5},
    {src:'{{A:berglands.webp}}', alt:'Noah Bergland with his wife and their children', cap:'Noah Bergland & family', hx:.73, hy:.07, r:4},
    {src:'{{A:fam-noah.webp}}', alt:'Noah Bergland on a ladder at a roof edge', cap:'Noah, at the roof edge', hx:.06, hy:.52, r:3},
    {src:'{{A:fam-crew.webp}}', alt:'Owl’s crew at work on a roof', cap:'The crew at work', hx:.72, hy:.5, r:-4},
    {src:'{{A:fam-community.webp}}', alt:'Community involvement', cap:'Out in the community', hx:.39, hy:.64, r:2}];
  var M = window.matchMedia('(max-width:760px)');
  var HM = [[.03,.23],[.58,.21],[.04,.71],[.57,.69],[.31,.46]];
  var pr = P.map(function(p, i){ var b = document.createElement('button'); b.type = 'button'; b.className = 'pr'; b.setAttribute('aria-label', p.alt + (i < 2 ? ', co-founder' : '') + '. Move with the arrow keys.');
    var im = new Image(); im.src = p.src; im.alt = ''; im.draggable = false; b.appendChild(im); var s = document.createElement('span'); s.textContent = p.cap; s.setAttribute('aria-hidden', 'true'); b.appendChild(s);
    board.appendChild(b); p.el = b; p.x = 0; p.y = 0; p.tx = 0; p.ty = 0; p.vx = 0; p.vy = 0; p.rr = p.r; p.tr = p.r; p.vr = 0; return b; });
  var z = 10, raf = 0, last = 0;
  function home(p, i){ var W = board.clientWidth, H = board.clientHeight, h = M.matches ? HM[i] : [p.hx, p.hy]; return [h[0]*W, h[1]*H]; }
  function paint(p){ p.el.style.setProperty('--x', p.x.toFixed(1) + 'px'); p.el.style.setProperty('--y', p.y.toFixed(1) + 'px'); p.el.style.setProperty('--r', p.rr.toFixed(2) + 'deg'); }
  function step(now){ var dt = last ? Math.min(40, now - last)/16.7 : 1, moving = false; last = now;
    P.forEach(function(p){ if (p.drag) return; p.vx += (p.tx - p.x)*.08*dt; p.vy += (p.ty - p.y)*.08*dt; p.vr += (p.tr - p.rr)*.08*dt; var d = Math.pow(.74, dt); p.vx *= d; p.vy *= d; p.vr *= d; p.x += p.vx*dt; p.y += p.vy*dt; p.rr += p.vr*dt; paint(p);
      if (Math.abs(p.tx - p.x) > .3 || Math.abs(p.ty - p.y) > .3 || Math.abs(p.vx) + Math.abs(p.vy) > .05 || Math.abs(p.tr - p.rr) > .05) moving = true; });
    if (moving || P.some(function(p){ return p.drag; })) raf = requestAnimationFrame(step); else { raf = 0; last = 0; } }
  function kick(){ if (OWL.reduce){ P.forEach(function(p){ p.x = p.tx; p.y = p.ty; p.rr = p.tr; paint(p); }); return; } if (!raf) raf = requestAnimationFrame(step); }
  function clamp(p){ var W = board.clientWidth - p.el.offsetWidth, H = board.clientHeight - p.el.offsetHeight; p.tx = Math.max(6, Math.min(W - 6, p.tx)); p.ty = Math.max(10, Math.min(H - 6, p.ty)); }
  function tidy(){ P.forEach(function(p, i){ var h = home(p, i); p.tx = h[0]; p.ty = h[1]; p.tr = p.r; }); kick(); }
  P.forEach(function(p, i){ var b = p.el, start = null;
    b.addEventListener('pointerdown', function(e){ b.setPointerCapture(e.pointerId); start = {x: e.clientX, y: e.clientY, px: p.x, py: p.y}; p.drag = true; b.classList.add('up'); b.style.zIndex = ++z; p.tr = 0; kick(); });
    b.addEventListener('pointermove', function(e){ if (!start) return; p.x = start.px + e.clientX - start.x; p.y = start.py + e.clientY - start.y; p.rr += (Math.max(-8, Math.min(8, (e.movementX || 0)*.6)) - p.rr)*.3; paint(p); });
    function up(){ if (!start) return; start = null; p.drag = false; b.classList.remove('up'); p.tx = p.x; p.ty = p.y; clamp(p); p.tr = p.r*.6; kick(); }
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
    b.addEventListener('keydown', function(e){ var m = {ArrowLeft:[-1, 0], ArrowRight:[1, 0], ArrowUp:[0, -1], ArrowDown:[0, 1]}[e.key]; if (!m) return; e.preventDefault(); var s = e.shiftKey ? 60 : 20; b.style.zIndex = ++z; p.tx += m[0]*s; p.ty += m[1]*s; clamp(p); kick(); }); });
  root.querySelector('.tidy').addEventListener('click', tidy);
  addEventListener('resize', function(){ tidy(); });
  /* start scattered in from the edges, then settle home */
  P.forEach(function(p, i){ var h = home(p, i); p.tx = h[0]; p.ty = h[1]; p.x = OWL.reduce ? h[0] : h[0] + (i % 2 ? 60 : -60); p.y = OWL.reduce ? h[1] : h[1] - 40; p.rr = OWL.reduce ? p.r : p.r*3; paint(p); });
  if (OWL.reduce || !('IntersectionObserver' in window)){ kick(); OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); patch.classList.add('sew'); kick(); } }, {threshold:.3}); io.observe(board);
});
</script>
</section>
