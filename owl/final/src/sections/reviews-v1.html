<section class="sec rev1" id="reviews" aria-labelledby="rv1-h">
<style>
.rev1 .g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(24px,5vw,72px)}
.rev1 .dial{position:relative;width:min(100%,560px);aspect-ratio:1;justify-self:center}
.rev1 .dial svg{width:100%;height:100%;filter:drop-shadow(0 40px 50px rgba(23,17,29,.28))}
.rev1 .bez{transform-origin:300px 300px;transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.rev1 .face{position:absolute;inset:18%;display:grid;place-items:center;text-align:center;border-radius:50%}
.rev1 .face>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:rotateY(80deg);transition:opacity .45s,transform .6s var(--ease)}
.rev1 .face>div.on{opacity:1;transform:none}
.rev1 .big{font-weight:800;font-size:clamp(72px,11vw,150px);line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.rev1 .mid{font-weight:800;font-size:clamp(40px,6vw,74px);line-height:1;letter-spacing:-.04em}
.rev1 .sm{margin-top:10px;font-weight:700;font-size:clamp(16px,1.8vw,22px)}
.rev1 .stars{display:flex;gap:6px;margin-bottom:12px}
.rev1 .stars svg{width:clamp(22px,3vw,34px);height:auto;color:var(--amber);filter:drop-shadow(0 2px 0 #A86E12);transform:scale(0);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.rev1 .stars.go svg{transform:scale(1)}
.rev1 .tabs{display:grid;margin:26px 0 30px;border-top:1px solid rgba(234,162,33,.55)}
.rev1 .tab{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;padding:18px 6px;border-bottom:1px solid rgba(234,162,33,.55);text-align:left;transition:background .25s,padding .25s}
.rev1 .tab b{font-size:clamp(22px,2.2vw,28px);font-weight:800;letter-spacing:-.02em;color:var(--ink-50);transition:color .25s}
.rev1 .tab span{font-size:18px;color:var(--ink-70)}
.rev1 .tab[aria-selected="true"]{background:rgba(234,162,33,.1);padding-left:14px}
.rev1 .tab[aria-selected="true"] b{color:var(--ink)}
@media (max-width:900px){.rev1 .g{grid-template-columns:1fr}.rev1 .tab{grid-template-columns:1fr}}
</style>
<div class="wrap">
 <div class="g">
  <div class="dial" data-owl="say:Hoo rated us? You did.">
   <svg viewBox="0 0 600 600" aria-hidden="true">
    <defs>
     <linearGradient id="rv1b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8D488"/><stop offset=".35" stop-color="#EAA221"/><stop offset=".6" stop-color="#B9791A"/><stop offset=".85" stop-color="#F1BC55"/><stop offset="1" stop-color="#C7871A"/></linearGradient>
     <linearGradient id="rv1c" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7871A"/><stop offset=".5" stop-color="#F6CB76"/><stop offset="1" stop-color="#B9791A"/></linearGradient>
     <radialGradient id="rv1f" cx="45%" cy="38%" r="70%"><stop offset="0" stop-color="#FBF0D2"/><stop offset=".7" stop-color="#EFD49A"/><stop offset="1" stop-color="#D9AE5C"/></radialGradient>
     <radialGradient id="rv1bolt" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#FFF1CF"/><stop offset=".5" stop-color="#E2A33A"/><stop offset="1" stop-color="#8E5A12"/></radialGradient>
    </defs>
    <circle cx="300" cy="300" r="292" fill="url(#rv1b)"/>
    <g class="bez"><circle cx="300" cy="300" r="266" fill="url(#rv1c)"/><g class="tk"></g><path d="M300 40 l10 18 h-20z" fill="#17111D"/></g>
    <circle cx="300" cy="300" r="236" fill="url(#rv1f)"/>
    <g class="bolts"></g>
   </svg>
   <div class="face" aria-live="polite">
    <div class="on" data-f="1"><span class="stars"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg></span><span class="big">5.0</span><span class="sm">90+ reviews</span></div>
    <div data-f="0"><span class="mid">Wise<br>Check</span><span class="sm">our roof inspection</span></div>

   </div>

  <div>
   <h2 class="h2 rv" id="rv1-h">Checked, rated, trusted</h2>

<script>
OWL.reg('reviews','1',function(root){
  var svg = root.querySelector('svg'), bez = svg.querySelector('.bez'), tabs = root.querySelectorAll('.tab'), faces = root.querySelectorAll('.face>div'), stars = root.querySelector('.stars'), big = root.querySelector('.big');
  function pt(a, r){ var t = (a - 90)*Math.PI/180; return [300 + Math.cos(t)*r, 300 + Math.sin(t)*r]; }
  var tk = ''; for (var i = 0; i < 120; i++){ var big5 = i % 5 === 0, a = pt(i*3, 262), b = pt(i*3, big5 ? 244 : 252); tk += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="#17111D" stroke-opacity="' + (big5 ? .6 : .3) + '" stroke-width="' + (big5 ? 2 : 1) + '"/>'; }
  svg.querySelector('.tk').innerHTML = tk;
  var bo = ''; for (var k = 0; k < 10; k++){ var q = pt(k*36 + 18, 279); bo += '<circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="6.5" fill="url(#rv1bolt)" stroke="#8E5A12" stroke-width=".8"/>'; }
  svg.querySelector('.bolts').innerHTML = bo;
  var angle = [-60, 0, 60];
  function pick(i, focus){ tabs.forEach(function(t, j){ t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; if (j === i && focus) t.focus(); });
    faces.forEach(function(f){ f.classList.toggle('on', +f.dataset.f === i); }); bez.style.transform = 'rotate(' + angle[i] + 'deg)'; }
  tabs.forEach(function(t, i){ t.addEventListener('click', function(){ pick(i); }); t.addEventListener('mouseenter', function(){ if (OWL.fine) pick(i); });
    t.addEventListener('keydown', function(e){ var d = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 0; if (d){ e.preventDefault(); pick((i + d + 3) % 3, true); } }); });
  /* count up and fill the stars once, when the dial comes into view */
  function run(){ stars.classList.add('go'); stars.querySelectorAll('svg').forEach(function(s, n){ s.style.transitionDelay = (n*.12) + 's'; });
    if (OWL.reduce) return; var t0 = performance.now(); (function f(t){ var p = Math.min(1, (t - t0)/1100); big.textContent = (5*(1 - Math.pow(1 - p, 3))).toFixed(1); if (p < 1) requestAnimationFrame(f); })(t0); }
  if ('IntersectionObserver' in window){ var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); run(); } }, {threshold:.4}); io.observe(svg); } else run();
  setTimeout(function(){ if (!stars.classList.contains('go')) run(); }, 5000);
  pick(1);
});
</script>
