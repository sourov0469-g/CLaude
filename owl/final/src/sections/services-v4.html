<section class="sec svc4" id="services-4" aria-labelledby="sv4-h">
<style>
.svc4 .hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 40px;margin-bottom:clamp(18px,2.6vw,30px)}
.svc4 .lede{margin-top:12px;max-width:44ch}
.svc4 .g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(20px,3vw,48px);align-items:start}
.svc4 .house{position:relative;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#E4ECEF,#F4F0E4 72%);box-shadow:0 2px 0 #fff inset,0 50px 80px -46px rgba(23,17,29,.5)}
.svc4 svg{display:block;width:100%;height:auto}
.svc4 .zone{cursor:pointer}
.svc4 .zone .hl{fill:#EAA221;fill-opacity:0;stroke:#EAA221;stroke-width:0;transition:fill-opacity .3s,stroke-width .3s}
.svc4 .zone:hover .hl{fill-opacity:.18}
.svc4 .zone.on .hl{fill-opacity:.32;stroke-width:4}
.svc4 .pin{transform-box:fill-box;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.svc4 .zone.on .pin{transform:scale(1.25)}
.svc4 .cloud{animation:sv4c 9s ease-in-out infinite alternate}
@keyframes sv4c{to{transform:translateX(18px)}}
.svc4 .keys{display:grid;gap:8px}
.svc4 .keys button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border-radius:14px;text-align:left;font-weight:700;font-size:16px;background:var(--paper);box-shadow:0 3px 0 rgba(23,17,29,.08);transition:transform .2s,box-shadow .2s,background .2s}
.svc4 .keys button i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(23,17,29,.08);font-style:normal;font-weight:800;font-size:13px}
.svc4 .keys button[aria-selected="true"]{background:#FFF6E2;box-shadow:0 0 0 2px var(--amber),0 3px 0 var(--amber-edge)}
.svc4 .keys button[aria-selected="true"] i{background:var(--amber)}
.svc4 .card{margin-top:16px;padding:18px;border-radius:20px;background:var(--paper);box-shadow:0 2px 0 #fff inset,0 24px 40px -30px rgba(23,17,29,.5)}
.svc4 .card h3{font-size:22px;font-weight:800;margin-bottom:6px}
.svc4 .card p{font-size:16px;color:var(--ink-70);margin-bottom:10px}
.svc4 .card ul{margin:0 0 14px;padding-left:18px;font-size:15px;font-weight:600;display:grid;gap:4px}
@media (max-width:900px){.svc4 .g{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.svc4 .cloud{animation:none}.svc4 .pin,.svc4 .zone .hl{transition:none}}
</style>

   </svg>
  </div>
  <div>
   <div class="keys" role="tablist" aria-label="Owl Roofing services" aria-orientation="vertical"></div>

<script>
OWL.reg('services','4',function(root){
  var S = OWL.SVC || [], svg = root.querySelector('svg'), keys = root.querySelector('.keys'), card = root.querySelector('.card'), pins = root.querySelector('.pins'), h2 = root.querySelector('h2'), cur = -1;
  OWL.split(h2);
  var PIN = {replace: [530, 300], siding: [690, 470], storm: [262, 238], repair: [640, 248], check: [400, 214]};
  var zones = [].slice.call(root.querySelectorAll('.zone'));
  var btns = S.map(function(s, i){ var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'sv4-t' + i; b.setAttribute('aria-controls', 'sv4-card'); b.innerHTML = '<i>' + (i + 1) + '</i>' + s.n;
    b.addEventListener('click', function(){ pick(i); });
    b.addEventListener('keydown', function(e){ var n = null; if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (i + 1) % S.length; else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (i + S.length - 1) % S.length; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = S.length - 1; if (n !== null){ e.preventDefault(); pick(n); btns[n].focus(); } });
    keys.appendChild(b);
    var pp = PIN[s.k]; if (pp) pins.insertAdjacentHTML('beforeend', '<g class="pin" data-k="' + s.k + '" transform="translate(' + pp[0] + ' ' + pp[1] + ')"><circle r="15" fill="#17111D"/><text y="5" text-anchor="middle" fill="#F6C25F">' + (i + 1) + '</text></g>');
    return b; });
  function pick(i){ cur = i; var s = S[i];
    zones.forEach(function(z){ z.classList.toggle('on', z.dataset.k === s.k); });
    btns.forEach(function(b, j){ b.setAttribute('aria-selected', j === i); b.tabIndex = j === i ? 0 : -1; });
    card.setAttribute('aria-labelledby', 'sv4-t' + i); card.querySelector('h3').textContent = s.n; card.querySelector('p').textContent = s.d; card.querySelector('ul').innerHTML = s.inc.map(function(x){ return '<li>' + x + '</li>'; }).join(''); }
  zones.forEach(function(z){ var i = S.map(function(s){ return s.k; }).indexOf(z.dataset.k); z.addEventListener('pointerenter', function(){ if (i > -1) pick(i); }); z.addEventListener('click', function(){ if (i > -1) pick(i); }); });
  pick(0);
  if (OWL.reduce || !('IntersectionObserver' in window)) OWL.reveal(h2);
  else { var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); } }, {threshold:.3}); io.observe(svg); }
});
</script>
