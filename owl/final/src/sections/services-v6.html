<section class="sec services6" id="services-6" aria-labelledby="sv6-h">
<style>
.services6 .hd{margin-bottom:clamp(18px,2.6vw,30px)}
.services6 .lede{margin-top:12px;max-width:46ch}
.services6 .g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(20px,4vw,60px);align-items:start}
.services6 .q{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8E5A12;margin:0 0 12px}
.services6 .keys{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.services6 .key{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 16px 8px 10px;border-radius:18px;text-align:left;font-weight:800;font-size:17px;background:linear-gradient(180deg,#FFFFFF,#F2EDE2);box-shadow:0 5px 0 #C9C0AC,0 12px 18px -12px rgba(23,17,29,.45);transition:transform .12s,box-shadow .12s,background .2s}
.services6 .key i{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:13px;background:#F1EFE6;transition:background .2s}
.services6 .key i svg{width:30px;height:30px}

.services6 .key[aria-pressed="true"]{background:linear-gradient(180deg,#F6C25F,#EAA221);box-shadow:0 2px 0 var(--amber-edge),0 6px 12px -8px rgba(23,17,29,.4);transform:translateY(3px)}
.services6 .key[aria-pressed="true"] i{background:#FBFAF6}

.services6 .deck{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.services6 .card{position:relative;display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;padding:12px;border-radius:20px;background:var(--paper);box-shadow:0 2px 0 #fff inset,0 18px 30px -24px rgba(23,17,29,.5);transition:opacity .4s,box-shadow .4s,grid-template-columns .5s cubic-bezier(.22,.61,.36,1);will-change:transform}
.services6 .card .ph{height:96px;border-radius:14px;overflow:hidden;background:#E9E3D5;transition:height .5s cubic-bezier(.22,.61,.36,1)}
.services6 .card img{width:100%;height:100%;object-fit:cover;display:block}
.services6 .card h3{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0}
.services6 .card p{font-size:15px;color:var(--ink-70);margin:4px 0 0}
.services6 .card ul{display:none;margin:10px 0 0;padding:0;list-style:none;font-size:15px;font-weight:600}
.services6 .card li{position:relative;padding-left:22px;margin-top:5px}
.services6 .card li::before{content:"";position:absolute;left:0;top:7px;width:12px;height:7px;border-left:3px solid var(--amber);border-bottom:3px solid var(--amber);transform:rotate(-45deg)}
.services6 .card .tag{position:absolute;right:14px;top:-12px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.services6 .card.first{grid-template-columns:220px minmax(0,1fr);box-shadow:0 0 0 3px var(--amber),0 30px 50px -30px rgba(23,17,29,.6)}
.services6 .card.first .ph{height:170px}
.services6 .card.first ul{display:block}
.services6 .card.first .tag{opacity:1;transform:none;background:var(--amber);color:#17111D}
.services6 .card.second{box-shadow:0 0 0 2px rgba(23,17,29,.18),0 18px 30px -24px rgba(23,17,29,.5)}
.services6 .card.second .tag{opacity:1;transform:none;background:#17111D;color:#F1EFE6}
.services6 .deck.chosen .card.rest{background:#F4F1EA;box-shadow:none}
.services6 .deck.chosen .card.rest .ph{filter:grayscale(.85);opacity:.75}
.services6 .card a{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-weight:800;color:var(--ink)}
@media (max-width:900px){.services6 .g{grid-template-columns:1fr}.services6 .card,.services6 .card.first{grid-template-columns:96px minmax(0,1fr)}.services6 .card .ph{height:80px}.services6 .card.first .ph{height:110px}}
@media (prefers-reduced-motion:reduce){.services6 .card,.services6 .card .ph,.services6 .key,.services6 .card .tag{transition:none}}
</style>
<div class="wrap">
 <div class="hd"><span class="kick">Services</span><h2 class="h2" id="sv6-h" style="margin-top:12px">What Do You See?</h2>
  <p class="lede rv">Start from what you notice. Owl’s five services re-sort so the one that fits comes to the top.</p></div>
 <div class="g">
  <div>
   <p class="q" id="sv6-q">What do you see?</p>
   <div class="keys" role="group" aria-labelledby="sv6-q" data-owl="say:Pick one"></div>
   <p class="note">A guide, not a diagnosis. A Wise Check is how we confirm what your roof needs.</p>
  </div>
  <div>
   <p class="status" aria-live="polite">Pick what you see to sort the list.</p>
   <ol class="deck" aria-label="Owl Roofing services"></ol>
  </div>
 </div>
</div>
<script>
OWL.reg('services','6',function(root){
  var S = OWL.SVC, keysEl = root.querySelector('.keys'), deck = root.querySelector('.deck'), status = root.querySelector('.status'), h2 = root.querySelector('h2');
  OWL.split(h2);
  var ALT = {replace:'An Owl crew member carrying a sheet of roof decking', repair:'An Owl crew member with a bundle of shingles', storm:'A tree fallen across a damaged roof', check:'An Owl crew member walking a shingle roof', siding:'A house with new lap siding and two garage doors'};
  var IX = {}; S.forEach(function(s, i){ IX[s.k] = i; });
  var SEE = [
    {t:'A leak or a stain', o:['repair', 'check'], ico:'<path d="M20 4C13 15 10 19 10 24a10 10 0 0 0 20 0c0-5-3-9-10-20z" fill="#5BA3D9"/><path d="M15 25a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>'},
    {t:'Shingles down after a storm', o:['storm', 'check'], ico:'<path d="M10 20a7 7 0 1 1 3-13 9 9 0 0 1 17 2 6 6 0 0 1 0 11z" fill="#7C8790"/><circle cx="13" cy="28" r="2.5" fill="#17111D"/><circle cx="21" cy="32" r="2.5" fill="#17111D"/><circle cx="29" cy="27" r="2.5" fill="#17111D"/>'},
    {t:'An older roof', o:['check', 'replace'], ico:'<path d="M3 22L20 8l17 14" fill="none" stroke="#17111D" stroke-width="3.5" stroke-linejoin="round"/><path d="M8 26h24M8 32h24" stroke="#8A8178" stroke-width="3.5"/><path d="M22 25l7 2-1 4-7-2z" fill="#EAA221"/>'},
    {t:'Planning a new roof', o:['replace', 'siding'], ico:'<rect x="5" y="6" width="30" height="28" rx="3" fill="#CFE1EA"/><path d="M9 22l11-9 11 9M12 22v8h16v-8" fill="none" stroke="#17111D" stroke-width="2.5" stroke-linejoin="round"/>'},
    {t:'Tired siding', o:['siding', 'replace'], ico:'<rect x="6" y="6" width="28" height="28" rx="2" fill="#E9E3D5"/><path d="M6 12h28M6 18h28M6 24h28M6 30h28" stroke="#9C9585" stroke-width="2.5"/><rect x="15" y="16" width="10" height="9" fill="#CFE1EA" stroke="#17111D" stroke-width="2"/>'}];
  var cards = S.map(function(s){ var li = document.createElement('li'); li.className = 'card'; li.dataset.k = s.k;
    var im = new Image(); im.src = (OWL.media && OWL.media[s.img]) || ''; im.alt = ALT[s.k] || s.n; im.decoding = 'async';
    li.innerHTML = '<div class="ph"></div><div><h3>' + s.n + '</h3><p>' + s.d + '</p><ul>' + s.inc.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul></div><span class="tag" aria-hidden="true"></span>';
    li.querySelector('.ph').appendChild(im); deck.appendChild(li); return li; });
  var cur = -1, keys = SEE.map(function(o, i){ var b = document.createElement('button'); b.type = 'button'; b.className = 'key'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<i><svg viewBox="0 0 40 40" aria-hidden="true">' + o.ico + '</svg></i>' + o.t; b.addEventListener('click', function(){ choose(i); });
    b.addEventListener('keydown', function(e){ var m = e.key === 'ArrowDown' ? i + 1 : e.key === 'ArrowUp' ? i - 1 : null; if (m === null || m < 0 || m >= SEE.length) return; e.preventDefault(); keys[m].focus(); });
    keysEl.appendChild(b); return b; });
  function choose(i){ if (i === cur) return; cur = i; var o = SEE[i];
    keys.forEach(function(b, j){ b.setAttribute('aria-pressed', j === i); });
    var order = o.o.concat(S.map(function(s){ return s.k; }).filter(function(k){ return o.o.indexOf(k) < 0; }));
    var first = {}; cards.forEach(function(c){ first[c.dataset.k] = c.getBoundingClientRect(); });
    order.forEach(function(k, n){ var c = cards[IX[k]]; c.classList.toggle('first', n === 0); c.classList.toggle('second', n === 1); c.classList.toggle('rest', n > 1); c.querySelector('.tag').textContent = n === 0 ? 'Start here' : n === 1 ? 'Also worth a look' : ''; deck.appendChild(c); });
    deck.classList.add('chosen');
    status.textContent = 'For “' + o.t.toLowerCase() + '”: start with ' + S[IX[o.o[0]]].n + ', then ' + S[IX[o.o[1]]].n + '.';
    if (OWL.reduce) return;
    cards.forEach(function(c){ var a = first[c.dataset.k], b = c.getBoundingClientRect(), dy = a.top - b.top; if (!dy) return;
      c.animate([{transform: 'translateY(' + dy + 'px)'}, {transform: 'none'}], {duration: 650, easing: 'cubic-bezier(.22,.9,.3,1)'}); }); }
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); } }, {threshold:.3}); io.observe(deck);
});
</script>
