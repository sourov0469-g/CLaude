<script>
OWL.reg('video','14',function(root){
  /* one idea: the problem on the front, the people who fix it on the back; turn it over */
  var scene = root.querySelector('.scene'), vid = root.querySelector('video'), flip = root.querySelector('.flip'), sr = root.querySelector('.sr'), h2 = root.querySelector('h2'), turned = false, seen = false, auto = 0;
  OWL.split(h2);
  root.querySelector('.full').addEventListener('click', function(){ OWL.ytModal('ehKLv5DF2TQ'); });
  function set(on){ turned = on; scene.classList.toggle('turned', on); flip.setAttribute('aria-pressed', on);
    sr.textContent = on ? 'The back: Owl’s crew. On it.' : 'The front: Roof trouble? A leak, a storm, a tired old roof.';
    if (on){ if (!vid.src && OWL.media) vid.src = OWL.media.crew; if (!OWL.reduce && seen) OWL.play(vid); } else vid.pause(); }
  function toggle(){ clearTimeout(auto); set(!turned); }
  scene.addEventListener('click', toggle); flip.addEventListener('click', toggle);
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); seen = true; return; }
  var once = false;
  var io = new IntersectionObserver(function(e){ seen = e[0].isIntersecting;
    if (seen){ OWL.reveal(h2); if (!once){ once = true; auto = setTimeout(function(){ if (!turned) set(true); }, 2600); } if (turned) OWL.play(vid); } else vid.pause(); }, {threshold:.4}); io.observe(scene);
});
</script>
