<style>
.wrap2{position:relative;overflow:hidden}
.wrap2 .bg{position:absolute;inset:-20% -10%;pointer-events:none;z-index:0}
.wrap2 .bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:pn2b 22s ease-in-out infinite alternate}
.wrap2 .bg i:nth-child(1){width:44vw;height:44vw;left:46%;top:8%;background:radial-gradient(circle,rgba(234,162,33,.55),rgba(234,162,33,0) 70%)}
.wrap2 .bg i:nth-child(2){width:34vw;height:34vw;left:62%;top:46%;background:radial-gradient(circle,rgba(141,180,95,.4),rgba(141,180,95,0) 70%);animation-duration:28s;animation-direction:alternate-reverse}

.wrap2 .g{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:center;gap:clamp(28px,5vw,72px)}

.wrap2 .tab b{grid-row:span 2;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--paper);font-size:18px;font-weight:800;box-shadow:0 4px 0 rgba(23,17,29,.1);transition:background .3s,transform .3s var(--ease)}

.wrap2 .tab:hover{background:rgba(234,162,33,.1)}

.wrap2 .tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap2 .cta{margin-top:26px}
.wrap2 .stage{position:relative;aspect-ratio:1/1;max-width:560px;width:100%;justify-self:center;perspective:1400px;touch-action:pan-y;cursor:grab}
.wrap2 .card{position:absolute;inset:6% 10%;margin:0;border-radius:24px;background:var(--paper);padding:12px 12px 0;display:flex;flex-direction:column;transform-style:preserve-3d;box-shadow:0 2px 0 rgba(255,255,255,.9) inset,0 40px 60px -30px rgba(23,17,29,.55);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s,filter .6s;will-change:transform}
.wrap2 .card .ph{position:relative;flex:1;min-height:0;border-radius:16px;overflow:hidden;background:#EDE9DD;transform:translateZ(30px)}
.wrap2 .card img,.wrap2 .card svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wrap2 .card .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.45),rgba(255,255,255,0) 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.wrap2 .card.on .ph::after{opacity:1}
.wrap2 figcaption{padding:12px 6px 14px;font-size:16px;font-weight:600;line-height:1.35;transform:translateZ(18px)}
.wrap2 figcaption small{display:block;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8E5A12;margin-bottom:2px}
/* three-passes card */
.wrap2 .pp .ln{stroke-dasharray:1;stroke-dashoffset:1}
.wrap2 .card.on .pp .ln{animation:pn2draw 1.2s var(--ease) forwards}
.wrap2 .card.on .pp .r2 .ln{animation-delay:.5s}.wrap2 .card.on .pp .r3 .ln{animation-delay:1s}
@keyframes pn2draw{to{stroke-dashoffset:0}}
.wrap2 .card.on .pp .rake{animation:pn2rake 2.4s ease-in-out infinite}
@keyframes pn2rake{50%{transform:translateX(26px)}}
.wrap2 .card.on .pp .magn{animation:pn2mag 3s ease-in-out infinite}
@keyframes pn2mag{50%{transform:translateX(120px)}}
.wrap2 .pp .nl{transform-box:fill-box;transform-origin:50% 50%}
.wrap2 .card.on .pp .nl{animation:pn2nail 3s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes pn2nail{0%,30%{transform:none;opacity:1}40%{transform:translateY(-18px) scale(.5);opacity:0}92%{transform:none;opacity:0}100%{opacity:1}}
.wrap2 .card.on .pp .ck{animation:pn2draw .6s 1.8s var(--ease) forwards}
@media (max-width:900px){.wrap2 .g{grid-template-columns:1fr;gap:0}.wrap2 .g>div:first-child{display:contents}.wrap2 .kick{order:1;justify-self:start}.wrap2 .h2{order:2}.wrap2 .lede{order:3;margin-bottom:8px}.wrap2 .stage{order:4;max-width:420px;aspect-ratio:4/5;margin-bottom:14px}.wrap2 .card{inset:4% 9%}.wrap2 figcaption{font-size:15px}.wrap2 .tabs{order:5;max-width:none}.wrap2 .cta{order:6;justify-self:start}}
@media (prefers-reduced-motion:reduce){.wrap2 .bg i{animation:none}.wrap2 .card{transition:none}.wrap2 .card.on .pp *{animation:none!important}.wrap2 .pp .ln,.wrap2 .pp .ck{stroke-dashoffset:0}}
</style>

<script>
OWL.reg('wrap','2',function(root){
  var tabs = [].slice.call(root.querySelectorAll('.tab')), cards = [].slice.call(root.querySelectorAll('.card')), stage = root.querySelector('.stage'), h2 = root.querySelector('h2'), cur = 0, dealt = false;
  OWL.split(h2);
  function place(){
    cards.forEach(function(c, i){
      var d = i - cur, a = Math.abs(d), on = d === 0;
      var t = dealt ? 'translateX(' + (d*30) + '%) translateZ(' + (-a*170) + 'px) rotateY(' + (-d*30) + 'deg)' + (on ? ' rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))' : '') : 'translateY(18%) translateZ(-260px) rotateX(24deg) rotateZ(' + (d*4) + 'deg)';
      c.style.transform = t; c.style.zIndex = 10 - a; c.style.opacity = dealt ? (a > 1 ? .4 : on ? 1 : .78) : 0; c.style.filter = on ? 'none' : 'saturate(.7) brightness(.97)';
      c.classList.toggle('on', on && dealt); c.setAttribute('aria-hidden', on ? 'false' : 'true'); c.inert = !on;
    });
    tabs.forEach(function(t, i){ var on = i === cur; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
  }
  function go(i, focus){ cur = (i + cards.length) % cards.length; place(); if (focus) tabs[cur].focus(); }
  tabs.forEach(function(t, i){
    t.addEventListener('click', function(){ go(i); });
    t.addEventListener('keydown', function(e){ var k = e.key, n = null;
      if (k === 'ArrowDown' || k === 'ArrowRight') n = cur + 1; else if (k === 'ArrowUp' || k === 'ArrowLeft') n = cur - 1; else if (k === 'Home') n = 0; else if (k === 'End') n = cards.length - 1;
      if (n !== null){ e.preventDefault(); go(n, true); } });
  });
  /* swipe or click the stage edges; gentle tilt on the front card */
  var sx = null, moved = false;
  stage.addEventListener('pointerdown', function(e){ sx = e.clientX; moved = false; });
  stage.addEventListener('pointerup', function(e){ if (sx === null) return; var dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1));
    else { var b = stage.getBoundingClientRect(), x = (e.clientX - b.left)/b.width; if (x < .16) go(cur - 1); else if (x > .84) go(cur + 1); } });
  if (OWL.fine && !OWL.reduce) stage.addEventListener('pointermove', function(e){
    var c = cards[cur], b = c.getBoundingClientRect(), x = (e.clientX - b.left)/b.width, y = (e.clientY - b.top)/b.height;
    c.style.setProperty('--ry', ((x - .5)*10).toFixed(2) + 'deg'); c.style.setProperty('--rx', ((.5 - y)*8).toFixed(2) + 'deg');
    c.style.setProperty('--gx', (x*100).toFixed(0) + '%'); c.style.setProperty('--gy', (y*100).toFixed(0) + '%');
  });
  stage.addEventListener('pointerleave', function(){ var c = cards[cur]; c.style.setProperty('--ry', '0deg'); c.style.setProperty('--rx', '0deg'); });
  function deal(){ if (dealt) return; dealt = true; place(); OWL.reveal(h2); }
  place();
  if (OWL.reduce || !('IntersectionObserver' in window)){ deal(); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); setTimeout(deal, 150); } }, {threshold:.25});
  io.observe(stage);
});
</script>
