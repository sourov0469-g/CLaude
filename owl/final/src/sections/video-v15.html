<section class="sec video15" id="crew-video-15" aria-labelledby="vd15-h">
<style>
.video15{overflow:hidden}
.video15 .g{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,5vw,72px);align-items:center}
.video15 .lede{margin:12px 0 24px;max-width:36ch}
.video15 .acts{display:flex;flex-direction:column;gap:14px;max-width:380px}
.video15 .acts .btn{width:100%;min-height:58px;font-size:18px}
.video15 .save{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.video15 .save svg{width:20px;height:20px}
.video15 .full{align-self:flex-start;min-height:44px;padding:0 4px;border:0;background:none;font-weight:700;text-decoration:underline;text-underline-offset:4px;color:var(--ink);cursor:pointer}
.video15 .note{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ink-70);min-height:20px}
.video15 .door{position:relative;padding:clamp(26px,4vw,48px) clamp(26px,4vw,52px) clamp(26px,3.6vw,40px);border-radius:30px;background:linear-gradient(100deg,#F4F2EE 0%,#E6E2DA 46%,#EFECE6 60%,#DEDAD1 100%);box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 rgba(23,17,29,.06),0 40px 60px -42px rgba(23,17,29,.55)}
.video15 .door::after{content:"";position:absolute;right:16px;top:14%;bottom:14%;width:12px;border-radius:6px;background:linear-gradient(90deg,#CFCAC0,#F7F5F1 45%,#BDB7AB);box-shadow:0 4px 8px -4px rgba(23,17,29,.4)}
.video15 .print{position:relative;width:min(100%,560px);margin:12px auto 0;padding:10px;background:#FFFDF7;border-radius:4px;transform:rotate(-2.2deg);box-shadow:0 18px 26px -16px rgba(23,17,29,.5)}
.video15 .print div{position:relative;aspect-ratio:3/2;overflow:hidden;background:#2A2131}
.video15 .print video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video15 .om{position:absolute;z-index:2;left:50%;top:-24px;width:64px;height:64px;margin-left:-32px;border-radius:50%;background:#FFFDF7;box-shadow:0 6px 10px -4px rgba(23,17,29,.5),inset 0 -3px 0 rgba(23,17,29,.08);display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

.video15 .print:hover .om{transform:rotate(-12deg) scale(1.06)}
.video15 .num{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 16px;margin:26px auto 0;padding:8px;border-radius:14px;text-decoration:none;max-width:560px}
.video15 .num:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.video15 .num .grp{display:inline-flex;gap:6px;white-space:nowrap}
.video15 .mg{display:inline-grid;place-items:center;width:clamp(32px,3.4vw,44px);height:clamp(40px,4.2vw,54px);border-radius:10px;font-weight:900;font-size:clamp(24px,2.8vw,36px);line-height:1;box-shadow:0 5px 0 rgba(23,17,29,.18),0 10px 14px -8px rgba(23,17,29,.45),inset 0 2px 0 rgba(255,255,255,.4);transform:rotate(var(--r,0deg));transition:transform .2s}
.video15 .mg.a{background:#EAA221;color:#17111D}.video15 .mg.b{background:#17111D;color:#F1EFE6}.video15 .mg.c{background:#FFFDF7;color:#17111D}.video15 .mg.d{background:#8C6A3A;color:#FFFDF7}
.video15 .num:hover .mg{transform:rotate(var(--r,0deg)) translateY(-3px)}
.video15 .drop .mg{opacity:0;transform:translateY(-40px) rotate(var(--r,0deg)) scale(1.1)}
.video15 .drop.on .mg{animation:vd15m .55s cubic-bezier(.3,1.6,.5,1) forwards;animation-delay:calc(var(--i) * 70ms)}
@keyframes vd15m{0%{opacity:0;transform:translateY(-40px) rotate(var(--r,0deg)) scale(1.1)}60%{opacity:1;transform:translateY(3px) rotate(var(--r,0deg)) scale(.97,1.03)}100%{opacity:1;transform:rotate(var(--r,0deg))}}
.video15 .tip{margin:10px 0 0;text-align:center;font-size:14px;font-weight:700;color:var(--ink-70)}
@media (max-width:860px){.video15 .g{grid-template-columns:minmax(0,1fr)}.video15 .acts{max-width:none}.video15 .door::after{right:8px;width:8px}}
@media (prefers-reduced-motion:reduce){.video15 .drop .mg{opacity:1;transform:rotate(var(--r,0deg))}.video15 .drop.on .mg{animation:none}.video15 .om{transition:none}}
</style>
<div class="wrap">
 <div class="g">
  <div>
   <span class="kick">Owl's crew on film</span>
   <h2 class="h2" id="vd15-h" style="margin-top:12px">Keep Us on the Fridge</h2>

   <div class="acts"><button class="btn btn-amber save" type="button" data-mag data-owl="hoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Save Our Number</button><a class="btn btn-line" href="#book" data-mag data-owl="peek">Get My Roof Checked</a><button class="full" type="button">Watch the full film</button></div>

    <div><video data-media="crew" poster="{{A:crew-poster.webp}}" muted loop playsinline preload="metadata" aria-label="Owl's crew at work: rafters and decking, shingles carried up, a finished roof"></video></div></div>
   <a class="num drop" href="tel:+16519776027" aria-label="Call (651) 977-6027" data-owl="hoot"></a>

  </div>
 </div>
</div>
<script>
OWL.reg('video','15',function(root){
  /* one idea: the crew on your fridge, with their number in magnets; keep it handy */
  var door = root.querySelector('.door'), vid = root.querySelector('video'), num = root.querySelector('.num'), note = root.querySelector('.note'), h2 = root.querySelector('h2');
  OWL.split(h2);
  root.querySelector('.full').addEventListener('click', function(){ OWL.ytModal('ehKLv5DF2TQ'); });
  /* the number, in letter magnets, each with its own colour and tilt */
  var digits = '651 977 6027', cls = ['a', 'b', 'c', 'd'], k = 0;
  digits.split(' ').forEach(function(grp){ var gEl = document.createElement('span'); gEl.className = 'grp'; gEl.setAttribute('aria-hidden', 'true');
    grp.split('').forEach(function(ch){ var s = document.createElement('span'); s.className = 'mg ' + cls[k % 4]; s.textContent = ch; s.style.setProperty('--r', (((k*37) % 11) - 5) + 'deg'); s.style.setProperty('--i', k); k++; gEl.appendChild(s); });
    num.appendChild(gEl); });
  /* a contact card with the locked facts only */
  var VCF = ['BEGIN:VCARD', 'VERSION:3.0', 'FN:Owl Roofing LLC', 'ORG:Owl Roofing LLC', 'TEL;TYPE=WORK,VOICE:+16519776027', 'EMAIL;TYPE=WORK:info@owlroofing.com', 'ADR;TYPE=WORK:;;1000 County Rd E #230;Shoreview;MN;55126;USA', 'NOTE:Mon–Sat 08:00–18:00. We Give a Hoot.', 'END:VCARD'].join('\r\n');
  root.querySelector('.save').addEventListener('click', function(){
    try { var url = URL.createObjectURL(new Blob([VCF], {type: 'text/vcard'})), a = document.createElement('a'); a.href = url; a.download = 'Owl-Roofing.vcf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      note.textContent = 'Contact card downloaded: Owl Roofing, (651) 977-6027. Open it to add us to your phone.'; } catch (e){ note.textContent = 'Our number: (651) 977-6027.'; } });
  if (OWL.reduce || !('IntersectionObserver' in window)){ num.classList.remove('drop'); OWL.reveal(h2); return; }
  var once = false;
  var io = new IntersectionObserver(function(e){ var on = e[0].isIntersecting; if (on){ OWL.reveal(h2); if (!once){ once = true; num.classList.add('on'); } if (!vid.src && OWL.media) vid.src = OWL.media.crew; OWL.play(vid); } else vid.pause(); }, {threshold:.35}); io.observe(door);
});
</script>
