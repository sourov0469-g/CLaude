<section class="sec area2" id="areas-2" aria-labelledby="ar2-h">
<style>
.area2 .g{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:center;gap:clamp(24px,5vw,64px)}
.area2 .badge{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--amber);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 3px 0 var(--amber-edge)}
.area2 .lede{margin:18px 0 26px;max-width:32ch}
.area2 .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px;max-width:520px}
.area2 .facts div{padding:14px;border-radius:16px;background:var(--paper);box-shadow:0 3px 0 rgba(23,17,29,.06)}
.area2 .facts b{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-70);margin-bottom:4px}
.area2 .facts span{font-weight:700;font-size:16px;line-height:1.3}
.area2 .find{display:flex;gap:8px;max-width:520px;margin-bottom:12px}
.area2 .find input{flex:1;min-width:0;min-height:52px;padding:0 16px;border-radius:14px;border:2px solid rgba(23,17,29,.15);background:var(--paper);font:500 17px Inter,sans-serif;color:var(--ink)}
.area2 .find input:focus{outline:none;border-color:var(--ink)}
.area2 .res{min-height:28px;margin-bottom:22px;font-weight:600}
.area2 .rad{position:relative;width:min(100%,620px);aspect-ratio:1;justify-self:center}
.area2 .rad svg{width:100%;height:100%;overflow:visible}
.area2 .ring{fill:none;stroke:#EAA221;transition:stroke-width .3s,opacity .3s}
.area2 .band{fill:#EAA221;opacity:.06;transition:opacity .3s}
.area2 .band.hot{opacity:.16}
.area2 .sweep{transform-origin:310px 310px;animation:ar2sw 9s linear infinite}
@keyframes ar2sw{to{transform:rotate(360deg)}}
.area2 .dot{cursor:pointer}
.area2 .dot circle{fill:#FFFDF8;stroke:#17111D;stroke-width:2;transition:r .25s,fill .25s}
.area2 .dot text{font:600 13px Inter,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#F1EFE6;stroke-width:4px;opacity:0;transition:opacity .2s}
.area2 .dot:hover text,.area2 .dot.on text,.area2 .dot.lab text{opacity:1}
.area2 .dot:hover circle,.area2 .dot.on circle{fill:var(--amber);r:9}
.area2 .ping{fill:none;stroke:#EAA221;stroke-width:3;opacity:0}
.area2 .ping.go{animation:ar2ping 1.2s ease-out}
@keyframes ar2ping{0%{opacity:1;r:4}100%{opacity:0;r:46}}
.area2 .note{font-size:14px;color:var(--ink-70);text-align:center;margin-top:6px}
@media (max-width:900px){.area2 .g{grid-template-columns:1fr}.area2 .facts{grid-template-columns:1fr 1fr 1fr}.area2 .facts span{font-size:14px}}
</style>
<div class="wrap">
 <div class="g">
  <div>
   <span class="badge">Service area</span>
   <h2 class="h2 rv" id="ar2-h" style="margin-top:18px">Based in Shoreview. Roofing 29 towns.</h2>
   <p class="lede rv">A local, family-owned crew, close enough to care.</p>
   <div class="facts"><div><b>Home base</b><span>Shoreview</span></div><div><b>Coverage</b><span>29 towns</span></div><div><b>Hours</b><span>Mon–Sat 8:00–18:00</span></div></div>
   <div class="find"><label class="sr" for="ar2-q">Find your town</label><input id="ar2-q" list="ar2-list" autocomplete="off" placeholder="Find your town"><datalist id="ar2-list"></datalist></div>
   <p class="res" aria-live="polite"></p>
   <a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book your Wise Check →</a>
  </div>
  <div class="rad" data-owl="say:Hoo's nearby?">
   <svg viewBox="0 0 620 620" role="img" aria-label="Rings around Shoreview with a dot for each town Owl serves, grouped near, middle and farther out. Not to scale.">
    <circle class="band" data-b="2" cx="310" cy="310" r="290"/><circle class="band" data-b="1" cx="310" cy="310" r="205"/><circle class="band" data-b="0" cx="310" cy="310" r="120"/>
    <g class="rings"></g>
    <g class="sweep"><path d="M310 310 L310 20 A290 290 0 0 1 455 59 Z" fill="url(#ar2sg)"/></g>
    <defs><linearGradient id="ar2sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EAA221" stop-opacity="0"/><stop offset="1" stop-color="#EAA221" stop-opacity=".22"/></linearGradient></defs>
    <g class="dots"></g>
    <circle class="ping" cx="310" cy="310" r="4"/>
    <g transform="translate(310 300)"><path d="M0 -52 c-26 0 -42 18 -42 40 0 30 42 56 42 56 s42 -26 42 -56 c0 -22 -16 -40 -42 -40z" fill="#EAA221" stroke="#C7871A" stroke-width="2"/>
     <circle cx="-11" cy="-18" r="9" fill="#FFFDF8"/><circle cx="11" cy="-18" r="9" fill="#FFFDF8"/><circle cx="-11" cy="-18" r="4" fill="#17111D"/><circle cx="11" cy="-18" r="4" fill="#17111D"/><path d="M-3 -8 L0 -2 L3 -8Z" fill="#17111D"/><path d="M-20 -40 L-14 -52 L-8 -42 M20 -40 L14 -52 L8 -42" fill="#C7871A"/></g>
    <text x="310" y="378" text-anchor="middle" style="font:700 15px Inter,sans-serif;fill:#17111D">Shoreview</text>
   </svg>
   <p class="note">Rings group towns by distance from Shoreview. Not to scale.</p>
  </div>
 </div>
</div>
<script>
OWL.reg('area','2',function(root){
  /* towns grouped near / middle / farther, at their rough compass direction from Shoreview */
  var T = [['North Oaks',0,0],['Lino Lakes',0,12],['White Bear Lake',0,68],['Vadnais Heights',0,110],['Maplewood',0,148],['Little Canada',0,166],['Roseville',0,192],['New Brighton',0,224],['Arden Hills',0,250],['Fridley',0,238],['Mounds View',0,275],['Blaine',0,318],
    ['Forest Lake',1,18],['Stillwater',1,98],['Oakdale',1,120],['Woodbury',1,140],['Saint Paul',1,176],['Minneapolis',1,214],['Coon Rapids',1,298],
    ['Apple Valley',2,182],['Eagan',2,168],['Burnsville',2,196],['Bloomington',2,206],['Edina',2,218],['Eden Prairie',2,226],['Minnetonka',2,236],['Plymouth',2,252],['Maple Grove',2,284]];
  var R = [88, 165, 248], svg = root.querySelector('svg'), NS = 'http://www.w3.org/2000/svg', dg = svg.querySelector('.dots'), ping = svg.querySelector('.ping'), res = root.querySelector('.res'), q = root.querySelector('input'), dl = root.querySelector('datalist');
  var rg = ''; R.forEach(function(r){ rg += '<circle class="ring" cx="310" cy="310" r="' + r + '" stroke-width="2" stroke-dasharray="2 6"/>'; }); [120,205,290].forEach(function(r){ rg += '<circle class="ring" cx="310" cy="310" r="' + r + '" stroke-width="1.2" opacity=".55"/>'; });
  svg.querySelector('.rings').innerHTML = rg;
  var nodes = {}, used = {};
  T.forEach(function(t){ var a = t[2], key = t[1] + ':' + Math.round(a/12); while (used[key]){ a += 9; key = t[1] + ':' + Math.round(a/12); } used[key] = 1;
    var rad = (a - 90)*Math.PI/180, x = 310 + Math.cos(rad)*R[t[1]], y = 310 + Math.sin(rad)*R[t[1]];
    var g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'dot' + (['Minneapolis','Saint Paul','Stillwater','Forest Lake','Maple Grove','Eagan','White Bear Lake'].indexOf(t[0]) > -1 ? ' lab' : '')); g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
    var lx = x > 310 ? 12 : -12, anchor = x > 310 ? 'start' : 'end';
    g.innerHTML = '<circle r="6"/><text x="' + lx + '" y="4" text-anchor="' + anchor + '">' + t[0] + '</text>'; g.addEventListener('click', function(){ pick(t[0]); }); dg.appendChild(g); nodes[t[0]] = {g:g, b:t[1], x:x, y:y};
    var o = document.createElement('option'); o.value = t[0]; dl.appendChild(o); });
  var o0 = document.createElement('option'); o0.value = 'Shoreview'; dl.insertBefore(o0, dl.firstChild);
  var names = ['near Shoreview', 'a little farther out', 'farther out'];
  function pick(n){
    Object.keys(nodes).forEach(function(k){ nodes[k].g.classList.toggle('on', k === n); });
    svg.querySelectorAll('.band').forEach(function(b){ b.classList.toggle('hot', nodes[n] && +b.dataset.b === nodes[n].b); });
    if (n === 'Shoreview'){ res.innerHTML = 'Shoreview is home base.'; ping.setAttribute('cx', 310); ping.setAttribute('cy', 310); }
    else { var d = nodes[n]; res.innerHTML = 'Yes, we serve ' + n + ', ' + names[d.b] + '.'; ping.setAttribute('cx', d.x); ping.setAttribute('cy', d.y); }
    ping.classList.remove('go'); void ping.getBBox(); ping.classList.add('go');
  }
  q.addEventListener('input', function(){ var v = q.value.trim().toLowerCase(); if (!v){ res.textContent = ''; return; }
    var all = ['Shoreview'].concat(T.map(function(t){ return t[0]; })), hit = all.filter(function(t){ return t.toLowerCase() === v; })[0];
    if (hit) pick(hit); else { var some = all.filter(function(t){ return t.toLowerCase().indexOf(v) === 0; }); res.textContent = some.length ? some.join(', ') : 'Not on our list yet. Call (651) 977-6027 and ask.'; } });
  svg.querySelectorAll('.band').forEach(function(b){ b.addEventListener('mouseenter', function(){ b.classList.add('hot'); }); b.addEventListener('mouseleave', function(){ b.classList.remove('hot'); }); });
  if (OWL.reduce) svg.querySelector('.sweep').style.animation = 'none';
});
</script>
</section>
