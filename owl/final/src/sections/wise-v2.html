<section class="sec wise2" id="wise-check-2" aria-labelledby="w2-h">
<style>
.wise2 .g{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(24px,4vw,56px);align-items:center}
.wise2 .stage{position:relative;border-radius:28px;background:var(--paper);padding:10px;box-shadow:0 2px 0 rgba(255,255,255,.9) inset,0 40px 70px -36px rgba(23,17,29,.55);cursor:none;touch-action:none;outline-offset:6px}
.wise2 .stage svg{display:block;width:100%;height:auto;border-radius:20px}
.wise2 .stage:focus-visible{outline:3px solid var(--ink)}
.wise2 .hint{position:absolute;left:24px;bottom:22px;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(251,250,246,.92);box-shadow:0 6px 14px -10px rgba(23,17,29,.6);pointer-events:none;transition:opacity .4s}
.wise2 .lede{margin:14px 0 22px;max-width:34ch}
.wise2 .modes{display:grid;gap:8px}
.wise2 .mode{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;text-align:left;background:transparent;transition:background .3s,box-shadow .3s}
.wise2 .mode i{grid-row:span 2;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--paper);box-shadow:0 4px 0 rgba(23,17,29,.1);transition:background .3s,transform .3s var(--ease)}
.wise2 .mode i svg{width:28px;height:28px;color:var(--ink)}
.wise2 .mode b{font-size:18px}
.wise2 .mode span{font-size:15px;color:var(--ink-70);line-height:1.35}
.wise2 .mode:hover{background:rgba(234,162,33,.1)}
.wise2 .mode[aria-checked="true"]{background:var(--paper);box-shadow:0 4px 0 rgba(23,17,29,.06),0 16px 28px -22px rgba(23,17,29,.55)}
.wise2 .mode[aria-checked="true"] i{background:var(--amber);transform:translateY(-2px) rotate(-5deg);box-shadow:0 4px 0 var(--amber-edge)}
.wise2 .strip{display:flex;gap:8px;min-height:0;margin-top:12px;flex-wrap:wrap}
.wise2 .strip figure{margin:0;width:84px;padding:4px 4px 6px;background:#fff;border-radius:6px;box-shadow:0 8px 16px -10px rgba(23,17,29,.6);transform:rotate(var(--r,0deg));animation:w2pop .45s cubic-bezier(.3,1.6,.5,1)}
.wise2 .strip svg{display:block;width:100%;height:auto;border-radius:3px}
.wise2 .strip figcaption{font-size:11px;font-weight:700;text-align:center;margin-top:3px}
@keyframes w2pop{from{transform:translateY(-30px) rotate(0) scale(.6);opacity:0}}
.wise2 .cta{margin-top:22px}
.wise2 .shoot{margin-top:12px}
.wise2 .flash{position:absolute;inset:10px;border-radius:20px;background:#fff;opacity:0;pointer-events:none}
.wise2 .flash.go{animation:w2flash .4s ease-out}
@keyframes w2flash{from{opacity:.85}to{opacity:0}}
.wise2 .air{stroke-dasharray:6 10;animation:w2air 1.4s linear infinite}
@keyframes w2air{to{stroke-dashoffset:-32}}
@media (max-width:900px){.wise2 .g{grid-template-columns:1fr}.wise2 .g>div:last-child{display:contents}.wise2 .hd{order:-2}.wise2 .stage{order:-1;cursor:default}.wise2 .modes{grid-template-columns:1fr 1fr}.wise2 .mode{grid-template-columns:1fr;padding:12px}.wise2 .mode i{grid-row:auto}.wise2 .mode span{display:none}}
@media (prefers-reduced-motion:reduce){.wise2 .air{animation:none}.wise2 .strip figure{animation:none}}
</style>
<div class="wrap">
 <div class="g">
  <div class="stage" tabindex="0" aria-label="Inspection view of a house. Move the lens with the pointer, or with the arrow keys." aria-describedby="w2-say">
   <svg viewBox="0 0 800 520" aria-hidden="true"></svg>
   <div class="flash"></div>
   <p class="hint">Move the lens over the house</p>
  </div>
  <div>
   <div class="hd"><h2 class="h2" id="w2-h">See What We See</h2>
   <p class="lede rv">Four parts to every Wise Check. Pick one, then move the lens over the house.</p></div>
   <div class="modes" role="radiogroup" aria-label="Wise Check part"></div>
   <button class="btn-plate shoot" type="button" hidden>Take a photo</button>
   <p class="sr" id="w2-say" aria-live="polite"></p>
   <div class="strip" aria-label="Photos taken"></div>
   <a class="btn btn-amber cta" href="#book" data-mag data-owl="hoot">Book a Wise Check</a>
  </div>
 </div>
</div>
<script>

    var tabs = ''; for (var x = xa + (k % 2 ? 8 : 20); x < xc - 6; x += 24) tabs += 'M' + x.toFixed(1) + ' ' + yA.toFixed(1) + 'v-5'; rows += '<path d="' + tabs + '" stroke="#3F3B46" stroke-width="1.2"/>'; }
