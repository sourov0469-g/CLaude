<style>
/* V4 · Film & Family — Owl's own crew film framed as the hero, a film roll of Owl's own photos as evidence, a founding

/* film roll of Owl's own photos */
.hero4 .rail{position:relative;contain:size;min-height:100%;border-radius:22px;overflow:hidden;background:#1E1A1F;padding:0 22px;transform:translate3d(calc(var(--px) * 6px),0,0);transition:transform 1s cubic-bezier(.22,1,.36,1);-webkit-mask:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);mask:linear-gradient(180deg,transparent,#000 9%,#000 91%,transparent);perspective:900px}

.hero4 .reel{display:flex;flex-direction:column;gap:14px;padding:14px 0;animation:h4reel 46s linear infinite}
.hero4 .rail:hover .reel{animation-play-state:paused}
@keyframes h4reel{to{transform:translateY(-50%)}}
.hero4 .reel figure{position:relative;margin:0;border-radius:6px;overflow:hidden;aspect-ratio:4/3;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.hero4 .reel img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02)}
.hero4 .reel figure::after{content:attr(data-n);position:absolute;left:6px;top:4px;font:700 9px Inter,sans-serif;letter-spacing:.14em;color:rgba(234,162,33,.9)}
@media (hover:hover) and (pointer:fine){.hero4 .reel figure:hover{transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg)) scale(1.06);box-shadow:0 18px 30px -12px rgba(0,0,0,.7)}}
.hero4 .copy .h1,.hero4 .copy .lede,.hero4 .ctas,.hero4 .facts{will-change:auto}
.hero4 .copy .lede,.hero4 .ctas,.hero4 .facts{opacity:0;transform:translateY(14px);transition:opacity .8s var(--ease),transform .8s var(--ease)}

@media (max-width:900px){.hero4 .g{grid-template-columns:1fr}.hero4 .frame{min-height:0;height:auto;overflow:visible;background:none;box-shadow:none;border-radius:0}.hero4 .rail{contain:none;min-height:0}.hero4 .frame .media{position:relative;aspect-ratio:16/10;border-radius:22px;box-shadow:0 22px 40px -22px rgba(23,17,29,.55)}.hero4 .copy{position:relative;left:auto;right:auto;bottom:auto;padding:22px 2px 6px;color:var(--ink)}.hero4 .copy .h1{color:var(--ink)}.hero4 .copy .lede{color:var(--ink-70)}.hero4 .scrim{display:none}
 .hero4 .facts{position:static;display:flex;flex-wrap:wrap;gap:8px;padding:16px 2px 4px;color:var(--ink)}.hero4 .facts span{background:var(--paper);box-shadow:inset 0 0 0 1px rgba(23,17,29,.1);backdrop-filter:none}.hero4 .btn-film.light{box-shadow:inset 0 0 0 2px var(--ink)}
 .hero4 .rail{height:132px;padding:22px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
 .hero4 .rail::before,.hero4 .rail::after{left:0;right:0;width:auto;height:22px;top:auto;bottom:auto;background:repeating-linear-gradient(90deg,transparent 0 9px,#F1EFE6 9px 19px,transparent 19px 28px);background-size:28px 10px;background-repeat:repeat-x}
 .hero4 .rail::before{top:6px;left:0}.hero4 .rail::after{bottom:6px;right:0}
 .hero4 .reel{flex-direction:row;height:100%;padding:0 14px;animation-name:h4reelx;width:max-content}

 .hero4 .stamp{width:96px}}
@media (prefers-reduced-motion:reduce){.hero4 .reel,.hero4 .stamp .ring{animation:none}.hero4 .copy .lede,.hero4 .ctas,.hero4 .facts{opacity:1;transform:none;transition:none}.hero4 .frame video{transform:none}}
</style>

<script>
OWL.reg('hero','4',function(root){
  var sec = root.querySelector('section'), g = root.querySelector('.g'), h1 = root.querySelector('.h1'), frame = root.querySelector('.frame'), cv = root.querySelector('canvas.leak'), reel = root.querySelector('.reel'), vid = root.querySelector('video');
  OWL.split(h1, 150); OWL.reveal(h1); requestAnimationFrame(function(){ sec.classList.add('go'); });
  /* the reel repeats itself once so the loop has no seam; the copies are hidden from assistive tech */
  [].slice.call(reel.children).forEach(function(f){ var c = f.cloneNode(true); c.setAttribute('aria-hidden', 'true'); c.querySelector('img').alt = ''; reel.appendChild(c); });
  root.querySelector('.btn-film.light').addEventListener('click', function(){ OWL.ytModal('ehKLv5DF2TQ'); });
  if (OWL.reduce) { vid.removeAttribute('autoplay'); vid.pause(); return; }
  /* depth: film plane against the stamp and the rail, one damped target ⟦S1330⟧ */
  var tx = 0, ty = 0, sx = 0, sy = 0, last = performance.now(), visible = true;
  if (OWL.fine){
    root.addEventListener('pointermove', function(e){ tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; }, {passive:true});
    root.addEventListener('pointerleave', function(){ tx = ty = 0; });
    reel.addEventListener('pointermove', function(e){ var f = e.target.closest('figure'); if (!f) return; var r = f.getBoundingClientRect(); f.style.setProperty('--ry', (((e.clientX - r.left) / r.width - .5) * 16).toFixed(1) + 'deg'); f.style.setProperty('--rx', (-((e.clientY - r.top) / r.height - .5) * 12).toFixed(1) + 'deg'); });
  }
  /* the splash: where the cursor crosses the film, warm light leaks onto it and fades (flowmap, ×0.953) */
  var ctx = cv.getContext('2d'), flow = OWL.flow(frame, {w: 140, radius: .16, alpha: .3});
  function size(){ var r = cv.getBoundingClientRect(); cv.width = Math.max(1, Math.round(r.width / 2)); cv.height = Math.max(1, Math.round(r.height / 2)); }
  size(); new ResizeObserver(size).observe(cv);
  if ('IntersectionObserver' in window) new IntersectionObserver(function(e){ visible = e[0].isIntersecting; if (visible) OWL.play(vid); else vid.pause(); }).observe(frame);
  (function frameLoop(now){
    requestAnimationFrame(frameLoop);
    if (!visible || document.hidden) { last = now; return; }
    var dt = Math.min(1/30, (now - last) / 1000); last = now; var al = 1 - Math.pow(1 - .055, dt * 60);
    sx += (tx - sx) * al; sy += (ty - sy) * al; g.style.setProperty('--px', sx.toFixed(3)); g.style.setProperty('--py', sy.toFixed(3));
    flow.step();
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(flow.canvas, 0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-in'; var gr = ctx.createLinearGradient(0, 0, cv.width, cv.height); gr.addColorStop(0, '#F6B23A'); gr.addColorStop(1, '#E2701E'); ctx.fillStyle = gr; ctx.fillRect(0, 0, cv.width, cv.height);
  })(last);
});
</script>
