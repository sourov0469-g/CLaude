<style>

</style>
<div class="wrap">
 <div class="hd"><span class="kick">The Wise Check</span><h2 class="h2" id="w7-h" style="margin-top:12px">The Route</h2>
  <p class="lede rv">Where each part of a Wise Check happens on a house: on the roof, in the attic, under the ceiling, and in the photos you get to see. Scroll and follow the line.</p></div>
 <div class="g">
  <div class="fig" data-owl="say:Follow the line">
   <svg viewBox="0 0 1000 640" role="img" aria-label="A cutaway house with a dotted route over the roof, into the attic, under a ceiling stain and to a table where photos are shown"></svg>
  </div>
  <div>
   <ol class="cards" aria-label="The four parts, in the order Owl lists them"></ol>
   <div class="foot"><a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book a Wise Check</a></div>
   <p class="note">Numbered as Owl lists the parts, not as a fixed order of work.</p>
  </div>
 </div>
</div>

  h += '<rect x="748" y="498" width="12" height="102" fill="#FBFAF6"/><path d="M748 498L796 516V600" fill="#C9A57A" stroke="#9C7A52" stroke-width="2"/>';

  var cards = W.parts.map(function(p, i){ var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button'; b.className = 'card';

  var shown = 0, tgt = 0, raf = 0, lock = null, now = -1;
  function at(dd){ for (var i = 1; i < V.length; i++) if (dd <= L[i]){ var k = (dd - L[i - 1])/Math.max(.01, L[i] - L[i - 1]); return [V[i - 1][0] + (V[i][0] - V[i - 1][0])*k, V[i - 1][1] + (V[i][1] - V[i - 1][1])*k]; } return V[V.length - 1]; }
  function paint(){ var rf = toRoute(shown), dd = rf*T, q = at(dd); mp.style.strokeDashoffset = (T - dd).toFixed(1);
    tip.setAttribute('cx', q[0].toFixed(1)); tip.setAttribute('cy', q[1].toFixed(1)); tipr.setAttribute('cx', q[0].toFixed(1)); tipr.setAttribute('cy', q[1].toFixed(1));
