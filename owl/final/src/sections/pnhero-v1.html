<section class="sec pghero pn1" id="nest-top" aria-labelledby="pn1h-h">
<style>
.pn1 .g{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(24px,5vw,64px);align-items:center}
.pn1 .lede{margin:18px 0 26px;max-width:36ch}
.pn1 .parts{display:grid;gap:10px;max-width:460px}
.pn1 .pt{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;min-height:64px;padding:10px 16px;border-radius:18px;background:var(--paper);text-align:left;box-shadow:0 4px 0 rgba(23,17,29,.07),0 14px 24px -20px rgba(23,17,29,.5);transition:transform .25s var(--ease),background .25s}
.pn1 .pt:hover{transform:translateX(4px)}
.pn1 .pt .nb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--cream)}
.pn1 .pt b{font-size:18px}
.pn1 .pt[aria-selected="true"]{background:var(--amber);box-shadow:0 5px 0 var(--amber-edge),0 16px 26px -16px rgba(199,135,26,.8)}
.pn1 .pt[aria-selected="true"] .nb{background:var(--ink);color:var(--cream)}
.pn1 .nest{position:relative;width:min(100%,600px);aspect-ratio:1;justify-self:center}
.pn1 .nest svg.twigs{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pn1 .win{position:absolute;inset:17%;border-radius:50%;overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 6px rgba(23,17,29,.85),0 20px 40px -20px rgba(23,17,29,.6)}
.pn1 .win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .45s,transform .8s var(--ease)}
.pn1 .win img.seal{object-fit:contain;padding:12%;background:#17111D}
.pn1 .win img.out{opacity:0;transform:scale(1.06)}
.pn1 .pin{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F6C25F,var(--amber) 55%,#D48F17);box-shadow:0 5px 0 var(--amber-edge),0 12px 20px -6px rgba(23,17,29,.5);font-weight:800;font-size:18px;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.pn1 .pin[aria-pressed="true"]{transform:scale(1.18);background:var(--ink);color:var(--cream);box-shadow:0 5px 0 #000,0 0 0 8px rgba(234,162,33,.35)}
.pn1 .cap{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:min(92%,420px);padding:14px 18px;border-radius:18px;background:var(--paper);box-shadow:0 18px 30px -18px rgba(23,17,29,.5);text-align:center}
.pn1 .cap b{display:block;font-size:19px}
.pn1 .cap span{font-size:16px;color:var(--ink-70)}
@media (max-width:900px){.pn1 .g{grid-template-columns:1fr}.pn1 .nest{order:-1;width:min(100%,440px);margin-bottom:140px}.pn1 .cap{bottom:auto;top:calc(100% + 14px)}.pn1 .parts{max-width:none}}
</style>
<div class="wrap">
 <nav class="crumb" aria-label="Breadcrumb"><a href="#/">Home</a><span aria-hidden="true">/</span><span>Protect Your Nest</span></nav>
 <div class="g">
  <div>
   <h1 class="h1" id="pn1h-h" style="font-size:clamp(40px,5vw,72px)">The Protect Your Nest System</h1>
   <p class="lede">How we look after your home and yard while the old roof comes off and the new one goes on.</p>
   <div class="parts" role="tablist" aria-label="The four parts of Protect Your Nest"></div>
  </div>
  <div class="nest" data-owl="say:Snug as a nest">
   <svg class="twigs" viewBox="0 0 600 600" aria-hidden="true"></svg>
   <div class="win" aria-live="polite"><img alt=""><img alt="" class="out"></div>
   <div class="cap" aria-hidden="true"><b></b><span></span></div>
  </div>
 </div>
</div>
<script>
OWL.reg('pnhero','1',function(root){
  var P = [
    {n:'The wrap', t:'Netting goes around the house before the old roof comes off.', img:'{{A:pn-wrap.webp}}', alt:'A house wrapped in protective netting during an Owl roof job'},
    {n:'Three cleanup passes', t:'The crew, a magnet sweep for nails, then the project manager walks it.', img:'{{A:pn-banner.webp}}', alt:'The Owl crew on site beside the Owl Roofing banner'},
    {n:'The aftercare box', t:'Left with you when the crew goes.', img:'{{A:pn-box.webp}}', alt:'The Owl aftercare box'},
    {n:'Get It Right guarantee', t:'Our 10-year workmanship guarantee.', img:'{{A:pn-seal.webp}}', alt:'The Get It Right guarantee seal', seal:1}
  ];
  var nest = root.querySelector('.nest'), tw = nest.querySelector('svg.twigs'), imgs = nest.querySelectorAll('.win img'), cap = nest.querySelector('.cap'), list = root.querySelector('.parts'), tabs = [], pins = [], cur = -1, front = 0;
  /* a woven nest: many short curved twigs around the ring, in ink and amber shades */
  var s = '', seed = 7; function rnd(){ seed = (seed*9301 + 49297) % 233280; return seed/233280; }
  for (var i = 0; i < 220; i++){ var a = rnd()*Math.PI*2, r = 222 + rnd()*62, len = .25 + rnd()*.35, a2 = a + len, r2 = r + (rnd() - .5)*30;
    var x1 = 300 + Math.cos(a)*r, y1 = 300 + Math.sin(a)*r*.98, x2 = 300 + Math.cos(a2)*r2, y2 = 300 + Math.sin(a2)*r2*.98, cx = 300 + Math.cos((a + a2)/2)*(r + 18), cy = 300 + Math.sin((a + a2)/2)*(r + 18);
    var col = ['#17111D','#3a3142','#C7871A','#8E5A12','#EAA221'][Math.floor(rnd()*5)];
    s += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) + '" stroke="' + col + '" stroke-width="' + (2 + rnd()*3).toFixed(1) + '" fill="none" stroke-linecap="round" opacity="' + (.55 + rnd()*.45).toFixed(2) + '"/>'; }
  tw.innerHTML = s;
  var ang = [-60, 30, 120, 210];
  P.forEach(function(p, i){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'pt'; b.setAttribute('role', 'tab'); b.dataset.owl = 'peek'; b.innerHTML = '<span class="nb">' + (i + 1) + '</span><b>' + p.n + '</b>';
    b.addEventListener('click', function(){ pick(i); }); b.addEventListener('keydown', function(e){ var d = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 0; if (d){ e.preventDefault(); pick((i + d + 4) % 4, true); } });
    list.appendChild(b); tabs.push(b);
    var pn = document.createElement('button'); pn.type = 'button'; pn.className = 'pin'; pn.textContent = i + 1; pn.setAttribute('aria-label', p.n); pn.tabIndex = -1; var a = (ang[i] - 90)*Math.PI/180;
    pn.style.left = (50 + Math.cos(a)*42) + '%'; pn.style.top = (50 + Math.sin(a)*42) + '%'; pn.addEventListener('click', function(){ pick(i); }); nest.appendChild(pn); pins.push(pn);
  });
  function pick(i, focus){ if (i === cur) return; cur = i; var p = P[i];
    tabs.forEach(function(t, j){ t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; if (j === i && focus) t.focus(); });
    pins.forEach(function(t, j){ t.setAttribute('aria-pressed', j === i); });
    var a = imgs[front], b = imgs[1 - front]; b.src = p.img; b.alt = p.alt; b.classList.toggle('seal', !!p.seal); b.classList.remove('out'); a.classList.add('out'); front = 1 - front;
    cap.querySelector('b').textContent = p.n; cap.querySelector('span').textContent = p.t; }
  pick(0);
});
</script>
</section>
