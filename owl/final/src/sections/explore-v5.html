<section class="sec explore5" id="explore-5" aria-labelledby="ex5-h">
<style>
.explore5{overflow:hidden}
.explore5 .hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 40px}
.explore5 .lede{margin-top:12px;max-width:44ch}
.explore5 .g{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(22px,4vw,60px);align-items:center;margin-top:clamp(18px,3vw,36px)}
.explore5 .deck{position:relative;height:clamp(380px,40vw,500px);perspective:1500px}
.explore5 .card{position:absolute;left:50%;top:50%;width:min(78%,440px);aspect-ratio:16/10;margin:0;border-radius:18px;transform-style:preserve-3d;transform:translate(-50%,-50%) translate3d(var(--x,0),var(--y,0),var(--z,0)) rotateX(var(--rx,52deg)) rotateZ(var(--rz,-28deg));transition:transform .8s cubic-bezier(.2,.9,.25,1),filter .4s;cursor:pointer;box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 26px 30px -18px rgba(23,17,29,.6)}
.explore5 .card svg{display:block;width:100%;height:100%;border-radius:inherit}
.explore5 .card::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;border-radius:0 0 12px 12px;background:var(--edge,#2a2131);transform-origin:top;transform:rotateX(-90deg)}
.explore5 .card .lb{position:absolute;left:14px;top:12px;padding:5px 10px;border-radius:999px;background:rgba(251,250,246,.94);font-weight:800;font-size:14px;pointer-events:none}
.explore5 .card:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.explore5 .card[aria-selected="true"]{filter:drop-shadow(0 0 0 transparent)}
.explore5 .info{min-height:300px}
.explore5 .info .n{font-size:14px;font-weight:800;letter-spacing:.14em;color:#8E5A12}
.explore5 .info h3{font-size:clamp(28px,3vw,40px);font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.explore5 .info p{font-size:18px;color:var(--ink-70);max-width:36ch}
.explore5 .info .num{display:flex;align-items:baseline;gap:12px;margin-top:18px;padding-top:16px;border-top:3px solid var(--amber)}
.explore5 .info .num b{font-size:clamp(40px,4.4vw,60px);font-weight:900;letter-spacing:-.04em;line-height:1}
.explore5 .info .num span{font-size:15px;font-weight:600;color:var(--ink-70);max-width:28ch}
.explore5 .info > *{transition:opacity .3s,transform .4s cubic-bezier(.22,.61,.36,1)}
.explore5 .info.out > *{opacity:0;transform:translateY(8px)}
.explore5 .note{margin-top:14px;font-size:13px;color:var(--ink-70)}
@media (max-width:900px){.explore5 .g{grid-template-columns:1fr}.explore5 .deck{height:400px}.explore5 .card{width:84%}}
@media (prefers-reduced-motion:reduce){.explore5 .card,.explore5 .info > *{transition:none}}
</style>
<div class="wrap">
 <div class="hd"><div><span class="kick">Explore the roof</span><h2 class="h2" id="ex5-h" style="margin-top:12px">The Layer Deck</h2>
  <p class="lede rv">Six layers, top to bottom. Pick one to pull it out of the stack. Arrow keys work too.</p></div></div>
 <div class="g">
  <div class="deck" role="tablist" aria-label="Roof layers, top to bottom" data-owl="say:Pull a layer"></div>
  <div class="info" id="ex5-info" role="tabpanel" aria-live="polite"><span class="n"></span><h3></h3><p></p><div class="num"><b></b><span></span></div><p class="note">Typical values for a correct roof, not a quote for yours.</p></div>
 </div>
</div>
<script>
OWL.reg('explore','5',function(root){
  function rnd(seed){ return function(){ seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; }; }
  var R = rnd(11);
  function face(k){ var s = '<svg viewBox="0 0 440 275" aria-hidden="true">', i, x, y;
    if (k === 0){ s += '<rect width="440" height="275" fill="#55505D"/>'; for (y = 0; y < 275; y += 24){ x = -R()*40; while (x < 440){ var w = 36 + R()*40, c = 74 + Math.round(R()*24); s += '<rect x="' + x.toFixed(0) + '" y="' + y + '" width="' + (w - 2).toFixed(0) + '" height="24" fill="rgb(' + c + ',' + (c - 5) + ',' + (c + 6) + ')"/><rect x="' + x.toFixed(0) + '" y="' + y + '" width="' + (w - 2).toFixed(0) + '" height="8" fill="#17111D" fill-opacity=".28"/>'; x += w; } } }
    if (k === 1){ s += '<rect width="440" height="275" fill="#D4D8DD"/>'; for (y = 30; y < 275; y += 80){ s += '<path d="M0 ' + y + 'H440" stroke="#AEB4BC"/>'; for (x = 20; x < 440; x += 120) s += '<path d="M' + x + ' ' + (y + 22) + 'h80" stroke="#5B8FC9" stroke-opacity=".55" stroke-width="2"/><circle cx="' + (x + 40) + '" cy="' + (y + 8) + '" r="5" fill="#EAA221" stroke="#8E5A12"/>'; } }
    if (k === 2){ s += '<rect width="440" height="275" fill="#1F1C24"/>'; for (y = 4; y < 275; y += 5) s += '<path d="M0 ' + y + 'H440" stroke="#3A3540" stroke-opacity="' + (.2 + R()*.4).toFixed(2) + '"/>'; s += '<text x="20" y="250" font-size="15" font-weight="700" fill="#9BA1A8">ICE &amp; WATER SHIELD</text>'; }
    if (k === 3){ s += '<rect width="440" height="275" fill="#ECEEF1"/><rect x="30" y="128" width="290" height="16" fill="#CFAF7E"/><rect x="312" y="144" width="18" height="70" fill="#E9E3D5" stroke="#B5AE9E"/><path d="M30 122 H330 V206 L352 218" fill="none" stroke="#8E949B" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><text x="30" y="250" font-size="15" font-weight="700" fill="#5E646B">DRIP EDGE · SECTION AT THE EAVE</text><text x="40" y="162" font-size="12" font-weight="700" fill="#7A5A2A">DECK</text><text x="342" y="180" font-size="12" font-weight="700" fill="#6B6460">FASCIA</text>'; }
    if (k === 4){ s += '<rect width="440" height="275" fill="#CFAF7E"/>'; for (i = 0; i < 140; i++){ x = R()*440; y = R()*275; s += '<rect x="' + x.toFixed(0) + '" y="' + y.toFixed(0) + '" width="' + (16 + R()*30).toFixed(0) + '" height="' + (3 + R()*4).toFixed(0) + '" fill="' + (R() < .5 ? '#B8925C' : '#DEC291') + '" transform="rotate(' + Math.round((R() - .5)*40) + ' ' + x.toFixed(0) + ' ' + y.toFixed(0) + ')"/>'; } s += '<path d="M220 0V275" stroke="#9C7A48" stroke-width="3"/>'; }
    if (k === 5){ s += '<rect width="440" height="275" fill="#2A2131"/>'; [70, 220, 370].forEach(function(cx){ s += '<rect x="' + (cx - 16) + '" y="0" width="32" height="275" fill="#C49A62"/>'; for (y = 10; y < 275; y += 18) s += '<path d="M' + (cx - 14) + ' ' + y + 'q14 ' + (R()*6 - 3).toFixed(1) + ' 28 0" stroke="#9C7A48" fill="none"/>'; }); }
    return s + '</svg>'; }
  var L = [
    ['Shingles', 'Laminated shingles over a starter course at the eave, laid from the eave up, each course lapping the one below with joints staggered.', '5⅝ in', 'exposure on a laminated shingle such as GAF Timberline HDZ', '#3F3B46'],
    ['Underlayment', 'Synthetic underlayment over the deck, lapped upslope over downslope and fastened with cap nails. It laps over the ice & water shield.', 'Upslope', 'over downslope, every lap, so water always runs over a seam', '#AEB4BC'],
    ['Ice & water shield', 'A self-sealing membrane at the eave, where ice dams push water back up under the shingles.', '24 in', 'inside the exterior wall line, at least, from the eave edge (IRC R905.1.2, adopted in Minnesota)', '#17111D'],
    ['Drip edge', 'Metal edge at the eave, under the ice & water shield, so water drips clear of the fascia and into the gutter.', 'Eave', 'under the ice & water; at the rakes it goes over the underlayment', '#8E949B'],
    ['Roof deck', 'OSB panels laid across the rafters with joints staggered row to row, nailed to the framing.', '⅛ in', 'gap between panels, so the deck can move with the seasons', '#9C7A48'],
    ['Rafters', 'The sloped framing everything is fastened to, with air moving up the rafter bays from the soffit to the ridge.', '16 or 24 in', 'on centre is common for rafter spacing', '#7A5A2A']];
  var deck = root.querySelector('.deck'), info = root.querySelector('.info'), h2 = root.querySelector('h2'), cur = -1;
  OWL.split(h2);
  var cards = L.map(function(l, i){ var c = document.createElement('div'); c.className = 'card'; c.setAttribute('role', 'tab'); c.id = 'ex5-c' + i; c.setAttribute('aria-controls', 'ex5-info'); c.style.setProperty('--edge', l[4]);
    c.innerHTML = face(i) + '<span class="lb" aria-hidden="true">' + ('0' + (i + 1)) + ' ' + l[0] + '</span>'; c.setAttribute('aria-label', l[0]);
    c.addEventListener('click', function(){ pick(i); });
    c.addEventListener('keydown', function(e){ var n = null; if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = Math.min(L.length - 1, cur + 1); else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = Math.max(0, cur - 1); else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = L.length - 1; else if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); pick(i); return; }
      if (n !== null){ e.preventDefault(); pick(n); cards[n].focus(); } });
    deck.appendChild(c); return c; });
  var fan = false;
  function layout(){ var n = L.length;
    cards.forEach(function(c, i){ var sel = i === cur, gap = fan ? 46 : 18, y = (i - (n - 1)/2)*gap;
      c.style.zIndex = n - i; c.setAttribute('aria-selected', sel); c.tabIndex = sel ? 0 : -1;
      c.style.setProperty('--y', (y + (sel ? 0 : 0)) + 'px'); c.style.setProperty('--x', sel ? '-14%' : '0px'); c.style.setProperty('--z', sel ? '120px' : '0px');
      c.style.setProperty('--rx', sel ? '18deg' : '52deg'); c.style.setProperty('--rz', sel ? '-6deg' : '-28deg'); }); }
  function pick(i){ if (i === cur) return; var first = cur < 0; cur = i; layout(); var l = L[i];
    function put(){ info.querySelector('.n').textContent = 'LAYER ' + ('0' + (i + 1)) + ' OF 06'; info.querySelector('h3').textContent = l[0]; info.querySelector('p').textContent = l[1]; info.querySelector('.num b').textContent = l[2]; info.querySelector('.num span').textContent = l[3]; info.setAttribute('aria-labelledby', 'ex5-c' + i); info.classList.remove('out'); }
    if (first || OWL.reduce) put(); else { info.classList.add('out'); setTimeout(put, 200); } }
  deck.addEventListener('pointerenter', function(){ fan = true; layout(); }); deck.addEventListener('pointerleave', function(){ fan = false; layout(); });
  deck.addEventListener('focusin', function(){ fan = true; layout(); }); deck.addEventListener('focusout', function(){ fan = false; layout(); });
  pick(0);
  if (OWL.reduce || !('IntersectionObserver' in window)) OWL.reveal(h2);
  else { var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); fan = true; layout(); setTimeout(function(){ fan = false; layout(); }, 1400); } }, {threshold:.3}); io.observe(deck); }
});
</script>
</section>
