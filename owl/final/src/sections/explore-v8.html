<section class="sec explore8" id="explore-8" aria-labelledby="ex8-h">
<style>
.explore8 .hd{margin-bottom:clamp(18px,2.6vw,30px)}
.explore8 .lede{margin-top:12px;max-width:48ch}
.explore8 .keys{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.explore8 .keys button{min-height:52px;padding:0 18px;border-radius:16px;font-weight:800;font-size:16px;background:linear-gradient(180deg,#FFFFFF,#F2EDE2);box-shadow:0 5px 0 #C9C0AC,0 12px 18px -12px rgba(23,17,29,.45);transition:transform .12s,box-shadow .12s,background .2s}
.explore8 .keys button:hover{transform:translateY(-2px)}
.explore8 .keys button[aria-pressed="true"]{background:linear-gradient(180deg,#F6C25F,#EAA221);box-shadow:0 2px 0 var(--amber-edge);transform:translateY(3px)}
.explore8 .keys button.ok[aria-pressed="true"]{background:linear-gradient(180deg,#7FBF7F,#2E7D32);color:#fff;box-shadow:0 2px 0 #1B5E20}
.explore8 .keys button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.explore8 .fig{border-radius:26px;background:var(--paper);box-shadow:0 2px 0 #fff inset,0 40px 70px -46px rgba(23,17,29,.5);padding:clamp(10px,2vw,22px)}
.explore8 svg{display:block;width:100%;height:auto;max-width:none}
.explore8 .nl{transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.explore8 .lbl{font:800 15px/1 var(--font,inherit);fill:#17111D}
.explore8 .sm{font:700 13px/1 var(--font,inherit);fill:#5A5560}
.explore8 .read{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;margin-top:18px}
.explore8 .read i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-style:normal;font-weight:900;font-size:22px;color:#fff;background:#B3261E}
.explore8 .read.ok i{background:#2E7D32}
.explore8 .read h3{margin:0 0 4px;font-size:clamp(22px,2.2vw,28px);font-weight:800}
.explore8 .read p{margin:0;font-size:17px;color:var(--ink-70);max-width:62ch}
@media (max-width:700px){.explore8 .keys button{flex:1 1 40%}}
@media (prefers-reduced-motion:reduce){.explore8 .nl{transition:none}.explore8 .keys button{transition:none}}
</style>
<div class="wrap">
 <div class="hd"><span class="kick">Explore the roof</span><h2 class="h2" id="ex8-h" style="margin-top:12px">The Nail Line</h2>
  <p class="lede rv">A roof is only as good as where its nails go. One shingle, front and side, nailed right and nailed four common wrong ways.</p></div>
 <div class="keys" role="group" aria-label="How the nail is driven"></div>
 <div class="fig" data-owl="say:Nailed it?"><svg viewBox="0 0 1000 470" role="img" aria-labelledby="ex8-cap"><title id="ex8-cap"></title></svg></div>
 <div class="read ok" aria-live="polite"><i aria-hidden="true">✓</i><div><h3></h3><p></p></div></div>
</div>
<script>
OWL.reg('explore','8',function(root){
  var svg = root.querySelector('svg'), keysEl = root.querySelector('.keys'), read = root.querySelector('.read'), h2 = root.querySelector('h2');
  OWL.split(h2);
  /* front view: a laminated shingle; the nailing strip sits over the common bond, just above the line the next course covers to */
  var h = '<g class="gF"><text class="lbl" x="30" y="34">Front</text>';
  h += '<rect x="30" y="60" width="440" height="300" rx="4" fill="#6E6876"/><rect x="30" y="60" width="440" height="150" fill="#7C7684"/>';
  for (var t = 0; t < 5; t++){ var x = 30 + t*88; h += '<path d="M' + (x + 10) + ' 360V292h' + (36 + (t % 3)*12) + 'v68z" fill="#4A4552"/>'; }
  h += '<rect x="30" y="196" width="440" height="34" fill="#EAA221" opacity=".28"/><path d="M30 196H470M30 230H470" stroke="#C7871A" stroke-width="2" stroke-dasharray="6 5"/>';
  h += '<text class="sm" x="40" y="188" style="fill:#FBFAF6">Nailing strip</text>';
  h += '<path d="M30 250H470" stroke="#FBFAF6" stroke-width="2" stroke-dasharray="3 6" opacity=".8"/><text class="sm" x="40" y="270" style="fill:#FBFAF6">The next course covers down to here</text>';
  h += '<g class="front">'; [56, 180, 320, 444].forEach(function(x){ h += '<g class="nl fn" transform="translate(' + x + ' 213)"><circle r="11" fill="#C9CDD2" stroke="#3A3540" stroke-width="3"/><circle r="3" fill="#3A3540"/></g>'; }); h += '</g>';
  h += '<text class="sm" x="30" y="392">At least four nails per shingle, one near each end.</text>';
  h += '</g><g class="gS"><text class="lbl" x="520" y="236">Side section, through one nail</text>';
  /* side section, drawn thick enough to read: deck, underlayment, the course below, this shingle's two layers, the course above */
  /* layer names go on last, over the nail, so a nail never hides a label */
  var names = '';
  function lay(x, y, w, hh, f, lb, col){ if (lb) names += '<text class="sm" x="' + (x + w - 8) + '" y="' + (y + hh/2 + 5) + '" text-anchor="end" style="fill:' + (col || '#FBFAF6') + ';paint-order:stroke;stroke:' + f + ';stroke-width:4px">' + lb + '</text>'; return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hh + '" fill="' + f + '"/>'; }
  h += lay(520, 378, 460, 46, '#DDBD82', 'Deck', '#5E3A08') + lay(520, 368, 460, 10, '#C2CCD3');
  h += lay(770, 344, 210, 24, '#4A4552', 'Course below');
  h += lay(640, 320, 340, 24, '#3F3946', 'Bottom layer');
  h += lay(520, 296, 460, 24, '#6E6876', 'This shingle, top layer');
  var a0 = names.length; h += '<g class="above">' + lay(520, 266, 270, 24, '#8A8494') + '<text class="sm" x="782" y="283" text-anchor="end" style="fill:#FBFAF6">Course above</text></g>';
  h += '<g class="nl sn" transform="translate(700 0)"><rect x="-3.5" y="292" width="7" height="104" fill="#9AA3A8"/><rect class="hd" x="-15" y="286" width="30" height="8" rx="2" fill="#C9CDD2" stroke="#3A3540" stroke-width="2"/></g>';
  h += names;
  h += '<g class="fx tear" opacity="0"><path d="M684 297l8 7 8-7 8 7 8-7" stroke="#B3261E" stroke-width="3" fill="none"/><text class="sm" x="726" y="252" style="fill:#B3261E">cut into the mat</text></g>';
  h += '<g class="fx gap" opacity="0"><path d="M520 282H790" stroke="#B3261E" stroke-width="3" stroke-dasharray="5 5"/><text class="sm" x="800" y="262" style="fill:#B3261E">lifted: can’t seal</text></g>';
  h += '<g class="fx bare" opacity="0"><circle cx="880" cy="290" r="20" fill="none" stroke="#B3261E" stroke-width="3"/><text class="sm" x="820" y="252" style="fill:#B3261E">head out in the weather</text></g>';
  h += '<g class="fx miss" opacity="0"><path d="M560 356l40-36" stroke="#B3261E" stroke-width="3"/><text class="sm" x="530" y="452" style="fill:#B3261E">misses the bottom layer</text></g>';
  h += '</g>';
  svg.insertAdjacentHTML('beforeend', h);
  /* on a narrow screen the side section sits under the front view, so both stay readable */
  var gS = svg.querySelector('.gS'), fig = root.querySelector('.fig'), narrow = null;
  function layout(){ var n = fig.clientWidth < 620; if (n === narrow) return; narrow = n; svg.setAttribute('viewBox', n ? '0 0 500 720' : '0 0 1000 470'); gS.setAttribute('transform', n ? 'translate(-500 230)' : ''); }
  layout(); addEventListener('resize', layout);
  var fn = [].slice.call(svg.querySelectorAll('.fn')), sn = svg.querySelector('.sn'), above = svg.querySelector('.above'), fx = {tear: svg.querySelector('.tear'), gap: svg.querySelector('.gap'), bare: svg.querySelector('.bare'), miss: svg.querySelector('.miss')};
  var C = [
    {k:'Right', ok:1, fy:213, sx:180, sy:0, ay:0, fx:[], t:'Nailed right', p:'In the nailing strip, through both layers where they are bonded, driven flush. At least four nails per shingle, and the next course covers every head.'},
    {k:'Too high', fy:150, sx:60, sy:0, ay:0, fx:['miss'], t:'Too high', p:'Above the strip the nail misses the lower layer. The shingle is held by less, and wind can tear it loose.'},
    {k:'Too low', fy:300, sx:360, sy:0, ay:0, fx:['bare'], t:'Too low', p:'Below the strip the head lands in the part of the shingle you can see. It sits out in the weather and can let water in.'},
    {k:'Over-driven', fy:213, sx:180, sy:10, ay:0, fx:['tear'], t:'Over-driven', p:'Driven too hard, the head cuts into the shingle’s mat. It holds less and can pull through.'},
    {k:'Under-driven', fy:213, sx:180, sy:-14, ay:-14, fx:['gap'], t:'Under-driven', p:'Not driven home, the raised head props up the course above, so its seal strip can’t stick down.'}];
  var X0 = 520, cur = -1, keys = C.map(function(c, i){ var b = document.createElement('button'); b.type = 'button'; b.textContent = c.k; if (c.ok) b.className = 'ok'; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', function(){ pick(i); }); keysEl.appendChild(b); return b; });
  function pick(i){ if (i === cur) return; cur = i; var c = C[i];
    keys.forEach(function(b, j){ b.setAttribute('aria-pressed', j === i); });
    /* CSS transforms (they override the attribute) so the nails ease into place */
    fn.forEach(function(n){ n.style.transform = 'translate(' + n.getAttribute('transform').match(/translate\(([\d.]+)/)[1] + 'px,' + c.fy + 'px)'; });
    sn.style.transform = 'translate(' + (X0 + c.sx) + 'px,' + c.sy + 'px)'; above.style.transform = 'translate(0px,' + c.ay + 'px)'; above.style.transition = 'transform .55s cubic-bezier(.3,1.5,.5,1)';
    Object.keys(fx).forEach(function(k){ fx[k].setAttribute('opacity', c.fx.indexOf(k) >= 0 ? 1 : 0); });
    read.classList.toggle('ok', !!c.ok); read.querySelector('i').textContent = c.ok ? '✓' : '✕'; read.querySelector('h3').textContent = c.t; read.querySelector('p').textContent = c.p;
    svg.querySelector('title').textContent = 'A shingle nailed ' + c.k.toLowerCase() + ', front view and side section.'; }
  pick(0);
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); } }, {threshold:.3}); io.observe(svg);
});
</script>
</section>
