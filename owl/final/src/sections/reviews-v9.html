<style>

<div class="wrap">
 <div class="hd"><div><span class="kick">Reviews</span><h2 class="h2" id="rv9-h" style="margin-top:12px">Stamped</h2>

<script>
OWL.reg('reviews','9',function(root){
  var paper = root.querySelector('.paper'), stamp = root.querySelector('.stamp'), log = root.querySelector('.log'), h2 = root.querySelector('h2');
  OWL.split(h2);
  var A = '#9A5A0C', K = '#17111D';
  function seal(c, top, big, small){ return '<svg viewBox="0 0 240 240" class="imp" aria-hidden="true"><g filter="url(#rv9ink)" fill="none" stroke="' + c + '"><circle cx="120" cy="120" r="108" stroke-width="7"/><circle cx="120" cy="120" r="94" stroke-width="3"/>'
    + '<path id="__ID__" d="M120 120m-80 0a80 80 0 1 1 160 0a80 80 0 1 1-160 0" stroke="none"/><text font-size="17" font-weight="900" letter-spacing="2" textLength="470" lengthAdjust="spacing" fill="' + c + '" stroke="none"><textPath href="#__ID__" startOffset="0">' + top + '</textPath></text>'
    + '<text x="120" y="132" text-anchor="middle" font-size="' + (big.length > 4 ? 40 : 62) + '" font-weight="900" fill="' + c + '" stroke="none">' + big + '</text><text x="120" y="166" text-anchor="middle" font-size="17" font-weight="900" letter-spacing="2" fill="' + c + '" stroke="none">' + small + '</text></g></svg>'; }
  function box(c, big, small){ return '<svg viewBox="0 0 260 150" class="imp" aria-hidden="true"><g filter="url(#rv9ink)"><rect x="8" y="8" width="244" height="134" rx="10" fill="none" stroke="' + c + '" stroke-width="7"/><rect x="20" y="20" width="220" height="110" rx="6" fill="none" stroke="' + c + '" stroke-width="2.5"/>'
    + '<text x="130" y="80" text-anchor="middle" font-size="' + (big.length > 10 ? 21 : 40) + '" font-weight="900" fill="' + c + '">' + big + '</text><text x="130" y="112" text-anchor="middle" font-size="15" font-weight="900" letter-spacing="1.5" fill="' + c + '">' + small + '</text></g></svg>'; }
  var ST = [
    {say:'5.0 from 90+ reviews', svg:seal(A, 'OWL ROOFING · WE GIVE A HOOT ·', '5.0', '90+ REVIEWS')},
    {say:'BBB A− since Feb 25, 2026', svg:box(K, 'BBB A−', 'SINCE FEB 25, 2026')},
    {say:'GAF Systems Plus', svg:box(A, 'GAF SYSTEMS PLUS', 'CERTIFIED CREW')},
    {say:'MN licence #BC809662', svg:box(K, '#BC809662', 'MINNESOTA LICENCE')},
    {say:'10-year workmanship warranty', svg:seal(K, 'OWL ROOFING · WARRANTY ·', '10-YEAR', 'WORKMANSHIP')}];
  var n = 0, uid = 0, imps = [];
  function press(x, y){ var s = ST[n % ST.length], w = paper.clientWidth, h = paper.clientHeight; n++;
    var holder = document.createElement('div'); holder.innerHTML = s.svg.replace(/__ID__/g, 'rv9p' + (++uid)); var el = holder.firstChild;
    el.style.left = Math.max(60, Math.min(w - 60, x)) + 'px'; el.style.top = Math.max(60, Math.min(h - 60, y)) + 'px'; el.style.setProperty('--r', (Math.random()*16 - 8).toFixed(1) + 'deg');
    paper.appendChild(el); imps.push(el); if (imps.length > 10){ var old = imps.shift(); old.classList.add('gone'); setTimeout(function(){ old.remove(); }, 500); }
    if (!OWL.reduce){ el.classList.add('fresh'); requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.remove('fresh'); }); }); stamp.style.setProperty('--p', .86); setTimeout(function(){ stamp.style.setProperty('--p', 1); }, 140); }
    log.textContent = 'Stamped: ' + s.say + '.'; }
  function randomPress(){ var w = paper.clientWidth, h = paper.clientHeight; press(80 + Math.random()*(w - 160), 80 + Math.random()*(h - 160)); }
  paper.addEventListener('pointermove', function(e){ var r = paper.getBoundingClientRect(); stamp.style.setProperty('--x', (e.clientX - r.left) + 'px'); stamp.style.setProperty('--y', (e.clientY - r.top) + 'px'); stamp.classList.remove('away'); });
  paper.addEventListener('pointerleave', function(){ stamp.classList.add('away'); });
  paper.addEventListener('click', function(e){ var r = paper.getBoundingClientRect(); press(e.clientX - r.left, e.clientY - r.top); });
  root.querySelector('.go').addEventListener('click', randomPress);
  root.querySelector('.clr').addEventListener('click', function(){ imps.forEach(function(el){ el.classList.add('gone'); setTimeout(function(){ el.remove(); }, 500); }); imps = []; n = 0; log.textContent = 'The page is clear.'; });
  stamp.classList.add('away');
  function opening(){ var w = paper.clientWidth, h = paper.clientHeight; press(w*.32, h*.48); if (OWL.reduce){ press(w*.62, h*.36); press(w*.7, h*.7); return; } setTimeout(function(){ press(w*.62, h*.36); }, 500); setTimeout(function(){ press(w*.72, h*.72); }, 1000); }
  if (OWL.reduce || !('IntersectionObserver' in window)){ opening(); OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); opening(); } }, {threshold:.35}); io.observe(paper);
});
</script>
