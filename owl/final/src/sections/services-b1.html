<section class="sec svc2" id="services-2" aria-labelledby="sv2-h">
<style>
.svc2 .panel{position:relative;padding:clamp(24px,4vw,48px);border-radius:32px;background:var(--paper);box-shadow:0 2px 0 #fff inset,0 40px 70px -40px rgba(23,17,29,.45)}
.svc2 .hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 28px}
.svc2 .feathers{display:block;width:100%;height:34px;margin:22px 0 8px}
.svc2 ol{list-style:none}
.svc2 li{border-bottom:1px solid transparent;background:linear-gradient(90deg,transparent,rgba(23,17,29,.14) 12%,rgba(23,17,29,.14) 88%,transparent) bottom/100% 1px no-repeat}
.svc2 .r{display:grid;grid-template-columns:150px 1fr auto;align-items:center;gap:clamp(16px,3vw,40px);width:100%;padding:14px 8px;text-align:left;border-radius:16px;transition:background .3s}
.svc2 .r:hover,.svc2 li.open .r{background:rgba(234,162,33,.08)}
.svc2 .r img{width:150px;height:84px;object-fit:cover;border-radius:12px;box-shadow:0 10px 20px -12px rgba(23,17,29,.6);transition:transform .4s var(--ease)}
.svc2 .r:hover img{transform:rotate(-2deg) scale(1.04)}
.svc2 .r .ttl{display:block;font-size:clamp(24px,3vw,40px);font-weight:600;letter-spacing:-.025em;line-height:1.1}
.svc2 .r .n{font-weight:600;font-size:14px;color:var(--ink-70);font-variant-numeric:tabular-nums}
.svc2 .r .pl{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cream);box-shadow:0 3px 0 rgba(23,17,29,.1);transition:transform .35s var(--ease),background .3s}
.svc2 li.open .pl{transform:rotate(45deg);background:var(--amber)}
.svc2 .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.svc2 li.open .more{grid-template-rows:1fr}
.svc2 .more>div{overflow:hidden}
.svc2 .more p{padding:0 8px 0 calc(150px + clamp(16px,3vw,40px) + 8px);font-size:18px;color:var(--ink-70);max-width:calc(150px + 60ch)}
.svc2 .more a{display:inline-flex;margin:12px 0 22px calc(150px + clamp(16px,3vw,40px) + 8px);font-weight:700;text-underline-offset:5px}
.svc2 .float{position:fixed;left:0;top:0;z-index:60;width:300px;aspect-ratio:3/2;border-radius:18px;overflow:hidden;pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .25s,transform .35s var(--ease);box-shadow:0 30px 50px -20px rgba(23,17,29,.6)}
.svc2 .float.on{opacity:1;transform:scale(1)}
.svc2 .float img{width:100%;height:100%;object-fit:cover}
@media (max-width:700px){.svc2 .r{grid-template-columns:84px 1fr 44px}.svc2 .r img{width:84px;height:60px}.svc2 .r .n{display:none}.svc2 .more p,.svc2 .more a{padding-left:8px;margin-left:8px}.svc2 .float{display:none}}
</style>
<div class="wrap">
 <div class="panel">
  <div class="hd"><h2 class="h2 rv" id="sv2-h">Everything Your Roof Needs</h2><a class="btn btn-amber btn-sm" href="tel:+16519776027" data-mag data-owl="hoot">Call (651) 977-6027</a></div>
  <svg class="feathers" viewBox="0 0 1200 34" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  <ol></ol>
 </div>
</div>
<div class="float" aria-hidden="true"><img alt=""></div>
<script>
OWL.reg('services','2',function(root){
  var S = [
    ['Roof Replacement','Tear-off to ridge cap with GAF materials, backed by our 10-year workmanship warranty.',OWL.media['svc-replace']],
    ['Roof Repair','Leaks, lifted shingles, flashing and vents, fixed before small problems spread.',OWL.media['svc-repair']],
    ['Storm Damage Help','Hail and wind damage found and put right.',OWL.media['svc-storm']],
    ['Wise Check Inspections','Our roof inspection: shingles, flashing, ventilation and gutters.',OWL.media['svc-check']],
    ['Siding','New siding to finish what the new roof started.',OWL.media['svc-siding']]
  ];
  var ol = root.querySelector('ol'), fl = root.querySelector('.float'), fimg = fl.querySelector('img'), fe = root.querySelector('.feathers');
  /* a row of feathers drawn as SVG: shaft, vanes and banding in ink and amber */
  var f = '<defs><linearGradient id="sv2fg" x1="0" x2="1"><stop offset="0" stop-color="#17111D"/><stop offset=".55" stop-color="#C7871A"/><stop offset="1" stop-color="#EAA221"/></linearGradient></defs>';
  for (var i = 0; i < 7; i++){ var x = 30 + i*172, w = 130 + (i % 3)*8, h = 13;
    f += '<g transform="translate(' + x + ' 17) rotate(' + (i % 2 ? 2.5 : -2.5) + ')">';
    f += '<path d="M0 0 C' + w*.2 + ' ' + (-h) + ' ' + w*.7 + ' ' + (-h*.9) + ' ' + w + ' -1 C' + w*.72 + ' ' + h*.55 + ' ' + w*.3 + ' ' + h*.75 + ' 0 0Z" fill="url(#sv2fg)" opacity=".9"/>';
    for (var k = 1; k < 22; k++){ var bx = k*w/22, up = Math.sin(Math.PI*k/22); f += '<path d="M' + bx + ' 0 L' + (bx + 7) + ' ' + (-h*.95*up) + ' M' + bx + ' 0 L' + (bx + 6) + ' ' + (h*.7*up) + '" stroke="#F1EFE6" stroke-opacity=".35" stroke-width=".8"/>'; }
    for (var m = 0; m < 3; m++){ var gx = w*(.3 + m*.2); f += '<path d="M' + gx + ' -1 l4 ' + (-h*.8) + '" stroke="#F1EFE6" stroke-width="2.2" opacity=".55"/>'; }
    f += '<path d="M-10 1 L' + (w + 2) + ' -1" stroke="#17111D" stroke-width="1.6" stroke-linecap="round"/></g>'; }
  fe.innerHTML = f;
  S.forEach(function(s, i){
    var li = document.createElement('li'), id = 'sv2-m' + i;
    li.innerHTML = '<button class="r" type="button" aria-expanded="false" aria-controls="' + id + '" data-owl="peek"><img src="' + s[2] + '" alt=""><span><span class="n">0' + (i + 1) + '</span><span class="ttl">' + s[0] + '</span></span><span class="pl" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2v14M2 9h14" stroke="#17111D" stroke-width="2.4" stroke-linecap="round"/></svg></span></button>' +
      '<div class="more" id="' + id + '"><div><p>' + s[1] + '</p><a href="#book">Book a Wise Check →</a></div></div>';
    var b = li.querySelector('.r');
    b.addEventListener('click', function(){ var o = !li.classList.contains('open'); ol.querySelectorAll('li').forEach(function(x){ x.classList.remove('open'); x.querySelector('.r').setAttribute('aria-expanded', 'false'); }); if (o){ li.classList.add('open'); b.setAttribute('aria-expanded', 'true'); } });
    b.addEventListener('mouseenter', function(){ if (!OWL.fine) return; fimg.src = s[2]; fl.classList.add('on'); });
    b.addEventListener('mouseleave', function(){ fl.classList.remove('on'); });
    ol.appendChild(li);
  });
  if (OWL.fine) addEventListener('pointermove', function(e){ if (!fl.classList.contains('on')) return; fl.style.left = (e.clientX + 30) + 'px'; fl.style.top = (e.clientY - 100) + 'px'; }, {passive:true});
  ol.firstChild.classList.add('open'); ol.firstChild.querySelector('.r').setAttribute('aria-expanded', 'true');
});
</script>
</section>
