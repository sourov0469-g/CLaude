<section class="sec rev3" id="reviews-3" aria-labelledby="rv3-h">
<style>
.rev3 .field{position:relative;border-radius:32px;background:radial-gradient(ellipse at 50% 50%,#FBF7EC 0%,#F4EFE2 60%,#EDE6D5 100%);overflow:hidden;min-height:clamp(560px,52vw,680px);display:grid;place-items:center;box-shadow:0 2px 0 rgba(255,255,255,.9) inset,0 50px 80px -46px rgba(23,17,29,.5);touch-action:pan-y}
.rev3 canvas{position:absolute;inset:0;width:100%;height:100%}
.rev3 .card{position:relative;z-index:2;width:min(440px,calc(100% - 40px));padding:clamp(22px,3vw,34px);border-radius:26px;background:rgba(251,250,246,.94);text-align:center;box-shadow:0 2px 0 #fff inset,0 30px 60px -30px rgba(23,17,29,.55),0 0 0 1px rgba(234,162,33,.35)}
.rev3 .kick{justify-content:center}
.rev3 .num{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 2px}
.rev3 .num b{font-size:clamp(70px,8vw,104px);font-weight:900;letter-spacing:-.05em;line-height:.95}
.rev3 .num .st{display:grid;grid-template-columns:repeat(5,18px);gap:3px}
.rev3 .num .st svg{width:18px;height:18px;color:var(--amber)}
.rev3 .num .st span{grid-column:1/-1;font-size:15px;font-weight:800;text-align:left;margin-top:4px}
.rev3 h2{font-size:clamp(22px,2.2vw,28px)}
.rev3 .note{margin:10px auto 16px;max-width:32ch;font-size:16px;color:var(--ink-70)}
.rev3 .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}
.rev3 .chips span{font-size:14px;font-weight:700;padding:7px 12px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(23,17,29,.1),0 3px 0 rgba(23,17,29,.06)}
.rev3 .chips span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:8px;vertical-align:1px}
@media (max-width:760px){.rev3 .field{min-height:780px}}
</style>
<div class="wrap">
 <div class="field" data-owl="say:Make a splash">
  <canvas aria-hidden="true"></canvas>
  <div class="card">
   <span class="kick">Reviews</span>
   <p class="sr">Rated 5.0 from 90+ reviews.</p>
   <div class="num" aria-hidden="true"><b>5.0</b><span class="st" aria-hidden="true"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><span>90+ reviews</span></span></div>
   <h2 class="h2" id="rv3-h">Ninety-Plus and Counting</h2>
   <p class="note">Around this card: 90 feathers, one for each review so far, and a plus for the next one.</p>
   <div class="chips"><span>BBB A−</span><span>GAF Systems Plus</span><span>10-year workmanship warranty</span></div>
   <a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book a Wise Check</a>
  </div>
 </div>
</div>
<script>
OWL.reg('reviews','3',function(root){
  var field = root.querySelector('.field'), cv = root.querySelector('canvas'), ctx = cv.getContext('2d'), card = root.querySelector('.card'), h2 = root.querySelector('h2');
  var FS = 1, dpr = Math.min(2, devicePixelRatio || 1), W = 0, H = 0, M = [], waves = [], vis = false, lastSplash = 0, user = 0, t0 = performance.now();
  function layout(){
    var b = field.getBoundingClientRect(); W = b.width; H = b.height; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var c = card.getBoundingClientRect(), cx = c.left - b.left + c.width/2, cy = c.top - b.top + c.height/2, rx0 = 0, ry0 = 0;
    /* place exactly 91 marks (90 + the plus) on a grid that avoids the card, so every mark is always visible */
    var cl = c.left - b.left - 18, cr = c.right - b.left + 18, ct = c.top - b.top - 18, cb = c.bottom - b.top + 18, cand = [];
    for (var sp = 72; sp >= 20; sp -= 2){ cand = []; var cols = Math.floor((W - 36)/sp), rows = Math.floor((H - 36)/sp), ox = (W - (cols - 1)*sp)/2, oy = (H - (rows - 1)*sp)/2;
      for (var r = 0; r < rows; r++) for (var q = 0; q < cols; q++){ var x = ox + q*sp + (r % 2 ? sp*.25 : -sp*.25), y = oy + r*sp; if (x < 14 || x > W - 14) continue; if (x > cl && x < cr && y > ct && y < cb) continue; cand.push([x, y]); }
      if (cand.length >= 91) break; }
    FS = Math.max(.85, Math.min(1.7, sp/38)); M = [];
    for (var n = 0; n < 91 && cand.length; n++){ var pt = cand[Math.floor(n*cand.length/91)]; M.push({x: pt[0], y: pt[1], a: Math.atan2(pt[1] - cy, pt[0] - cx) + Math.PI/2, z: 0, v: 0, ph: n*1.7, plus: false}); }
    M[M.length - 1].plus = true;
  }
  function splash(x, y, s){ waves.push({x: x, y: y, r: 0, s: s || 1}); if (waves.length > 6) waves.shift(); }
  function feather(m, lift){
    var k = (1 + lift*.55)*FS, col = lift > .05 ? 'rgba(' + Math.round(23 + 211*lift) + ',' + Math.round(17 + 145*lift) + ',' + Math.round(29 + 4*lift) + ',' + (.55 + .45*lift) + ')' : 'rgba(23,17,29,.42)';
    ctx.save(); ctx.translate(m.x, m.y - lift*10); ctx.rotate(m.a + Math.sin(m.ph)*.08 + lift*.6); ctx.scale(k, k);
    if (m.plus){ ctx.strokeStyle = lift > .05 ? col : '#C7871A'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, 7); ctx.stroke(); ctx.restore(); return; }
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, -12); ctx.quadraticCurveTo(7, -3, 1.5, 10); ctx.lineTo(-1.5, 10); ctx.quadraticCurveTo(-7, -3, 0, -12); ctx.fill();
    ctx.strokeStyle = 'rgba(251,250,246,.75)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 14); ctx.stroke(); ctx.restore();
  }
  function frame(t){
    if (vis){
      var dt = Math.min(48, t - (frame.l || t)); frame.l = t; ctx.clearRect(0, 0, W, H);
      waves.forEach(function(w){ w.r += dt*.42; }); waves = waves.filter(function(w){ return w.r < Math.max(W, H)*1.2; });
      if (!OWL.reduce && t - user > 3800 && t - lastSplash > 3600){ lastSplash = t; splash(W*(.15 + Math.random()*.7), H*(.15 + Math.random()*.7), .8); }
      M.forEach(function(m){ var f = 0; waves.forEach(function(w){ var d = Math.hypot(m.x - w.x, m.y - w.y), band = Math.abs(d - w.r); if (band < 34) f += (1 - band/34)*w.s*Math.max(0, 1 - w.r/900); });
        m.v += (f*1.6 - m.z)*.18; m.v *= .78; m.z += m.v; m.ph += dt*.0012; feather(m, Math.max(0, Math.min(1, m.z))); });
      waves.forEach(function(w){ ctx.strokeStyle = 'rgba(234,162,33,' + (Math.max(0, .35 - w.r/1400)).toFixed(3) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI*2); ctx.stroke(); });
    }
    if (!OWL.reduce) requestAnimationFrame(frame);
  }
  layout(); addEventListener('resize', function(){ layout(); if (OWL.reduce) still(); });
  function still(){ ctx.clearRect(0, 0, W, H); M.forEach(function(m){ feather(m, 0); }); }
  var lp = 0;
  field.addEventListener('pointermove', function(e){ var b = field.getBoundingClientRect(), now = performance.now(); user = now; if (now - lp > 160){ lp = now; splash(e.clientX - b.left, e.clientY - b.top, .7); } });
  field.addEventListener('pointerdown', function(e){ var b = field.getBoundingClientRect(); user = performance.now(); splash(e.clientX - b.left, e.clientY - b.top, 1.4); });
  if (OWL.reduce){ vis = true; still(); OWL.reveal(h2); return; }
  if ('IntersectionObserver' in window) new IntersectionObserver(function(e){ vis = e[0].isIntersecting; if (vis){ layout(); OWL.reveal(h2); if (!frame.d){ frame.d = 1; var b = card.getBoundingClientRect(), f = field.getBoundingClientRect(); splash(b.left - f.left + b.width/2, b.top - f.top + b.height/2, 1.2); } } }).observe(field);
  else vis = true;
  requestAnimationFrame(frame);
});
</script>
</section>
