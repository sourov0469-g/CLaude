<section class="sec pghero sh2" id="services-top-2" aria-labelledby="sh2-h">
<style>
.sh2 .g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:start}
.sh2 .lede{margin:18px 0 28px;max-width:34ch}
.sh2 .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sh2 .t{display:flex;align-items:center;gap:14px;min-height:84px;padding:14px 16px;border-radius:20px;background:var(--paper);text-align:left;font-weight:700;font-size:17px;line-height:1.2;box-shadow:0 5px 0 rgba(23,17,29,.08),0 16px 26px -20px rgba(23,17,29,.55);transition:transform .25s var(--ease),box-shadow .25s,background .25s}
.sh2 .t:hover{transform:translateY(-3px)}
.sh2 .t:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(23,17,29,.08)}
.sh2 .t svg{width:46px;height:46px;flex:none;color:var(--ink)}
.sh2 .t[aria-selected="true"]{background:var(--amber);box-shadow:0 6px 0 var(--amber-edge),0 18px 30px -16px rgba(199,135,26,.8)}
.sh2 .t[aria-selected="true"] svg path[stroke="#EAA221"],.sh2 .t[aria-selected="true"] svg path[fill="#EAA221"]{stroke:#17111D;fill:#17111D}
.sh2 .t:last-child{grid-column:1/-1}
.sh2 .card{border-radius:28px;background:var(--paper);overflow:hidden;box-shadow:0 2px 0 #fff inset,0 36px 60px -36px rgba(23,17,29,.55)}
.sh2 .ph{position:relative;aspect-ratio:16/9;background:#3a3142}
.sh2 .ph img{width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.sh2 .ph .lbl{position:absolute;left:18px;top:16px;background:var(--ink);color:var(--cream);font-weight:700;font-size:14px;padding:7px 12px;border-radius:999px}
.sh2 .bd{padding:clamp(20px,3vw,32px)}
.sh2 .bd h2{font-size:clamp(26px,2.6vw,36px);font-weight:800;letter-spacing:-.03em}
.sh2 .bd p{margin:8px 0 16px;color:var(--ink-70);font-size:17px}
.sh2 .bd ul{list-style:none;display:grid;gap:10px;margin-bottom:22px}
.sh2 .bd li{display:flex;gap:12px;font-weight:500}
.sh2 .bd li svg{flex:none;width:22px;height:22px;margin-top:1px}
@media (max-width:900px){.sh2 .g{grid-template-columns:minmax(0,1fr)}}@media (max-width:520px){.sh2 .t{font-size:15px;gap:10px;padding:12px}.sh2 .t svg{width:34px;height:34px}}
</style>
<div class="wrap">
 <nav class="crumb" aria-label="Breadcrumb"><a href="#/">Home</a><span aria-hidden="true">/</span><span>Services</span></nav>
 <div class="g">
  <div>
   <h1 class="h1" id="sh2-h" style="font-size:clamp(40px,5vw,70px)">Pick Your Roof Job</h1>
   <p class="lede">One family-owned crew from Shoreview, five kinds of work.</p>
   <div class="tiles" role="tablist" aria-label="Services"></div>
  </div>
  <div class="card" role="tabpanel" aria-live="polite">
   <div class="ph"><img alt=""><span class="lbl"></span></div>
   <div class="bd"><h2></h2><p></p><ul></ul><a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book a Wise Check</a></div>
  </div>
 </div>
</div>
<script>
OWL.reg('svchero','2',function(root){
  var tiles = root.querySelector('.tiles'), card = root.querySelector('.card'), img = card.querySelector('img'), ts = [];
  var tick = '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="#EAA221"/><path d="M6.5 11.5l3 3 6-7" stroke="#17111D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  OWL.SVC.forEach(function(s, i){
    var b = document.createElement('button'); b.type = 'button'; b.className = 't'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false'); b.tabIndex = -1; b.dataset.owl = 'peek';
    b.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true">' + s.ico + '</svg>' + s.n; b.addEventListener('click', function(){ pick(i); });
    b.addEventListener('keydown', function(e){ var d = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : (e.key === 'ArrowLeft' || e.key === 'ArrowUp') ? -1 : 0; if (d){ e.preventDefault(); pick((i + d + ts.length) % ts.length, true); } });
    tiles.appendChild(b); ts.push(b);
  });
  function pick(i, focus){ var s = OWL.SVC[i];
    ts.forEach(function(t, j){ t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; if (j === i && focus) t.focus(); });
    img.style.opacity = 0; setTimeout(function(){ img.src = OWL.media[s.img]; img.alt = s.n; img.style.opacity = 1; }, OWL.reduce ? 0 : 160);
    card.querySelector('.lbl').textContent = '0' + (i + 1) + ' / 05'; card.querySelector('h2').textContent = s.n; card.querySelector('p').textContent = s.d;
    card.querySelector('ul').innerHTML = s.inc.map(function(x){ return '<li>' + tick + '<span>' + x + '</span></li>'; }).join(''); }
  pick(0);
});
</script>
</section>
