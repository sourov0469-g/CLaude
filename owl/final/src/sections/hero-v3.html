<section class="sec hero3" aria-labelledby="h3-a">
<style>
/* V3 · Every Layer — a roof built in its true order; the cursor's wake washes the shingles away to the membranes,

   ⟦S0362⟧⟦S0361⟧ drawing-sheet language · ⟦S0451⟧ title · ⟦S1323⟧ legible before touch */
section.hero3{padding-top:clamp(14px,2vw,30px);padding-bottom:clamp(40px,5vw,72px);overflow:hidden}
.hero3 .grid-bg{position:absolute;inset:-40px;background-image:linear-gradient(rgba(23,17,29,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(23,17,29,.07) 1px,transparent 1px);background-size:48px 48px;transform:translate3d(var(--gx,0),var(--gy,0),0);pointer-events:none;-webkit-mask:radial-gradient(ellipse at 65% 50%,#000 30%,transparent 75%);mask:radial-gradient(ellipse at 65% 50%,#000 30%,transparent 75%)}

.hero3 .sheet-no{display:flex;gap:18px;font:600 13px Inter,sans-serif;letter-spacing:.06em;color:var(--ink-70)}
.hero3 .sheet-no b{color:var(--ink)}
.hero3 .h1{font-size:clamp(42px,5vw,76px);margin:14px 0 0}
.hero3 .lede{margin:18px 0 28px;max-width:36ch}
.hero3 .ctas{display:flex;flex-wrap:wrap;gap:16px 18px}
.hero3 .roof{position:relative;aspect-ratio:4/3;margin-right:calc(var(--pad) * -.6)}
.hero3 .roof canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}

.hero3 .dims path,.hero3 .dims line{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s cubic-bezier(.77,0,.175,1)}

.hero3.go .dims path,.hero3.go .dims line{stroke-dashoffset:0}
.hero3.go .dims text{opacity:1;transition-delay:1.1s}
.hero3 .tag{position:absolute;left:0;top:0;z-index:3;pointer-events:none;background:var(--ink);color:var(--cream);font:600 14px Inter,sans-serif;padding:6px 12px;border-radius:6px;white-space:nowrap;opacity:0;transform:translate(-50%,-140%);transition:opacity .2s}
.hero3 .tag.on{opacity:1}
.hero3 .key{all:unset}
.hero3 ol.layers{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(16px,2vw,26px);counter-reset:l}
.hero3 ol.layers button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 8px;border-radius:6px;border:1.5px solid rgba(23,17,29,.22);background:var(--paper);font:600 15px Inter,sans-serif;color:var(--ink);transition:border-color .15s,background .15s,transform .12s}
.hero3 ol.layers button:hover{border-color:var(--ink)}
.hero3 ol.layers button:active{transform:translateY(2px)}
.hero3 ol.layers button[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
