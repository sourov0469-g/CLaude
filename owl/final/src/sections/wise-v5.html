<section class="sec wise5" id="wise-check-5" aria-labelledby="w5-h">
<style>
.wise5 .hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 40px;margin-bottom:clamp(18px,2.6vw,30px)}
.wise5 .lede{margin-top:12px;max-width:44ch}
.wise5 .g{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(20px,3vw,48px);align-items:center}
.wise5 .mat{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 40px 70px -40px rgba(23,17,29,.55)}
.wise5 .mat svg{display:block;width:100%;height:auto}
.wise5 .tool{cursor:pointer;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s,filter .45s;filter:drop-shadow(0 3px 2px rgba(23,17,29,.25))}
.wise5 .tool.on{transform:translate(-6px,-12px);filter:drop-shadow(0 22px 14px rgba(23,17,29,.32))}
.wise5 .mat.has .tool:not(.on){opacity:.55}
.wise5 .ink{stroke-dasharray:1;stroke-dashoffset:0}
.wise5 .drawn .ink{animation:w5draw 1.6s cubic-bezier(.4,0,.2,1) both}
@keyframes w5draw{from{stroke-dashoffset:1}}
.wise5 .beam{opacity:0;transition:opacity .4s}
.wise5 .tool.on .beam{opacity:.5}
.wise5 .list{display:grid;gap:8px}
.wise5 .list button{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;text-align:left;transition:background .25s,box-shadow .25s}
.wise5 .list button i{grid-row:span 2;display:grid;place-items:center;width:36px;height:36px;border-radius:11px;font-style:normal;font-weight:800;background:var(--paper);box-shadow:0 3px 0 rgba(23,17,29,.1)}
.wise5 .list button b{font-size:17px}
.wise5 .list button span{font-size:14px;color:var(--ink-70)}
.wise5 .list button:hover{background:rgba(234,162,33,.1)}
.wise5 .list button[aria-selected="true"]{background:var(--paper);box-shadow:0 4px 0 rgba(23,17,29,.06),0 16px 26px -20px rgba(23,17,29,.5)}
.wise5 .list button[aria-selected="true"] i{background:var(--amber);box-shadow:0 3px 0 var(--amber-edge)}
.wise5 .say{margin-top:14px;min-height:72px;font-size:16px}
.wise5 .say b{display:block}
.wise5 .cta{margin-top:12px}
@media (max-width:900px){.wise5 .g{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.wise5 .tool{transition:none}.wise5 .drawn .ink{animation:none}}
</style>

   <div class="list" role="tablist" aria-label="The four parts of a Wise Check" aria-orientation="vertical"></div>
   <p class="say" id="w5-say" role="tabpanel" aria-live="polite"></p>

<script>
OWL.reg('wise','5',function(root){
  var W = OWL.WISE || {parts: []}, TOOLS = ['Ladder', 'Flashlight', 'Heat-sensor camera', 'Phone camera'];
  var mat = root.querySelector('.mat'), tools = [].slice.call(root.querySelectorAll('.tool')), list = root.querySelector('.list'), say = root.querySelector('.say'), h2 = root.querySelector('h2'), cur = -1;
  OWL.split(h2);
  var btns = W.parts.slice(0, 4).map(function(p, i){ var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'w5-t' + i; b.setAttribute('aria-controls', 'w5-say');
    b.innerHTML = '<i>' + (i + 1) + '</i><b>' + p.n + '</b><span>' + TOOLS[i] + '</span>';
    b.addEventListener('click', function(){ pick(i); });
    b.addEventListener('keydown', function(e){ var n = null; if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (cur + 1) % 4; else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (cur + 3) % 4; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = 3; if (n !== null){ e.preventDefault(); pick(n); btns[n].focus(); } });
    list.appendChild(b); return b; });
  function pick(i){ cur = i; mat.classList.add('has');
    tools.forEach(function(t, j){ t.classList.toggle('on', j === i); });
    btns.forEach(function(b, j){ b.setAttribute('aria-selected', j === i); b.tabIndex = j === i ? 0 : -1; });
    say.setAttribute('aria-labelledby', 'w5-t' + i); say.innerHTML = '<b>' + TOOLS[i] + ': ' + W.parts[i].n + '</b>' + W.parts[i].t; }
  tools.forEach(function(t){ var bb = t.getBBox(), r = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); r.setAttribute('x', bb.x - 8); r.setAttribute('y', bb.y - 8); r.setAttribute('width', bb.width + 16); r.setAttribute('height', bb.height + 16); r.setAttribute('fill', 'transparent'); t.insertBefore(r, t.firstChild); });
  tools.forEach(function(t, i){ t.addEventListener('pointerenter', function(){ pick(i); }); t.addEventListener('click', function(){ pick(i); }); });
  pick(0);
  if (OWL.reduce || !('IntersectionObserver' in window)) OWL.reveal(h2);
  else { var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); mat.classList.add('drawn'); } }, {threshold:.3}); io.observe(mat); }
});
</script>
