<style>
.fam6{overflow:hidden}
.fam6 .g{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.75fr);gap:clamp(20px,4vw,60px);align-items:center}
.fam6 .scene{position:relative;aspect-ratio:1000/640;border-radius:26px;overflow:hidden;box-shadow:0 44px 70px -46px rgba(23,17,29,.6)}
.fam6 .scene svg{position:absolute;inset:0;width:100%;height:100%}
.fam6 .ph{position:absolute;overflow:hidden;background:#E9E3D5}
.fam6 .ph img{width:100%;height:100%;object-fit:cover;display:block}
.fam6 .ph.a{left:10.4%;top:21.5%;width:21.2%;height:24.5%}
.fam6 .ph.b{left:35.4%;top:24.6%;width:19.2%;height:21.4%}
.fam6 .dusk{position:absolute;inset:0;background:linear-gradient(180deg,rgba(58,48,72,.34),rgba(42,33,49,.22));transition:opacity 1.2s;pointer-events:none}
.fam6 .glow{position:absolute;left:58.5%;top:41%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.55),rgba(255,214,140,.18) 45%,transparent 70%);opacity:0;transition:opacity 1.2s;pointer-events:none;mix-blend-mode:screen}
.fam6 .lit .dusk{opacity:0}
.fam6 .lit .glow{opacity:1}
.fam6 .bulb{transition:fill .6s}
.fam6 .lit .bulb{fill:#FFE29A}
.fam6 .fly{position:absolute;width:6px;height:6px;border-radius:50%;background:#FFE29A;box-shadow:0 0 10px 3px rgba(255,214,140,.8);opacity:0;pointer-events:none}
.fam6 .lit .fly{animation:fm6f 7s ease-in-out infinite}
@keyframes fm6f{0%,100%{opacity:0;transform:translate(0,0)}20%{opacity:1}50%{opacity:.8;transform:translate(30px,-26px)}80%{opacity:1;transform:translate(-14px,-44px)}}
.fam6 .tag{position:absolute;padding:4px 10px;border-radius:999px;background:rgba(251,250,246,.94);font-weight:800;font-size:13px;pointer-events:none}
.fam6 .lede{margin:12px 0 18px;max-width:36ch}
.fam6 .who{display:grid;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.fam6 .who li{display:flex;gap:10px;align-items:baseline;font-size:16px}
.fam6 .who b{min-width:8ch}
.fam6 .act{display:flex;flex-wrap:wrap;gap:12px}
.fam6 .sw{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 20px 0 12px;border-radius:999px;font-weight:800;background:linear-gradient(180deg,#FFFFFF,#F2EDE2);box-shadow:0 5px 0 #C9C0AC,0 12px 18px -12px rgba(23,17,29,.45);transition:transform .12s,box-shadow .12s}
.fam6 .sw:active{transform:translateY(4px);box-shadow:0 1px 0 #C9C0AC}
.fam6 .sw i{position:relative;width:46px;height:26px;border-radius:13px;background:#C9C0AC;transition:background .3s}
.fam6 .sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.fam6 .sw[aria-pressed="true"] i{background:#EAA221}
.fam6 .sw[aria-pressed="true"] i::after{transform:translateX(20px)}
.fam6 .sw:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:900px){.fam6 .g{grid-template-columns:minmax(0,1fr)}.fam6 .tag{font-size:11px;padding:3px 7px}}
@media (prefers-reduced-motion:reduce){.fam6 .dusk,.fam6 .glow,.fam6 .bulb{transition:none}.fam6 .lit .fly{animation:none;opacity:.8}}
</style>

<script>
OWL.reg('family','6',function(root){
  var scene = root.querySelector('.scene'), sw = root.querySelector('.sw'), imgs = root.querySelectorAll('.ph img'), h2 = root.querySelector('h2');
  OWL.split(h2);
  imgs[0].src = '{{A:browns.webp}}'; imgs[1].src = '{{A:berglands.webp}}';
  function set(on){ scene.classList.toggle('lit', on); sw.setAttribute('aria-pressed', on); }
  sw.addEventListener('click', function(){ set(sw.getAttribute('aria-pressed') !== 'true'); });
  if (OWL.reduce || !('IntersectionObserver' in window)){ set(true); OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); setTimeout(function(){ set(true); }, 600); } }, {threshold:.4}); io.observe(scene);
});
</script>
