<section class="sec explore3" aria-labelledby="ex3-h">
<style>
/* Explore V3 · Stack It Right — the site's one game section (Bruno Simon, scoped): put the roof layers on in the
   order a roofer would. Drag a tile onto the roof, or press it to place it next. Wrong order: the tile springs back
   and the hint says why. ⟦S1018⟧ keyboard path + live announcements · ⟦S1443⟧ 8 px drag threshold, non-gesture
   alternative · ⟦S0340⟧⟦S0197⟧ physical drag, tilt from speed, spring return · ⟦S0544⟧ causal motion: drop → squash
   → settle · ⟦S0145⟧ exhibit-style play · ⟦S0414⟧ true order · ⟦S1190⟧ no flashing, one-shot finish */
.explore3 .g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:start}
.explore3 .lede{margin:14px 0 22px;max-width:38ch}
.explore3 .score{display:flex;gap:10px;flex-wrap:wrap}
.explore3 .score span{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--paper);font-weight:700;font-size:15px;box-shadow:0 1px 0 #fff inset,0 8px 16px -12px rgba(23,17,29,.4);font-variant-numeric:tabular-nums}
.explore3 .hint{margin-top:16px;min-height:78px;padding:14px 16px;border-radius:14px;background:rgba(234,162,33,.12);font-size:16px;line-height:1.45}
.explore3 .hint.bad{background:rgba(23,17,29,.06)}
.explore3 .tray{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
.explore3 .tile{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:0 16px;border-radius:14px;text-align:left;font-weight:700;font-size:16px;color:var(--ink);background:linear-gradient(180deg,#FFFEFA,#F0EADC);box-shadow:0 6px 0 #CFC3A6,0 7px 0 #B9AC8C,0 14px 18px -8px rgba(23,17,29,.4),inset 0 1px 0 #fff;cursor:grab;touch-action:none;transition:transform .12s,box-shadow .12s,opacity .3s}
.explore3 .tile:active{transform:translateY(4px);box-shadow:0 2px 0 #CFC3A6,0 3px 0 #B9AC8C,0 5px 8px -4px rgba(23,17,29,.4)}
.explore3 .tile i{width:30px;height:22px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.explore3 .tile.done{opacity:0;pointer-events:none}
.explore3 .tile.nope{animation:ex3nope .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes ex3nope{20%{translate:-7px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:2px 0}}
.explore3 .ghost{position:fixed;z-index:200;pointer-events:none;margin:0;transform-origin:50% 50%;box-shadow:0 26px 40px -16px rgba(23,17,29,.55)}
.explore3 .site{position:sticky;top:96px;border-radius:24px;background:#FBF9F3;box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(23,17,29,.06),0 30px 60px -40px rgba(23,17,29,.45);overflow:hidden}
.explore3 .site svg{display:block;width:100%;height:auto}
.explore3 .zone{fill:rgba(234,162,33,.08);stroke:#C7871A;stroke-width:2;stroke-dasharray:8 7;transition:fill .2s;animation:ex3ants 1.4s linear infinite}
@keyframes ex3ants{to{stroke-dashoffset:-30}}
.explore3 .site.over .zone{fill:rgba(234,162,33,.28)}
.explore3 .zone-t{font:700 15px Inter,sans-serif;fill:#8E5A12;paint-order:stroke;stroke:#FBF9F3;stroke-width:5px;stroke-linejoin:round}
.explore3 .slab{transform-box:fill-box;transform-origin:50% 100%;animation:ex3land .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes ex3land{0%{transform:translateY(-60px);opacity:0}55%{transform:translateY(0) scaleY(.78)}100%{transform:none}}
.explore3 .chip{position:absolute;width:10px;height:6px;border-radius:1px;pointer-events:none}
.explore3 .won{display:none;margin-top:16px;gap:14px;flex-wrap:wrap;align-items:center}
.explore3 .won.on{display:flex}
@media (max-width:900px){.explore3 .g{grid-template-columns:1fr}.explore3 .site{order:-1;top:72px;z-index:2}}
@media (max-width:480px){.explore3 .tray{grid-template-columns:1fr}}
.explore3 .site::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(23,17,29,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(23,17,29,.045) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.explore3 .zone{animation:none}.explore3 .slab,.explore3 .tile.nope{animation:none}.explore3 .tile{transition:none}}
</style>
<div class="wrap">
 <div class="g">
  <div class="txt">
   <span class="kick">A roofer's game</span>
   <h2 class="h2" id="ex3-h" style="margin-top:12px">Can You Build It in the Right Order?</h2>
   <p class="lede">Put the roof on the way a roofer would, from the deck up. Drag a layer onto the roof, or press one to place it next.</p>
   <div class="score" aria-hidden="true"><span class="placed">0 of 7 placed</span><span class="tries">0 tries</span></div>
   <p class="hint" aria-live="polite">Start with the layer everything else is fastened to.</p>
   <div class="tray" role="group" aria-label="Roof layers to place"></div>
   <div class="won">
    <a class="btn-ink solid" href="#book" data-owl="hoot"><span class="wash" aria-hidden="true"></span><svg class="pen" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 40"><rect pathLength="1" x="1" y="1" width="98" height="38" rx="3" vector-effect="non-scaling-stroke"/></svg>Book a Wise Check</a>
    <button class="btn-ink again" type="button"><span class="wash" aria-hidden="true"></span><svg class="pen" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 40"><rect pathLength="1" x="1" y="1" width="98" height="38" rx="3" vector-effect="non-scaling-stroke"/></svg>Play again</button>
   </div>
  </div>
  <div class="site" data-owl="say:Drop it here">
   <svg viewBox="0 0 640 520" role="img" aria-label="The roof you are building. Layers placed so far appear here."><g class="base"></g><g class="stack"></g><g class="zg"><polygon class="zone"/><text class="zone-t" text-anchor="middle">Next layer goes here</text></g></svg>
  </div>
 </div>
</div>
<script>

      var a = k / 26 * 6.283, d = 120 + (k * 37) % 120; c.animate([{transform:'translate(0,0) rotate(0)', opacity:1}, {transform:'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d - 60) + 'px) rotate(' + (k * 47) + 'deg)', opacity:1, offset:.6}, {transform:'translate(' + Math.cos(a) * d * 1.1 + 'px,' + (Math.sin(a) * d + 80) + 'px) rotate(' + (k * 90) + 'deg)', opacity:0}], {duration: 1300, easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish = function(){ this.effect.target.remove(); }; }
  }
