<section class="sec wise6" id="wise-check-6" aria-labelledby="w6-h">
<style>
.wise6{overflow:hidden}
.wise6 .hd{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 40px;margin-bottom:clamp(18px,2.6vw,30px)}
.wise6 .lede{margin-top:12px;max-width:46ch}
.wise6 .nav{display:flex;gap:10px}
.wise6 .nav button{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#FFFFFF,#F2EDE2);box-shadow:0 5px 0 #C9C0AC,0 12px 18px -12px rgba(23,17,29,.45);transition:transform .12s,box-shadow .12s}
.wise6 .nav button:active{transform:translateY(4px);box-shadow:0 1px 0 #C9C0AC}
.wise6 .nav button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wise6 .nav svg{width:22px;height:22px}
.wise6 .table{position:relative;border-radius:28px;padding:clamp(22px,3vw,40px) 0;background:radial-gradient(120% 140% at 50% 0,#FFFFFF 0,#FBF8EF 55%,#F1EBDC 100%);box-shadow:0 0 0 1px rgba(23,17,29,.06) inset,0 0 60px rgba(255,248,225,.9) inset,0 40px 70px -46px rgba(23,17,29,.55);overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none}
.wise6 .table.drag{cursor:grabbing}
.wise6 .table::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,17,29,.04) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(rgba(23,17,29,.04) 1px,transparent 1px) 0 0/40px 40px;pointer-events:none}
.wise6 .table.on{animation:w6on 1.1s steps(1,end) both}
@keyframes w6on{0%{filter:brightness(.82)}12%{filter:brightness(1.03)}20%{filter:brightness(.86)}34%{filter:brightness(1)}}
.wise6 .film{position:relative;display:flex;gap:18px;width:max-content;padding:34px 30px;background:#2A2131;border-radius:6px;box-shadow:0 18px 30px -16px rgba(23,17,29,.6);will-change:transform;margin-left:clamp(16px,4vw,48px)}
.wise6 .film::before,.wise6 .film::after{content:"";position:absolute;left:10px;right:10px;height:12px;background:repeating-linear-gradient(90deg,transparent 0 9px,#FBF8EF 9px 21px,transparent 21px 30px);border-radius:3px;opacity:.9}
.wise6 .film::before{top:11px}.wise6 .film::after{bottom:11px}
.wise6 .fr{position:relative;flex:none;width:clamp(200px,20vw,252px);aspect-ratio:13/9;padding:0;border-radius:3px;background:#E9E3D5;overflow:visible;transition:transform .35s cubic-bezier(.3,1.4,.5,1),filter .3s}
.wise6 .fr svg.art{display:block;width:100%;height:100%;border-radius:3px}
.wise6 .fr .no{position:absolute;left:4px;bottom:-26px;white-space:pre;padding:0 3px;background:#2A2131;font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.1em;color:#EAA221}
.wise6 .fr .gp{position:absolute;inset:-14px -16px;width:calc(100% + 32px);height:calc(100% + 28px);pointer-events:none;overflow:visible}
.wise6 .fr .gp path{fill:none;stroke:#EAA221;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;visibility:hidden}
.wise6 .fr[aria-pressed="true"] .gp path{visibility:visible}
.wise6 .fr[aria-pressed="true"] .gp path{animation:w6gp .7s cubic-bezier(.5,0,.3,1) forwards}
@keyframes w6gp{to{stroke-dashoffset:0}}
.wise6 .fr:hover{transform:translateY(-4px)}
.wise6 .fr:focus-visible{outline:3px solid #F1EFE6;outline-offset:4px}
.wise6 .low{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:center;margin-top:clamp(22px,3vw,36px)}
.wise6 .loupe{position:relative;width:clamp(170px,18vw,230px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#E9E3D5;box-shadow:0 0 0 10px #17111D,0 0 0 13px #3A3540,0 30px 40px -18px rgba(23,17,29,.6)}
.wise6 .loupe svg{width:100%;height:100%;display:block}
.wise6 .loupe::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.45),transparent 40%);pointer-events:none}
.wise6 .cap .k{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8E5A12}
.wise6 .cap h3{font-size:clamp(26px,2.6vw,36px);font-weight:800;letter-spacing:-.02em;margin:6px 0 8px}
.wise6 .cap p{font-size:18px;color:var(--ink-70);max-width:46ch;margin:0}
.wise6 .cap ul{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.wise6 .cap li{padding:6px 12px;border-radius:999px;background:var(--paper);font-weight:700;font-size:14px;box-shadow:0 2px 0 rgba(23,17,29,.08)}
.wise6 .cap > *{transition:opacity .25s,transform .35s cubic-bezier(.22,.61,.36,1)}
.wise6 .cap.fade > *{opacity:0;transform:translateY(6px)}
.wise6 .foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-top:16px}
.wise6 .note{font-size:14px;color:var(--ink-70)}
@media (max-width:700px){.wise6 .low{grid-template-columns:1fr;justify-items:start}.wise6 .loupe{width:150px;margin-left:14px}}
@media (prefers-reduced-motion:reduce){.wise6 .table.on{animation:none}.wise6 .fr{transition:none}.wise6 .fr[aria-pressed="true"] .gp path{animation:none;stroke-dashoffset:0}.wise6 .cap > *{transition:none}}
</style>
<div class="wrap">
 <div class="hd"><div><span class="kick">The Wise Check</span><h2 class="h2" id="w6-h" style="margin-top:12px">Contact Sheet</h2>
  <p class="lede rv">Eight frames: the four parts of every Wise Check, and four good reasons to book one. Drag the strip or pick a frame.</p></div>
  <div class="nav"><button type="button" class="pv" aria-label="Previous frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#17111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="nx" aria-label="Next frame"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#17111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
 <div class="table" data-owl="say:Pick a frame"><div class="film" role="group" aria-label="Contact sheet, eight frames"></div></div>
 <div class="low">
  <div class="loupe" aria-hidden="true"></div>
  <div class="cap" aria-live="polite"><span class="k"></span><h3></h3><p></p><ul></ul></div>
 </div>
 <div class="foot"><a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book a Wise Check</a><span class="note">The frames are drawings, not job photos.</span></div>
</div>
<script>
OWL.reg('wise','6',function(root){
  var W = OWL.WISE, table = root.querySelector('.table'), film = root.querySelector('.film'), loupe = root.querySelector('.loupe'), cap = root.querySelector('.cap'), h2 = root.querySelector('h2');
  OWL.split(h2);
  function sh(x, y, w, n, c){ var s = ''; for (var i = 0; i < n; i++){ var o = (i % 2)*w/2; for (var k = -1; k*w < 300; k++) s += '<rect x="' + (x + k*w - o) + '" y="' + (y + i*14) + '" width="' + (w - 2) + '" height="14" fill="' + c[(i + k + 9) % c.length] + '"/>'; } return s; }
  var G = ['#5B5662', '#4E4956', '#615C68', '#55505D'];
  var ART = [
    /* roof evaluation: flashing at a chimney, a lifted tab, a magnifier */
    '<rect width="260" height="180" fill="#C9D5DA"/>' + sh(0, 70, 34, 8, G) + '<rect x="150" y="10" width="54" height="80" fill="#A4553D"/><path d="M150 22h54M150 40h54M150 58h54M176 10v12M164 22v18M190 40v18" stroke="#7E3E2C" stroke-width="2"/><path d="M146 70h62v10h-62z" fill="#9AA3A8"/><path d="M60 98l30-6 2 10-30 6z" fill="#6E6876"/><circle cx="80" cy="102" r="30" fill="none" stroke="#17111D" stroke-width="6"/><path d="M101 123l22 22" stroke="#17111D" stroke-width="9" stroke-linecap="round"/>',
    /* attic inspection: rafters, insulation, a flashlight cone */
    '<rect width="260" height="180" fill="#3A3036"/><path d="M130 6L-10 150M130 6L270 150" stroke="#D3AF7A" stroke-width="12"/><path d="M130 6L40 150M130 6L220 150M130 6L85 150M130 6L175 150" stroke="#B48E5A" stroke-width="7"/><path d="M0 150q20-14 40 0t40 0 40 0 40 0 40 0 40 0 40 0V180H0z" fill="#E7C98F"/><path d="M226 120L120 70 120 112z" fill="#FFF3C4" opacity=".55"/><rect x="214" y="112" width="34" height="14" rx="4" fill="#17111D" transform="rotate(-24 230 119)"/>',
    /* heat-sensor leak detection: false colour, a cooler damp patch reads blue */
    '<defs><radialGradient id="w6h" cx="58%" cy="46%" r="70%"><stop offset="0" stop-color="#2E6FD0"/><stop offset=".22" stop-color="#3FA7C9"/><stop offset=".42" stop-color="#E9D24A"/><stop offset=".7" stop-color="#E2832E"/><stop offset="1" stop-color="#B2382B"/></radialGradient></defs><rect width="260" height="180" fill="url(#w6h)"/><path d="M118 74h40M138 54v40" stroke="#fff" stroke-width="3"/><circle cx="138" cy="74" r="14" fill="none" stroke="#fff" stroke-width="3"/><rect x="10" y="10" width="64" height="18" rx="3" fill="#17111D" opacity=".7"/><rect x="16" y="16" width="52" height="6" fill="#E2832E"/>',
    /* photo and video documentation: a phone showing a roof shot with a play key */
    '<rect width="260" height="180" fill="#E9E3D5"/><rect x="70" y="10" width="120" height="164" rx="16" fill="#17111D"/><rect x="78" y="24" width="104" height="132" rx="6" fill="#C9D5DA"/><path d="M78 110L130 70 182 110V156H78z" fill="#4E4956"/>' + '<circle cx="130" cy="112" r="16" fill="#EAA221"/><path d="M125 104l14 8-14 8z" fill="#17111D"/><rect x="84" y="30" width="30" height="8" rx="4" fill="#fff" opacity=".7"/>',
    /* after a storm */
    '<rect width="260" height="180" fill="#B9C5CC"/><path d="M60 64a24 24 0 1 1 8-46A32 32 0 0 1 128 24a22 22 0 0 1 6 40z" fill="#7C8790"/><path d="M140 70a20 20 0 1 1 6-38 26 26 0 0 1 50 4 18 18 0 0 1 4 34z" fill="#8E99A1"/>' + sh(0, 110, 34, 5, G) + '<g fill="#F1EFE6"><circle cx="70" cy="92" r="4"/><circle cx="102" cy="84" r="4"/><circle cx="150" cy="96" r="4"/><circle cx="186" cy="86" r="4"/></g><g fill="#2A2131" opacity=".55"><circle cx="60" cy="128" r="4"/><circle cx="140" cy="146" r="4"/><circle cx="200" cy="124" r="4"/></g>',
    /* a leak or a stain: ceiling stain with an arrow to look above it */
    '<rect width="260" height="180" fill="#F6F3EC"/><rect y="0" width="260" height="34" fill="#E2DCCD"/><ellipse cx="120" cy="58" rx="56" ry="18" fill="#C9A57A" opacity=".55"/><ellipse cx="116" cy="56" rx="30" ry="9" fill="#A57A4E" opacity=".55"/><path d="M118 70q-6 14 0 22a6 6 0 0 0 8-6q0-6-8-16z" fill="#5BA3D9"/><path d="M200 120V44M188 58l12-14 12 14" fill="none" stroke="#EAA221" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>',
    /* an older roof: worn granules, a curled tab, tired flashing */
    '<rect width="260" height="180" fill="#C9D5DA"/>' + sh(0, 40, 34, 10, ['#7A7480', '#6E6876', '#827C88', '#746E7A']) + '<g fill="#3A3540" opacity=".6"><circle cx="40" cy="60" r="2"/><circle cx="52" cy="66" r="1.5"/><circle cx="160" cy="98" r="2"/><circle cx="170" cy="104" r="1.5"/><circle cx="96" cy="128" r="2"/></g><path d="M120 76l34-2 4 14q-18 8-38-2z" fill="#9A949F"/><path d="M0 160h260" stroke="#B07A4A" stroke-width="10"/>',
    /* just checking: a house on a clear day and a check mark */
    '<rect width="260" height="180" fill="#D7E6EE"/><circle cx="214" cy="40" r="20" fill="#F6C25F"/><rect y="150" width="260" height="30" fill="#8DB45F"/><rect x="70" y="92" width="120" height="60" fill="#E9E3D5"/><path d="M58 96L130 46 202 96z" fill="#4E4956"/><rect x="118" y="116" width="24" height="36" fill="#17111D"/><circle cx="62" cy="140" r="22" fill="#2E7D32"/><path d="M51 140l8 8 14-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'];
  var F = W.parts.map(function(p, i){ return {k:'Frame 0' + (i + 1) + ' · Part of every Wise Check', n:p.n, t:p.t, a:ART[i]}; })
    .concat(W.cases.map(function(c, i){ return {k:'Frame 0' + (i + 5) + ' · When to call', n:c.n, t:c.t, a:ART[i + 4], f:c.f.map(function(j){ return W.parts[j].n; })}; }));
  var cur = -1, btns = F.map(function(f, i){ var b = document.createElement('button'); b.type = 'button'; b.className = 'fr'; b.setAttribute('aria-pressed', 'false'); b.tabIndex = i ? -1 : 0;
    b.setAttribute('aria-label', 'Frame ' + (i + 1) + ': ' + f.n);
    b.innerHTML = '<svg class="art" viewBox="0 0 260 180" aria-hidden="true">' + f.a + '</svg><span class="no" aria-hidden="true">' + (i + 1) + '  ' + (i + 1) + 'A</span><svg class="gp" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M58 3C30 1 6 8 4 40c-2 34 18 56 50 56 30 0 44-20 42-50C94 14 72 3 44 6"/></svg>';
    b.addEventListener('click', function(e){ if (moved) { e.preventDefault(); return; } pick(i, true); });
    b.addEventListener('keydown', function(e){ var m = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? F.length - 1 : null; if (m === null || m < 0 || m >= F.length) return; e.preventDefault(); btns[i].tabIndex = -1; btns[m].tabIndex = 0; btns[m].focus(); pick(m, true); });
    film.appendChild(b); return b; });
  /* strip position, drag with inertia */
  var x = 0, tx = 0, vx = 0, raf = 0, moved = false;
  function minX(){ return Math.min(0, table.clientWidth - film.offsetWidth - 2*parseFloat(getComputedStyle(film).marginLeft)); }
  function clampX(v){ return Math.max(minX(), Math.min(0, v)); }
  function paint(){ film.style.transform = 'translateX(' + x.toFixed(1) + 'px)'; }
  function run(){ var d = tx - x; x += d*(OWL.reduce ? 1 : .14); paint(); if (Math.abs(d) > .4) raf = requestAnimationFrame(run); else { x = tx; paint(); raf = 0; } }
  function go(v){ tx = clampX(v); if (!raf) raf = requestAnimationFrame(run); }
  function centre(i){ var b = btns[i]; go(-(b.offsetLeft + b.offsetWidth/2 - table.clientWidth/2 + parseFloat(getComputedStyle(film).marginLeft))); }
  var down = null;
  table.addEventListener('pointerdown', function(e){ if (e.button) return; down = {x:e.clientX, s:x, t:performance.now(), lx:e.clientX}; moved = false; vx = 0; });
  addEventListener('pointermove', function(e){ if (!down) return; var dx = e.clientX - down.x; if (Math.abs(dx) > 6 && !moved){ moved = true; table.classList.add('drag'); } if (!moved) return;
    var now = performance.now(); vx = (e.clientX - down.lx)/Math.max(1, now - down.t)*16; down.t = now; down.lx = e.clientX; x = tx = clampX(down.s + dx); paint(); });
  addEventListener('pointerup', function(){ if (!down) return; down = null; table.classList.remove('drag'); if (moved){ go(x + vx*14); setTimeout(function(){ moved = false; }, 0); } });
  function pick(i, user){ if (i === cur) return; cur = i; var f = F[i];
    btns.forEach(function(b, j){ b.setAttribute('aria-pressed', j === i); });
    loupe.innerHTML = '<svg viewBox="50 30 160 120" preserveAspectRatio="xMidYMid slice">' + f.a.replace(/id="w6h"/, 'id="w6hl"').replace(/url\(#w6h\)/, 'url(#w6hl)') + '</svg>';
    function put(){ cap.querySelector('.k').textContent = f.k; cap.querySelector('h3').textContent = f.n; cap.querySelector('p').textContent = f.t;
      cap.querySelector('ul').innerHTML = f.f ? f.f.map(function(n){ return '<li>We look at: ' + n + '</li>'; }).join('') : ''; cap.classList.remove('fade'); }
    if (user && !OWL.reduce){ cap.classList.add('fade'); setTimeout(put, 180); } else put();
    centre(i); }
  root.querySelector('.pv').addEventListener('click', function(){ pick(Math.max(0, cur - 1), true); });
  root.querySelector('.nx').addEventListener('click', function(){ pick(Math.min(F.length - 1, cur + 1), true); });
  addEventListener('resize', function(){ if (cur >= 0) centre(cur); });
  pick(0, false); x = tx; paint();
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); return; }
  x = tx + 160; paint();
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); table.classList.add('on'); go(tx); } }, {threshold:.3}); io.observe(table);
});
</script>
