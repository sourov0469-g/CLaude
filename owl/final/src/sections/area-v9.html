<section class="sec area9" id="areas-9" aria-labelledby="ar9-h">
<style>
.area9{overflow:hidden}
.area9 .hd{text-align:center;margin-bottom:clamp(18px,3vw,34px)}
.area9 .lede{margin:12px auto 0;max-width:46ch}
.area9 .radio{position:relative;max-width:980px;margin:0 auto;filter:drop-shadow(0 40px 40px rgba(23,17,29,.3))}
.area9 svg{display:block;width:100%;height:auto;max-width:none;touch-action:pan-y}
.area9 .knob{position:absolute;left:79.2%;top:70%;width:15.2%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#4A4350,#17111D 70%);box-shadow:0 8px 0 #0B080E,0 18px 24px -10px rgba(0,0,0,.6);cursor:grab;touch-action:none}
.area9 .knob::before{content:"";position:absolute;inset:8%;border-radius:50%;background:repeating-conic-gradient(from 0deg,#2A2131 0 6deg,#3A3540 6deg 12deg)}
.area9 .knob i{position:absolute;left:50%;top:10%;width:8%;height:26%;margin-left:-4%;border-radius:4px;background:#EAA221;transform-origin:50% 154%;transform:rotate(var(--a,0deg))}
.area9 .knob:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
.area9 .knob.drag{cursor:grabbing}
.area9 .say{min-height:30px;margin:clamp(16px,2.6vw,26px) 0 0;text-align:center;font-weight:800;font-size:clamp(18px,2vw,22px)}
.area9 .ctl{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin-top:14px}
.area9 .ctl .nb{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#FFFFFF,#F2EDE2);box-shadow:0 5px 0 #C9C0AC,0 12px 18px -12px rgba(23,17,29,.45)}
.area9 .ctl .nb:active{transform:translateY(4px);box-shadow:0 1px 0 #C9C0AC}
.area9 .ctl .nb:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.area9 .ctl svg{width:22px;height:22px}
.area9 .find{display:flex;gap:10px}
.area9 .find input{width:min(60vw,240px);min-height:52px;padding:0 16px;border-radius:14px;border:2px solid rgba(23,17,29,.16);background:#fff;font:inherit;font-size:17px}
.area9 .find input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
<div class="wrap">
 <div class="hd"><span class="kick">Service area</span><h2 class="h2" id="ar9-h" style="margin-top:12px">Tune In</h2>
  <p class="lede rv">Twenty-nine stations, one for every town we roof in. Turn the knob and find yours.</p></div>
 <div class="radio" data-owl="say:Turn the knob">
  <svg viewBox="0 0 1000 420" aria-hidden="true"></svg>
  <div class="knob" tabindex="0" role="slider" aria-label="Tune to a town" aria-valuemin="0" aria-valuemax="28" aria-valuenow="0"><i></i></div>
 </div>
 <p class="say" aria-live="polite"></p>
 <div class="ctl"><button type="button" class="nb pv" aria-label="Previous town"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#17111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="nb nx" aria-label="Next town"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#17111D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <form class="find" role="search" novalidate><label for="ar9-q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Find your town</label><input id="ar9-q" placeholder="Find your town" autocomplete="off"><button class="btn btn-amber" type="submit" data-mag data-owl="hoot">Tune</button></form></div>
</div>
<script>
OWL.reg('area','9',function(root){
  var T = ['Shoreview','North Oaks','Arden Hills','Vadnais Heights','Little Canada','Roseville','Mounds View','New Brighton','Lino Lakes','Blaine','White Bear Lake','Maplewood','Fridley','Saint Paul','Minneapolis','Forest Lake','Coon Rapids','Oakdale','Stillwater','Woodbury','Maple Grove','Plymouth','Minnetonka','Edina','Eden Prairie','Bloomington','Eagan','Burnsville','Apple Valley'];
  var svg = root.querySelector('svg'), knob = root.querySelector('.knob'), say = root.querySelector('.say'), form = root.querySelector('.find'), q = root.querySelector('#ar9-q'), h2 = root.querySelector('h2');
  OWL.split(h2);
  var SP = 150, h = '<defs><clipPath id="ar9c"><rect x="110" y="64" width="780" height="120" rx="12"/></clipPath><linearGradient id="ar9g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6DD"/><stop offset="1" stop-color="#F3E3B8"/></linearGradient></defs>';
  h += '<rect x="20" y="20" width="960" height="380" rx="40" fill="#C9A06A"/><rect x="36" y="36" width="928" height="348" rx="28" fill="#F1EFE6"/><path d="M36 210H964" stroke="#C9C0AC" stroke-width="2"/>';
  h += '<rect x="100" y="54" width="800" height="140" rx="18" fill="#17111D"/><rect x="110" y="64" width="780" height="120" rx="12" fill="url(#ar9g)"/>';
  h += '<path d="M500 64v120" stroke="#B3261E" stroke-width="4"/>';
  h += '<g clip-path="url(#ar9c)"><g class="band">';
  T.forEach(function(t, i){ var x = 500 + i*SP; h += '<path d="M' + x + ' 72v26" stroke="#17111D" stroke-width="3"/>'; for (var m = 1; m < 5; m++) h += '<path d="M' + (x + m*SP/5) + ' 72v12" stroke="#17111D" stroke-width="1.5" opacity=".5"/>';
    h += '<text x="' + x + '" y="132" text-anchor="middle" font-size="' + (t.length > 12 ? 19 : 22) + '" font-weight="900" fill="#17111D" style="paint-order:stroke;stroke:#FFF6DD;stroke-width:6px">' + t + '</text><text x="' + x + '" y="162" text-anchor="middle" font-size="13" font-weight="800" fill="#8E5A12" letter-spacing="2" style="paint-order:stroke;stroke:#FFF6DD;stroke-width:5px">' + (i ? 'MN' : 'HOME') + '</text>'; });
  h += '</g><g class="static" opacity="0"></g></g>';
  h += '<circle cx="500" cy="60" r="6" fill="#B3261E"/><path d="M500 184v6" stroke="#B3261E" stroke-width="4"/>';
  h += '<g>'; for (var r = 0; r < 6; r++) for (var c = 0; c < 10; c++) h += '<circle cx="' + (90 + c*28) + '" cy="' + (248 + r*24) + '" r="7" fill="#17111D" opacity=".85"/>'; h += '</g>';
  h += '<g class="meter" transform="translate(440 262)"><text x="0" y="-12" font-size="13" font-weight="900" letter-spacing="2" fill="#5A5560">SIGNAL</text>'; for (var b = 0; b < 5; b++) h += '<rect class="bar" x="' + (b*22) + '" y="' + (80 - (b + 1)*14) + '" width="16" height="' + ((b + 1)*14) + '" rx="3" fill="#D8D2C6"/>'; h += '</g>';
  h += '<text x="600" y="372" font-size="14" font-weight="900" letter-spacing="3" fill="#8E5A12">OWL ROOFING</text>';
  svg.innerHTML = h;
  var band = svg.querySelector('.band'), stat = svg.querySelector('.static'), bars = [].slice.call(svg.querySelectorAll('.bar'));
  var t = 0, tgt = 0, raf = 0, last = 0, shown = -1, quiet = true;
  function paint(){ band.setAttribute('transform', 'translate(' + (-t*SP).toFixed(1) + ' 0)'); knob.style.setProperty('--a', (t*28).toFixed(1) + 'deg');
    knob.querySelector('i').style.transform = 'rotate(' + (t*28).toFixed(1) + 'deg)';
    var n = Math.round(t), off = Math.abs(t - n), lvl = Math.max(0, 5 - Math.round(off*12));
    bars.forEach(function(r, i){ r.setAttribute('fill', i < lvl ? (lvl === 5 ? '#2E7D32' : '#EAA221') : '#D8D2C6'); });
    if (off > .06 && !OWL.reduce){ var s = ''; for (var k = 0; k < 40; k++){ var x = 110 + Math.random()*780, y = 64 + Math.random()*120; s += '<path d="M' + x.toFixed(0) + ' ' + y.toFixed(0) + 'h' + (4 + Math.random()*14).toFixed(0) + '" stroke="#17111D" stroke-width="2"/>'; } stat.innerHTML = s; stat.setAttribute('opacity', Math.min(.6, off*1.6).toFixed(2)); } else stat.setAttribute('opacity', 0);
    knob.setAttribute('aria-valuenow', n); knob.setAttribute('aria-valuetext', T[n]);
    if (off < .06 && n !== shown){ shown = n; if (!quiet) say.textContent = n ? 'Yes, we roof in ' + T[n] + '.' : 'Shoreview is home: 1000 County Rd E #230.'; } else if (off >= .06) shown = -1; }
  function loop(ts){ var dt = last ? Math.min(50, ts - last)/16.7 : 1; last = ts; t += (tgt - t)*(1 - Math.pow(.84, dt)); if (Math.abs(tgt - t) < .002) t = tgt; paint(); if (t !== tgt) raf = requestAnimationFrame(loop); else { raf = 0; last = 0; } }
  function go(n){ quiet = false; tgt = Math.max(0, Math.min(28, n)); if (OWL.reduce){ t = tgt; paint(); return; } if (!raf) raf = requestAnimationFrame(loop); }
  /* drag the knob round, or drag the dial band sideways; let go and it settles on the nearest town */
  var drag = null;
  function center(){ var r = knob.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
  knob.addEventListener('pointerdown', function(e){ knob.setPointerCapture(e.pointerId); var c = center(); drag = {a: Math.atan2(e.clientY - c[1], e.clientX - c[0]), t: tgt}; knob.classList.add('drag'); });
  knob.addEventListener('pointermove', function(e){ if (!drag) return; var c = center(), a = Math.atan2(e.clientY - c[1], e.clientX - c[0]), d = a - drag.a; if (d > Math.PI) d -= 2*Math.PI; if (d < -Math.PI) d += 2*Math.PI; drag.a = a; drag.t = Math.max(0, Math.min(28, drag.t + d*180/Math.PI/28)); quiet = false; tgt = drag.t; t = drag.t; paint(); });
  function up(){ if (!drag) return; drag = null; knob.classList.remove('drag'); go(Math.round(tgt)); }
  knob.addEventListener('pointerup', up); knob.addEventListener('pointercancel', up);
  var bd = null;
  svg.addEventListener('pointerdown', function(e){ var r = svg.getBoundingClientRect(), y = (e.clientY - r.top)/r.height*420; if (y < 60 || y > 190) return; svg.setPointerCapture(e.pointerId); bd = {x: e.clientX, t: tgt, k: 1000/r.width}; });
  svg.addEventListener('pointermove', function(e){ if (!bd) return; quiet = false; tgt = t = Math.max(0, Math.min(28, bd.t - (e.clientX - bd.x)*bd.k/SP)); paint(); });
  svg.addEventListener('pointerup', function(){ if (!bd) return; bd = null; go(Math.round(tgt)); });
  knob.addEventListener('keydown', function(e){ var m = {ArrowRight:1, ArrowUp:1, ArrowLeft:-1, ArrowDown:-1}[e.key]; if (e.key === 'Home'){ e.preventDefault(); go(0); return; } if (e.key === 'End'){ e.preventDefault(); go(28); return; } if (!m) return; e.preventDefault(); go(Math.round(tgt) + m); });
  root.querySelector('.pv').addEventListener('click', function(){ go(Math.round(tgt) - 1); });
  root.querySelector('.nx').addEventListener('click', function(){ go(Math.round(tgt) + 1); });
  function norm(s){ return s.toLowerCase().replace(/^st\.?\s/, 'saint ').replace(/[^a-z]/g, ''); }
  form.addEventListener('submit', function(e){ e.preventDefault(); var v = norm(q.value); if (!v) return; var i = T.findIndex(function(x){ return norm(x) === v; }); if (i < 0) i = T.findIndex(function(x){ return norm(x).indexOf(v) === 0; });
    if (i >= 0){ go(i); return; } say.textContent = q.value.replace(/[<>&]/g, '') + ' is not on our list of 29 towns. Call (651) 977-6027 to ask.'; });
  paint(); quiet = false; say.textContent = 'Shoreview is home: 1000 County Rd E #230.'; shown = 0;
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); } }, {threshold:.3}); io.observe(svg);
});
</script>
