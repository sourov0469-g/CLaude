<section class="sec wrap5" id="protect-5" aria-labelledby="pn5-h">
<style>
.wrap5 .g{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(22px,4vw,64px);align-items:center}
.wrap5 .lede{margin:14px 0 22px;max-width:34ch}
.wrap5 .tabs{display:grid;gap:8px}
.wrap5 .tabs button{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;text-align:left;transition:background .25s,box-shadow .25s}
.wrap5 .tabs button i{grid-row:span 2;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px rgba(23,17,29,.1)}
.wrap5 .tabs button b{font-size:18px}
.wrap5 .tabs button span{font-size:15px;color:var(--ink-70)}
.wrap5 .tabs button:hover{background:rgba(234,162,33,.1)}
.wrap5 .tabs button[aria-selected="true"]{background:var(--paper);box-shadow:0 4px 0 rgba(23,17,29,.06),0 16px 26px -20px rgba(23,17,29,.5)}
.wrap5 .tabs button[aria-selected="true"] i{box-shadow:0 0 0 3px var(--amber)}
.wrap5 .say{min-height:56px;margin:16px 0 18px;font-size:17px}
.wrap5 .art{position:relative}
.wrap5 svg{display:block;width:100%;height:auto;overflow:visible}
.wrap5 .band{transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s;cursor:pointer}
.wrap5 .band path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.wrap5 .woven .band path{animation:pn5draw 1.1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes pn5draw{to{stroke-dashoffset:0}}
.wrap5 svg.has .band:not(.on){opacity:.42}
.wrap5 .band.on{transform:translateY(-8px)}
.wrap5 .owl{transform:translateY(-160px);opacity:0;transition:transform .9s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.wrap5 .woven .owl{transform:none;opacity:1;transition-delay:2.6s}
.wrap5 .lid{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:pn5blink 6s 4s infinite}
@keyframes pn5blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@media (max-width:900px){.wrap5 .g{grid-template-columns:1fr}.wrap5 .art{order:-1}}
@media (prefers-reduced-motion:reduce){.wrap5 .band path{stroke-dashoffset:0;animation:none!important}.wrap5 .owl{transform:none;opacity:1;transition:none}.wrap5 .lid{animation:none}.wrap5 .band{transition:none}}
</style>
<div class="wrap">
 <div class="g">
  <div>
   <span class="kick">Protect Your Nest System</span>
   <h2 class="h2" id="pn5-h" style="margin-top:12px">Weave the Nest</h2>
   <p class="lede rv">Three parts, woven together, around every roof replacement. Pick a band of the nest.</p>
   <div class="tabs" role="tablist" aria-label="The three parts" aria-orientation="vertical"></div>
   <p class="say" id="pn5-say" role="tabpanel" aria-live="polite"></p>
   <a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Get My Roof Checked</a>
  </div>
  <div class="art" data-owl="say:Hoo's home?">
   <svg viewBox="0 0 600 440" role="img" aria-label="A nest woven in three bands: an outer weave for the wrap, a middle weave for the three cleanup passes, and an amber lining for the aftercare box, with an owl settled on top">
    <ellipse cx="300" cy="372" rx="230" ry="26" fill="#17111D" opacity=".1"/>
    <g class="bands"></g>
    <g class="owl"><g transform="translate(300 300) scale(.9)">
     <path d="M-40 10 C-46 -46 -28 -82 0 -82 C28 -82 46 -46 40 10 Z" fill="#FBFAF6" stroke="#17111D" stroke-width="4"/>
     <path d="M-22 -24 Q0 -10 22 -24" fill="none" stroke="#EAA221" stroke-width="3.5"/>
     <path d="M-44 -78 L-32 -112 L-18 -90 Q0 -98 18 -90 L32 -112 L44 -78 Q44 -44 0 -42 Q-44 -44 -44 -78Z" fill="#FBFAF6" stroke="#17111D" stroke-width="4" stroke-linejoin="round"/>
     <circle cx="-17" cy="-72" r="12" fill="#EAA221" stroke="#17111D" stroke-width="3"/><circle cx="17" cy="-72" r="12" fill="#EAA221" stroke="#17111D" stroke-width="3"/>
     <circle cx="-17" cy="-72" r="5" fill="#17111D"/><circle cx="17" cy="-72" r="5" fill="#17111D"/>
     <ellipse class="lid" cx="-17" cy="-72" rx="12.5" ry="12.5" fill="#FBFAF6" stroke="#17111D" stroke-width="2.5"/><ellipse class="lid" cx="17" cy="-72" rx="12.5" ry="12.5" fill="#FBFAF6" stroke="#17111D" stroke-width="2.5"/>
     <path d="M-6 -60 L0 -50 L6 -60Z" fill="#17111D"/>
    </g></g>
    <g class="fronts"></g>
   </svg>
  </div>
 </div>
</div>
<script>
OWL.reg('wrap','5',function(root){
  var B = [
    {n:'The wrap', t:'Mesh from the eaves down over walls and shrubs, and a tarp over the lawn, before the old roof comes off.', rx:240, ry:96, cy:320, w:9, col:['#6E5332','#8A6A3E','#7A5A2A','#A9844F'], sw:'#7A5A2A'},
    {n:'Three cleanup passes', t:'The crew clears as they go, a magnet sweeps the lawn and drive for nails, then the project manager walks it.', rx:190, ry:74, cy:314, w:7, col:['#A9844F','#C49A62','#B88E57','#8A6A3E'], sw:'#B88E57'},
    {n:'The aftercare box', t:'Left with you when the crew goes.', rx:140, ry:52, cy:306, w:6, col:['#EAA221','#F6C25F','#D48F17','#F1BC55'], sw:'#EAA221'}];
  var svg = root.querySelector('svg'), bands = root.querySelector('.bands'), fronts = root.querySelector('.fronts'), tabs = root.querySelector('.tabs'), say = root.querySelector('.say'), art = root.querySelector('.art'), h2 = root.querySelector('h2'), cur = -1;
  OWL.split(h2);
  function rnd(seed){ return function(){ seed = (seed*16807) % 2147483647; return (seed - 1)/2147483646; }; }
  var R = rnd(2025), NS = 'http://www.w3.org/2000/svg', els = [];
  /* each band: strands that wrap round the bowl of the nest, front half drawn over the back */
  B.forEach(function(b, k){ var g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'band'); g.dataset.k = k; var h = '';
    for (var i = 0; i < 18; i++){ var a0 = R()*Math.PI*2, span = Math.PI*(.5 + R()*.9), rx = b.rx*(.9 + R()*.18), ry = b.ry*(.85 + R()*.3), cy = b.cy + (R() - .5)*18, pts = [];
      for (var s = 0; s <= 12; s++){ var a = a0 + span*s/12; pts.push([300 + Math.cos(a)*rx, cy + Math.sin(a)*ry*(Math.sin(a) > 0 ? 1 : .55)]); }
      var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1); for (var q = 1; q < pts.length - 1; q += 2) d += 'Q' + pts[q][0].toFixed(1) + ' ' + pts[q][1].toFixed(1) + ' ' + pts[q + 1][0].toFixed(1) + ' ' + pts[q + 1][1].toFixed(1);
      h += '<path pathLength="1" d="' + d + '" stroke="' + b.col[i % 4] + '" stroke-width="' + (b.w*(.6 + R()*.6)).toFixed(1) + '" style="animation-delay:' + (k*.55 + i*.04).toFixed(2) + 's"/>'; }
    g.innerHTML = h; g.addEventListener('click', function(){ pick(k); }); bands.appendChild(g); els.push(g);
    /* a few more strands across the front of the bowl, drawn over the owl so it sits in the nest */
    var f = document.createElementNS(NS, 'g'); f.setAttribute('class', 'band'); f.dataset.k = k; var fh = '';
    for (var m = 0; m < 9; m++){ var b0 = Math.PI*(.12 + R()*.2), sp = Math.PI*(.45 + R()*.2), frx = b.rx*(.92 + R()*.14), fry = b.ry*(.9 + R()*.2), fcy = b.cy + (R() - .5)*12, fp = [];
      for (var u = 0; u <= 8; u++){ var aa = b0 + sp*u/8; fp.push([300 + Math.cos(aa)*frx, fcy + Math.sin(aa)*fry]); }
      var fd = 'M' + fp[0][0].toFixed(1) + ' ' + fp[0][1].toFixed(1); for (var v = 1; v < fp.length - 1; v += 2) fd += 'Q' + fp[v][0].toFixed(1) + ' ' + fp[v][1].toFixed(1) + ' ' + fp[v + 1][0].toFixed(1) + ' ' + fp[v + 1][1].toFixed(1);
      fh += '<path pathLength="1" d="' + fd + '" stroke="' + b.col[m % 4] + '" stroke-width="' + (b.w*(.7 + R()*.6)).toFixed(1) + '" style="animation-delay:' + (k*.55 + .8 + m*.05).toFixed(2) + 's"/>'; }
    f.innerHTML = fh; f.addEventListener('click', function(){ pick(k); }); fronts.appendChild(f); els.push(f); });
  var btns = B.map(function(b, k){ var x = document.createElement('button'); x.type = 'button'; x.setAttribute('role', 'tab'); x.id = 'pn5-t' + k; x.setAttribute('aria-controls', 'pn5-say');
    x.innerHTML = '<i style="background:' + b.sw + '"></i><b>' + b.n + '</b><span>' + ['The outer weave', 'The middle weave', 'The lining'][k] + '</span>';
    x.addEventListener('click', function(){ pick(k); });
    x.addEventListener('keydown', function(e){ var n = null; if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = (cur + 1) % 3; else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = (cur + 2) % 3; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = 2; if (n !== null){ e.preventDefault(); pick(n); btns[n].focus(); } });
    tabs.appendChild(x); return x; });
  function pick(k){ cur = k; svg.classList.add('has'); els.forEach(function(g){ g.classList.toggle('on', +g.dataset.k === k); });
    btns.forEach(function(x, j){ x.setAttribute('aria-selected', j === k); x.tabIndex = j === k ? 0 : -1; }); say.setAttribute('aria-labelledby', 'pn5-t' + k); say.textContent = B[k].t; }
  pick(0);
  if (OWL.reduce || !('IntersectionObserver' in window)){ art.classList.add('woven'); OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); art.classList.add('woven'); } }, {threshold:.3}); io.observe(art);
});
</script>
</section>
