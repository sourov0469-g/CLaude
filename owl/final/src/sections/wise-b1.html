<section class="sec wise2" id="wise-check-2" aria-labelledby="w2-h">
<style>
.wise2{text-align:center}
.wise2 .lede{margin:14px auto 0;max-width:40ch}
.wise2 .eye{position:relative;width:min(100%,900px);aspect-ratio:900/520;margin:clamp(20px,3vw,36px) auto 0}
.wise2 .eye svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wise2 .iris{transition:transform .5s var(--ease)}
.wise2 .lid{transform-origin:450px 110px;transform:scaleY(0);transition:transform .14s}
.wise2 .eye.blink .lid{transform:scaleY(1)}
.wise2 .spin{transform-origin:450px 260px;transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.wise2 .chip{position:absolute;transform:translate(-50%,-50%);min-height:44px;padding:0 18px;border-radius:999px;background:var(--paper);border:2px solid rgba(234,162,33,.6);font-weight:600;font-size:16px;box-shadow:0 4px 0 rgba(23,17,29,.08),0 12px 22px -14px rgba(23,17,29,.45);transition:background .25s,transform .25s var(--ease)}
.wise2 .chip:hover{transform:translate(-50%,-50%) translateY(-2px)}
.wise2 .chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);box-shadow:0 5px 0 var(--amber-edge)}
.wise2 .read{min-height:60px;margin:22px auto 0;max-width:44ch;font-size:18px}
.wise2 .read b{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.wise2 .ctas{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:22px}
.wise2 .tel{font-weight:700;font-size:18px;text-underline-offset:5px}
@media (max-width:700px){.wise2 .chip{font-size:13px;min-height:36px;padding:0 12px}.wise2 .eye{width:calc(100% + 24px);margin-inline:-12px}}
</style>
<div class="wrap">
 <h2 class="h2 rv" id="w2-h">An Owl's Eye on Your Roof</h2>
 <p class="lede rv">Four things every Wise Check looks at. Choose one.</p>
 <div class="eye" data-owl="say:Hoo's watching?">
  <svg viewBox="0 0 900 520" aria-hidden="true">
   <defs>
    <linearGradient id="w2b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8D488"/><stop offset=".3" stop-color="#EAA221"/><stop offset=".55" stop-color="#B9791A"/><stop offset=".8" stop-color="#F1BC55"/><stop offset="1" stop-color="#C7871A"/></linearGradient>
    <linearGradient id="w2c" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7871A"/><stop offset=".5" stop-color="#F6CB76"/><stop offset="1" stop-color="#B9791A"/></linearGradient>
    <radialGradient id="w2p" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#3a2a40"/><stop offset=".7" stop-color="#17111D"/><stop offset="1" stop-color="#0d0910"/></radialGradient>
    <radialGradient id="w2glow" cx="50%" cy="55%" r="50%"><stop offset="0" stop-color="#EAA221" stop-opacity=".9"/><stop offset="1" stop-color="#EAA221" stop-opacity="0"/></radialGradient>
    <clipPath id="w2eyeclip"><path d="M60 260 Q450 -40 840 260 Q450 560 60 260Z"/></clipPath>
   </defs>
   <path d="M40 260 Q450 -70 860 260 Q450 590 40 260Z" fill="none" stroke="#17111D" stroke-opacity=".12"/>
   <path d="M60 260 Q450 -40 840 260 Q450 560 60 260Z" fill="#F8F6F0" stroke="url(#w2b)" stroke-width="16"/>
   <g clip-path="url(#w2eyeclip)">
    <g class="iris">
     <g class="spin"><circle cx="450" cy="260" r="205" fill="none" stroke="url(#w2c)" stroke-width="26"/><g class="tk"></g><circle cx="450" cy="45" r="9" fill="#17111D"/></g>
     <circle cx="450" cy="260" r="160" fill="url(#w2b)"/>
     <circle cx="450" cy="260" r="138" fill="url(#w2c)"/>
     <circle cx="450" cy="260" r="112" fill="url(#w2p)"/>
     <circle cx="450" cy="268" r="80" fill="url(#w2glow)" opacity=".55"/>
     <g class="ico" transform="translate(450 268)"></g>
     <ellipse cx="410" cy="205" rx="34" ry="20" fill="#fff" opacity=".22" transform="rotate(-25 410 205)"/>
    </g>
   </g>
   <path class="lid" d="M60 260 Q450 -40 840 260 Q450 560 60 260Z" fill="#E9DFC8" stroke="url(#w2b)" stroke-width="6"/>
  </svg>
 </div>
 <p class="read" aria-live="polite"><b>Shingles</b>Cracked, curled or missing tabs, and granules worn thin.</p>
 <div class="ctas"><a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book Your Wise Check</a><a class="tel" href="tel:+16519776027">(651) 977-6027</a></div>
</div>
<script>
OWL.reg('wise','2',function(root){
  var eye = root.querySelector('.eye'), svg = eye.querySelector('svg'), iris = svg.querySelector('.iris'), spin = svg.querySelector('.spin'), ico = svg.querySelector('.ico'), read = root.querySelector('.read');
  var parts = [
    {k:'Shingles', pos:[50,4], rot:0, t:'Cracked, curled or missing tabs, and granules worn thin.',
     i:'<g fill="#EAA221"><path d="M-46 -6h30v16h-30zM-14 -6h30v16h-30zM18 -6h30v16h-30z" opacity=".9"/><path d="M-62 12h30v16h-30zM-30 12h30v16h-30zM2 12h30v16h-30zM34 12h30v16h-30z" opacity=".7"/><path d="M-46 -24h30v16h-30zM-14 -24h30v16h-30zM18 -24h30v16h-30z"/></g>'},
    {k:'Flashing', pos:[93,50], rot:-90, t:'The metal seals around chimneys, walls and vents.',
     i:'<path d="M-14 -44h28v52h-28z" fill="#EAA221" opacity=".85"/><path d="M-60 34 L-14 6 L-14 -4 L-20 -4 L-20 2 L-60 26Z M60 34 L14 6 L14 -4 L20 -4 L20 2 L60 26Z" fill="#F1EFE6"/>'},
    {k:'Ventilation', pos:[50,96], rot:180, t:'Intake and exhaust that let the attic breathe.',
     i:'<path d="M-56 20 L0 -26 L56 20" fill="none" stroke="#EAA221" stroke-width="6"/><path d="M-22 -18 h44 l-8 -14 h-28z" fill="#F1EFE6"/><path d="M-18 2 q10 -12 0 -24 M0 6 q10 -12 0 -24 M18 2 q10 -12 0 -24" fill="none" stroke="#F1EFE6" stroke-width="3" stroke-linecap="round"/>'},
    {k:'Gutters', pos:[7,50], rot:90, t:'How water leaves the roof at the eaves.',
     i:'<path d="M-50 -10 h100 a50 30 0 0 1 -100 0z" fill="none" stroke="#EAA221" stroke-width="6"/><rect x="34" y="6" width="12" height="44" fill="#EAA221"/><g fill="#9fd0f0"><circle cx="-10" cy="4" r="4"/><circle cx="12" cy="8" r="3"/><circle cx="40" cy="58" r="4"/></g>'}
  ];
  var tk = ''; for (var i = 0; i < 72; i++){ var a = i*5*Math.PI/180, r1 = 196, r2 = i % 6 === 0 ? 214 : 208; tk += '<line x1="' + (450 + Math.cos(a)*r1).toFixed(1) + '" y1="' + (260 + Math.sin(a)*r1).toFixed(1) + '" x2="' + (450 + Math.cos(a)*r2).toFixed(1) + '" y2="' + (260 + Math.sin(a)*r2).toFixed(1) + '" stroke="#17111D" stroke-opacity=".45" stroke-width="1.4"/>'; }
  svg.querySelector('.tk').innerHTML = tk;
  var chips = parts.map(function(p, n){ var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = p.k; b.style.left = p.pos[0] + '%'; b.style.top = p.pos[1] + '%';
    b.setAttribute('aria-pressed', 'false'); b.dataset.owl = 'peek'; b.addEventListener('click', function(){ pick(n); }); eye.appendChild(b); return b; });
  function pick(n){ var p = parts[n]; spin.style.transform = 'rotate(' + p.rot + 'deg)'; ico.innerHTML = p.i;
    chips.forEach(function(c, j){ c.setAttribute('aria-pressed', j === n); }); read.innerHTML = '<b>' + p.k + '</b>' + p.t;
    var dx = (p.pos[0] - 50)*.5, dy = (p.pos[1] - 50)*.4; iris.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; }
  pick(0);
  if (OWL.fine && !OWL.reduce){
    var idle;
    addEventListener('pointermove', function(e){ var r = eye.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
      var cx = r.left + r.width/2, cy = r.top + r.height/2, dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy) || 1, m = Math.min(1, d/600);
      iris.style.transform = 'translate(' + (dx/d*70*m).toFixed(1) + 'px,' + (dy/d*40*m).toFixed(1) + 'px)'; }, {passive:true});
  }
  if (!OWL.reduce) setInterval(function(){ eye.classList.add('blink'); setTimeout(function(){ eye.classList.remove('blink'); }, 160); }, 5200);
});
</script>
</section>
