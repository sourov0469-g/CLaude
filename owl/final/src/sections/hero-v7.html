<script>
OWL.reg('hero','7',function(root){
  var sec = root.querySelector('section'), h1 = root.querySelector('h1'), line = root.querySelector('#h7-line'), head = root.querySelector('.owl .head'), pups = [].slice.call(root.querySelectorAll('.pup')), svg = root.querySelector('svg');
  OWL.split(h1, 60);
  if (OWL.reduce){ OWL.reveal(h1); return; }
  line.style.strokeDasharray = 1000; line.style.strokeDashoffset = 1000;
  requestAnimationFrame(function(){ line.style.transition = 'stroke-dashoffset 2.6s cubic-bezier(.4,0,.2,1) .2s'; line.style.strokeDashoffset = 0; OWL.reveal(h1); });
  /* the owl looks toward the pointer: a small head turn and pupils that follow */
  if (OWL.fine) sec.addEventListener('pointermove', function(e){
    var b = svg.getBoundingClientRect(), ox = b.left + (620/1440)*b.width, oy = b.top + ((268 - 210)/400)*b.height, dx = e.clientX - ox, dy = e.clientY - oy, d = Math.hypot(dx, dy) || 1;
    head.style.transform = 'rotate(' + Math.max(-14, Math.min(14, dx/40)).toFixed(1) + 'deg)';
    pups.forEach(function(p, i){ var cx = i ? 12 : -12; p.setAttribute('cx', (cx + dx/d*3.6).toFixed(2)); p.setAttribute('cy', (-54 + dy/d*3.6).toFixed(2)); });
  });
});
</script>
