<section class="sec pp2" id="cleanup-2" aria-labelledby="pp2-h">
<style>
.pp2 .g{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,5vw,64px);align-items:center}
.pp2 .lede{margin:14px 0 24px;max-width:36ch}
.pp2 .tabs{display:grid;gap:10px}
.pp2 .tab{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:12px 16px;border-radius:18px;background:var(--paper);text-align:left;box-shadow:0 4px 0 rgba(23,17,29,.07);transition:background .25s,transform .25s var(--ease)}
.pp2 .tab .n{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--cream)}
.pp2 .tab b{display:block;font-size:19px}
.pp2 .tab span{font-size:15px;color:var(--ink-70)}
.pp2 .tab[aria-selected="true"]{background:var(--amber);box-shadow:0 5px 0 var(--amber-edge)}
.pp2 .tab[aria-selected="true"] .n{background:var(--ink);color:var(--cream)}
.pp2 .tab[aria-selected="true"] span{color:var(--ink)}
.pp2 .scene{position:relative;aspect-ratio:5/4;border-radius:28px;background:var(--paper);overflow:hidden;box-shadow:0 2px 0 #fff inset,0 36px 60px -36px rgba(23,17,29,.55)}
.pp2 .scene svg{position:absolute;inset:0;width:100%;height:100%}
.pp2 .act{opacity:0;transition:opacity .4s}
.pp2 .act.on{opacity:1}
.pp2 .broom{transform-origin:300px 120px;animation:pp2sweep 1.4s ease-in-out infinite alternate}
@keyframes pp2sweep{from{transform:rotate(-14deg) translateX(-40px)}to{transform:rotate(10deg) translateX(40px)}}
.pp2 .dust circle{animation:pp2dust 1.4s ease-out infinite}
@keyframes pp2dust{from{opacity:.8;transform:translate(0,0)}to{opacity:0;transform:translate(40px,-30px)}}
.pp2 .mag{animation:pp2roll 3s ease-in-out infinite alternate}
@keyframes pp2roll{from{transform:translateX(-150px)}to{transform:translateX(150px)}}
.pp2 .jump{animation:pp2jump 1.5s ease-in infinite}
@keyframes pp2jump{0%,40%{transform:translate(0,0)}100%{transform:translate(0,-70px);opacity:0}}
.pp2 .tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:pp2tick 2.4s ease-out infinite}
.pp2 .tick:nth-child(2) path{animation-delay:.5s}.pp2 .tick:nth-child(3) path{animation-delay:1s}.pp2 .tick:nth-child(4) path{animation-delay:1.5s}
@keyframes pp2tick{0%,10%{stroke-dashoffset:40}35%,100%{stroke-dashoffset:0}}
@media (max-width:900px){.pp2 .g{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.pp2 .broom,.pp2 .mag,.pp2 .jump,.pp2 .dust circle,.pp2 .tick path{animation:none;stroke-dashoffset:0}}
</style>

<script>
OWL.reg('pnpasses','2',function(root){
  var P = [['The crew','The crew clears the yard as they go.'],['The magnet sweep','A rolling magnet goes over the lawn and drive for nails.'],['The project manager','A final walk-through before we call it done.']];
  var box = root.querySelector('.tabs'), acts = root.querySelectorAll('.act'), tabs = [], timer;
  P.forEach(function(p, i){ var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.dataset.owl = 'peek';
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span><b>' + p[0] + '</b><span>' + p[1] + '</span></span>'; b.addEventListener('click', function(){ pick(i, false, true); });
    b.addEventListener('keydown', function(e){ var d = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowUp' || e.key === 'ArrowLeft') ? -1 : 0; if (d){ e.preventDefault(); pick((i + d + 3) % 3, true, true); } });
    box.appendChild(b); tabs.push(b); });
  function pick(i, focus, user){ tabs.forEach(function(t, j){ t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; if (j === i && focus) t.focus(); });
    acts.forEach(function(a){ a.classList.toggle('on', +a.dataset.i === i); }); if (user) clearInterval(timer); }
  pick(0); var k = 0; if (!OWL.reduce) timer = setInterval(function(){ k = (k + 1) % 3; pick(k); }, 3800);
});
</script>
