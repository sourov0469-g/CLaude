<section class="sec area2" id="areas-2" aria-labelledby="ar2-h">
<style>
.area2 .g{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:clamp(24px,4vw,64px);align-items:center}
.area2 .lede{margin:14px 0 22px;max-width:34ch}
.area2 .find{display:grid;gap:8px;max-width:380px}
.area2 .find label{font-weight:700}
.area2 .find input{min-height:54px;padding:0 18px;border-radius:14px;border:2px solid rgba(23,17,29,.14);background:#fff;font:inherit;font-size:18px;box-shadow:inset 0 2px 4px rgba(23,17,29,.06)}
.area2 .find input:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-color:var(--amber)}
.area2 .read{min-height:86px;margin:18px 0;padding:16px 18px;border-radius:16px;background:#17111D;color:#F1EFE6;font-size:17px;line-height:1.4;box-shadow:inset 0 2px 10px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.7)}
.area2 .read b{color:#F6C25F}
.area2 .read .cur{display:inline-block;width:9px;height:18px;margin-left:3px;vertical-align:-3px;background:#F6C25F;animation:ar2blink 1s steps(1) infinite}
@keyframes ar2blink{50%{opacity:0}}
.area2 .deck{position:relative;padding:clamp(16px,2.4vw,28px);border-radius:28px;background:linear-gradient(180deg,#E9E3D3,#DCD4C0);box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(23,17,29,.12),0 40px 70px -40px rgba(23,17,29,.6)}
.area2 .deck::before,.area2 .deck::after{content:"";position:absolute;top:12px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9C9585);box-shadow:inset 0 0 0 1px rgba(23,17,29,.25)}
.area2 .deck::before{left:12px}.area2 .deck::after{right:12px}
.area2 .keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.area2 .k{position:relative;min-height:62px;padding:8px 8px 12px;border-radius:13px;font-weight:700;font-size:clamp(12px,1vw,14px);line-height:1.15;text-align:center;color:var(--ink);background:linear-gradient(180deg,#FFFFFF,#F2EDE2);box-shadow:0 5px 0 #C9C0AC,0 8px 14px -6px rgba(23,17,29,.4),inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s,opacity .25s,background .25s}
.area2 .k i{position:absolute;right:8px;top:7px;width:6px;height:6px;border-radius:50%;background:#CFC6B2;transition:background .3s,box-shadow .3s}
.area2 .k.glow i{background:#F6C25F;box-shadow:0 0 6px 2px rgba(234,162,33,.6)}
.area2 .k:hover{transform:translateY(-1px)}
.area2 .k:active,.area2 .k[aria-pressed="true"]{transform:translateY(4px);box-shadow:0 1px 0 #C9C0AC,0 3px 6px -4px rgba(23,17,29,.4),inset 0 1px 0 #fff}
.area2 .k[aria-pressed="true"]{background:linear-gradient(180deg,#F6C25F,#EAA221)}
.area2 .k[aria-pressed="true"] i{background:#17111D;box-shadow:none}
.area2 .k.hq{background:linear-gradient(180deg,#2A2131,#17111D);color:#F1EFE6;box-shadow:0 5px 0 #000,0 8px 14px -6px rgba(23,17,29,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.area2 .k.hq small{display:block;font-size:10px;letter-spacing:.14em;color:#F6C25F}
.area2 .k.dim{background:#E4DDCD;color:#5E5966;box-shadow:0 2px 0 #C9C0AC,inset 0 1px 0 rgba(255,255,255,.5)}.area2 .k.hq.dim{background:#5E5966;color:#F1EFE6}
.area2 .k:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.area2 .foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B6570}
@media (max-width:900px){.area2 .g{grid-template-columns:1fr}.area2 .keys{grid-template-columns:repeat(3,minmax(0,1fr))}.area2 .k{min-height:56px}}
@media (prefers-reduced-motion:reduce){.area2 .read .cur{animation:none}.area2 .k{transition:none}}
</style>
<div class="wrap">
 <div class="g">
  <div>
   <span class="kick">Service area</span>
   <h2 class="h2" id="ar2-h" style="margin-top:12px">Press Your Town</h2>
   <p class="lede rv">29 towns from our home in Shoreview. Find yours on the keys, or type it.</p>
   <div class="find"><label for="ar2-q">Your town</label><input id="ar2-q" autocomplete="off" placeholder="Start typing" aria-describedby="ar2-read"></div>
   <p class="read" id="ar2-read" aria-live="polite">Shoreview is home. <b>28 more towns</b> are on the deck.<span class="cur" aria-hidden="true"></span></p>
   <a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book a Wise Check</a>
  </div>
  <div class="deck" data-owl="say:Press a key">
   <div class="keys" role="group" aria-label="The 29 towns Owl Roofing serves"></div>
   <div class="foot" aria-hidden="true"><span>Owl Roofing · service deck</span><span>29 keys</span></div>
  </div>
 </div>
</div>
<script>
OWL.reg('area','2',function(root){
  var T = ['Shoreview','North Oaks','Arden Hills','Vadnais Heights','Little Canada','Roseville','Mounds View','New Brighton','Lino Lakes','Blaine','White Bear Lake','Maplewood','Fridley','Saint Paul','Minneapolis','Forest Lake','Coon Rapids','Oakdale','Stillwater','Woodbury','Maple Grove','Plymouth','Minnetonka','Edina','Eden Prairie','Bloomington','Eagan','Burnsville','Apple Valley'];
  var box = root.querySelector('.keys'), q = root.querySelector('#ar2-q'), read = root.querySelector('.read'), h2 = root.querySelector('h2'), cur = 0;
  OWL.split(h2);
  var keys = T.map(function(t, i){ var b = document.createElement('button'); b.type = 'button'; b.className = 'k' + (i === 0 ? ' hq' : ''); b.setAttribute('aria-pressed', 'false'); b.tabIndex = i === 0 ? 0 : -1;
    b.innerHTML = (i === 0 ? '<small>Home</small>' : '') + t + '<i aria-hidden="true"></i>'; b.dataset.t = t;
    b.addEventListener('click', function(){ pick(i); });
    b.addEventListener('keydown', function(e){ var c = getComputedStyle(box).gridTemplateColumns.split(' ').length, n = null;
      if (e.key === 'ArrowRight') n = i + 1; else if (e.key === 'ArrowLeft') n = i - 1; else if (e.key === 'ArrowDown') n = i + c; else if (e.key === 'ArrowUp') n = i - c; else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = T.length - 1;
      if (n !== null && n >= 0 && n < T.length){ e.preventDefault(); focusKey(n); } });
    box.appendChild(b); return b; });
  function focusKey(n){ keys[cur].tabIndex = -1; cur = n; keys[n].tabIndex = 0; keys[n].focus(); }
  function say(html){ read.innerHTML = html + '<span class="cur" aria-hidden="true"></span>'; }
  function pick(i){ keys.forEach(function(k, j){ k.setAttribute('aria-pressed', j === i); }); keys[cur].tabIndex = -1; cur = i; keys[i].tabIndex = 0;
    say(i === 0 ? '<b>Shoreview</b> is home: 1000 County Rd E #230.' : 'Yes, we roof in <b>' + T[i] + '</b>. One of our 29 towns.'); }
  function norm(s){ return s.toLowerCase().replace(/^st\.?\s/, 'saint ').replace(/[^a-z ]/g, '').trim(); }
  q.addEventListener('input', function(){ var v = norm(q.value), hits = [];
    keys.forEach(function(k, j){ var m = !v || norm(T[j]).indexOf(v) === 0 || norm(T[j]).indexOf(' ' + v) > -1; k.classList.toggle('dim', !m); if (v && m) hits.push(j); });
    if (!v){ keys.forEach(function(k){ k.setAttribute('aria-pressed', 'false'); }); say('Shoreview is home. <b>28 more towns</b> are on the deck.'); }
    else if (hits.length === 1) pick(hits[0]);
    else if (hits.length > 1) say(hits.length + ' towns match: <b>' + hits.map(function(j){ return T[j]; }).join(', ') + '</b>.');
    else say('<b>' + q.value.replace(/[<>&]/g, '') + '</b> is not on our list of 29 towns. Call (651) 977-6027 to ask.'); });
  q.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ var f = keys.filter(function(k){ return !k.classList.contains('dim'); })[0]; if (f && q.value){ e.preventDefault(); pick(keys.indexOf(f)); } } });
  /* the deck idles: a slow LED wave across the keys */
  if (!OWL.reduce){ var w = 0, vis = false; if ('IntersectionObserver' in window) new IntersectionObserver(function(e){ vis = e[0].isIntersecting; if (vis) OWL.reveal(h2); }).observe(box); else vis = true;
    setInterval(function(){ if (!vis) return; keys.forEach(function(k, j){ k.classList.toggle('glow', Math.abs(((j - w) % T.length + T.length) % T.length) < 3); }); w = (w + 1) % T.length; }, 220);
  } else OWL.reveal(h2);
});
</script>
</section>
