<section class="sec wise8" id="wise-check-8" aria-labelledby="w8-h">
<style>
.wise8{overflow:hidden}
.wise8 .g{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(20px,4vw,60px);align-items:center}
.wise8 .lede{margin:12px 0 18px;max-width:34ch}
.wise8 .folder{position:relative;padding-top:56px}
.wise8 .back{position:absolute;left:0;right:0;top:40px;bottom:0;border-radius:6px 16px 16px 16px;background:linear-gradient(180deg,#E2C48D,#D4B077);box-shadow:0 40px 60px -40px rgba(23,17,29,.55)}
.wise8 .tabs{position:absolute;left:14px;right:14px;top:0;display:flex;gap:6px;z-index:5}
.wise8 .tab{flex:1;min-width:0;min-height:56px;padding:8px 10px 18px;border-radius:12px 12px 0 0;background:#E8CF9E;color:#5E3A08;font-weight:800;font-size:14px;line-height:1.15;text-align:left;box-shadow:inset 0 -6px 8px -6px rgba(0,0,0,.2);transition:transform .25s,background .25s}
.wise8 .tab:hover{transform:translateY(-3px)}
.wise8 .tab[aria-selected="true"]{background:#FBFAF6;color:#17111D;transform:translateY(-6px);box-shadow:0 -4px 10px -6px rgba(23,17,29,.3)}
.wise8 .tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wise8 .stack{position:relative;min-height:400px;margin:0 14px}
.wise8 .sheet{position:absolute;inset:0;padding:clamp(22px,3vw,34px);border-radius:4px;background:#FBFAF6;box-shadow:0 2px 0 #fff inset,0 10px 24px -14px rgba(23,17,29,.5);transform:translate(var(--sx,0),var(--sy,0)) rotate(var(--sr,0deg));transition:transform .55s cubic-bezier(.3,1.3,.5,1),opacity .4s;opacity:var(--so,1)}
.wise8 .sheet.front{z-index:4}
.wise8 .sheet .k{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8E5A12}
.wise8 .sheet h3{margin:6px 0 12px;font-size:clamp(24px,2.6vw,34px);font-weight:900;letter-spacing:-.02em}
.wise8 .sheet p{margin:0 0 10px;font-size:18px;color:var(--ink-70);max-width:52ch}
.wise8 .sheet ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.wise8 .sheet li{position:relative;padding-left:30px;font-size:17px}
.wise8 .sheet li b{display:block}
.wise8 .sheet li span{color:var(--ink-70);font-size:15px}
.wise8 .sheet li::before{content:"";position:absolute;left:0;top:5px;width:16px;height:10px;border-left:3px solid var(--amber);border-bottom:3px solid var(--amber);transform:rotate(-45deg)}
.wise8 .sheet a{color:var(--ink);font-weight:800}
.wise8 .clip{position:absolute;right:-8px;top:110px;transform:rotate(90deg);width:28px;height:70px;border:5px solid #9AA3A8;border-radius:16px;border-bottom-color:transparent;z-index:6;pointer-events:none}
.wise8 .ruled{position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 35px,rgba(91,163,217,.14) 35px 36px);pointer-events:none;border-radius:inherit}
@media (max-width:900px){.wise8 .g{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.wise8 .tabs{left:6px;right:6px;gap:4px}.wise8 .tab{font-size:12px;padding:6px 6px 14px}.wise8 .stack{min-height:520px;margin:0 6px}.wise8 .folder{padding-top:72px}.wise8 .back{top:54px}}
@media (prefers-reduced-motion:reduce){.wise8 .sheet,.wise8 .tab{transition:none}}
</style>
<div class="wrap">
 <div class="g">
  <div>
   <span class="kick">The Wise Check</span>
   <h2 class="h2" id="w8-h" style="margin-top:12px">The File</h2>
   <p class="lede rv">The five things people ask us about a Wise Check, answered in our own words. Pull a tab.</p>
   <a class="btn btn-amber" href="#book" data-mag data-owl="hoot">Book a Wise Check</a>
  </div>
  <div class="folder" data-owl="say:Pull a tab">
   <div class="back" aria-hidden="true"></div>
   <div class="tabs" role="tablist" aria-label="Questions about the Wise Check"></div>
   <div class="stack"></div>
   <span class="clip" aria-hidden="true"></span>
  </div>
 </div>
</div>
<script>
OWL.reg('wise','8',function(root){
  var W = OWL.WISE, chk = OWL.SVC.filter(function(s){ return s.k === 'check'; })[0], tabsEl = root.querySelector('.tabs'), stack = root.querySelector('.stack'), h2 = root.querySelector('h2');
  OWL.split(h2);
  function esc(t){ return String(t).replace(/[<>&]/g, ''); }
  var Q = [
    {q:'What is it?', h:'What is a Wise Check?', b:'<p>' + esc(chk.d) + '</p><p>' + esc(chk.inc[0]) + ', ' + esc(chk.inc[1]).charAt(0).toLowerCase() + esc(chk.inc[1]).slice(1) + ', and ' + esc(chk.inc[2]).charAt(0).toLowerCase() + esc(chk.inc[2]).slice(1) + '.</p>'},
    {q:'What’s in it?', h:'What’s in it?', b:'<ul>' + W.parts.map(function(p){ return '<li><b>' + esc(p.n) + '</b><span>' + esc(p.t) + '</span></li>'; }).join('') + '</ul>'},
    {q:'When to book?', h:'When should I book one?', b:'<ul>' + W.cases.map(function(c){ return '<li><b>' + esc(c.n) + '</b><span>' + esc(c.t) + '</span></li>'; }).join('') + '</ul>'},
    {q:'Will I see it?', h:'Will I see what you saw?', b:'<p>Yes. ' + esc(W.parts[3].t) + '</p><p>The Wise Check includes ' + esc(chk.inc[1]).charAt(0).toLowerCase() + esc(chk.inc[1]).slice(1) + '.</p>'},
    {q:'How to book?', h:'How do I book?', b:'<p>Call <a href="tel:+16519776027">(651) 977-6027</a>, Monday to Saturday, 08:00–18:00.</p><p>Or email <a href="mailto:info@owlroofing.com?subject=Wise%20Check%20request">info@owlroofing.com</a> any time.</p><p>Owl Roofing LLC · 1000 County Rd E #230, Shoreview, MN 55126</p>'}];
  var cur = -1, tabs = [], sheets = [];
  Q.forEach(function(x, i){ var t = document.createElement('button'); t.type = 'button'; t.className = 'tab'; t.id = 'w8-t' + i; t.setAttribute('role', 'tab'); t.setAttribute('aria-controls', 'w8-p' + i); t.textContent = x.q; tabsEl.appendChild(t); tabs.push(t);
    var s = document.createElement('div'); s.className = 'sheet'; s.id = 'w8-p' + i; s.setAttribute('role', 'tabpanel'); s.setAttribute('aria-labelledby', 'w8-t' + i);
    s.innerHTML = '<span class="ruled" aria-hidden="true"></span><span class="k">Question ' + (i + 1) + ' of 5</span><h3>' + x.h + '</h3>' + x.b; stack.appendChild(s); sheets.push(s);
    t.addEventListener('click', function(){ pick(i); });
    t.addEventListener('keydown', function(e){ var m = e.key === 'ArrowRight' ? (i + 1) % 5 : e.key === 'ArrowLeft' ? (i + 4) % 5 : e.key === 'Home' ? 0 : e.key === 'End' ? 4 : null; if (m === null) return; e.preventDefault(); pick(m); tabs[m].focus(); }); });
  function pick(i){ if (i === cur) return; cur = i;
    tabs.forEach(function(t, j){ var on = j === i; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; });
    /* the chosen sheet comes to the front; the rest shuffle back and peek out, each a little off square */
    var order = sheets.map(function(s, j){ return j; }).filter(function(j){ return j !== i; });
    sheets.forEach(function(s, j){ var on = j === i; s.classList.toggle('front', on); if (on){ s.removeAttribute('inert'); s.removeAttribute('aria-hidden'); } else { s.setAttribute('inert', ''); s.setAttribute('aria-hidden', 'true'); } if (on){ s.style.setProperty('--sx', '0px'); s.style.setProperty('--sy', '0px'); s.style.setProperty('--sr', '0deg'); s.style.setProperty('--so', 1); s.style.zIndex = 4; }
      else { var d = order.indexOf(j) + 1; s.style.setProperty('--sx', (d*5) + 'px'); s.style.setProperty('--sy', (d*7) + 'px'); s.style.setProperty('--sr', ((d % 2 ? 1 : -1)*d*.6) + 'deg'); s.style.setProperty('--so', 1); s.style.zIndex = 4 - d; } }); }
  pick(0);
  if (OWL.reduce || !('IntersectionObserver' in window)){ OWL.reveal(h2); return; }
  var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); OWL.reveal(h2); } }, {threshold:.3}); io.observe(stack);
});
</script>
</section>
