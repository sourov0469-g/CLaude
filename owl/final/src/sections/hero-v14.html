<section class="sec hero14" aria-labelledby="h14-a">
<style>
.hero14{overflow:hidden;padding-top:clamp(14px,2vw,28px);padding-bottom:clamp(28px,3.4vw,52px)}
.hero14 .top{text-align:center;max-width:1160px;margin-inline:auto}
.hero14 .eyebrow{display:inline-flex;align-items:center;gap:12px;margin:0;font-weight:600;font-size:16px;color:var(--ink-70)}
.hero14 .eyebrow svg{width:56px;height:10px;flex:none;overflow:visible}
.hero14 .eyebrow path{fill:none;stroke:var(--amber);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.77,0,.175,1) .4s}
.hero14.go .eyebrow path{stroke-dashoffset:0}
.hero14 .h1{font-size:clamp(34px,3.9vw,58px);margin-top:6px;text-wrap:balance}
.hero14 .lede{margin:8px auto 0;max-width:72ch;text-wrap:balance}
.hero14 .bandwrap{position:relative;margin-top:clamp(18px,2.4vw,28px)}
.hero14 .band{position:relative;height:clamp(300px,29vw,430px);border-radius:30px;overflow:hidden;background:#8C6A3A;box-shadow:0 50px 70px -48px rgba(23,17,29,.6);touch-action:pan-y}
.hero14 .band>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 2.4s cubic-bezier(.22,.61,.36,1)}
.hero14 .on>img{transform:none}
.hero14 .band::after{content:"";position:absolute;inset:auto 0 0 0;height:34%;background:linear-gradient(180deg,rgba(23,17,29,0),rgba(23,17,29,.32));pointer-events:none}
.hero14 .shd{position:absolute;left:0;top:0;width:26%;pointer-events:none;will-change:transform;opacity:0;transition:opacity .8s}
.hero14 .on .shd{opacity:1}
.hero14 .shd img{display:block;width:100%;height:auto;filter:brightness(0) blur(3.5px);opacity:.4;mix-blend-mode:multiply}
.hero14 .ctas{position:absolute;inset:auto clamp(14px,2vw,26px) clamp(14px,2vw,26px);display:flex;justify-content:space-between;align-items:end;gap:16px;z-index:2}
.hero14 .ctas a{width:min(300px,34%)}
.hero14 .ctas .t-face{white-space:nowrap;padding:0 22px}
.hero14 .ctas .btn-tab svg{width:20px;height:20px}
.hero14 .ctas .btn{min-height:60px;font-size:18px}
.hero14 .trust{margin-top:clamp(18px,2.4vw,30px)}
@media (max-width:900px){.hero14 .band{height:auto;aspect-ratio:4/3}.hero14 .shd{width:52%}.hero14 .ctas{position:static;flex-direction:column;align-items:stretch;gap:20px;margin-top:20px}.hero14 .ctas a{width:100%}.hero14 .band::after{display:none}}
@media (max-width:600px){.hero14 .eyebrow svg{display:none}}
@media (prefers-reduced-motion:reduce){.hero14 .band>img{transition:none;transform:none}.hero14 .shd{transition:none}.hero14 .eyebrow path{stroke-dashoffset:0;transition:none}}
</style>
<div class="wrap">
 <div class="top">
  <p class="eyebrow"><svg viewBox="0 0 56 10" aria-hidden="true"><path pathLength="1" d="M2 6 C14 1, 26 9, 38 4 S52 5, 54 4"/></svg>Family-owned roofers in Shoreview, Minnesota</p>
  <h1 class="h1" id="h14-a">Hoo’s Watching Your Roof? We Are.</h1>
  <p class="lede">Leaks, storm damage or a new roof: we’ll take care of it, properly. We Give a Hoot.</p>
 </div>
 <div class="bandwrap">
  <div class="band" data-owl="say:Hoo's watching? We are.">
   <img src="{{A:hero-aerial.webp}}" alt="A shingle roof seen from straight above, with its ridges and vents" width="1540" height="616">
   <div class="shd" aria-hidden="true"><img src="{{A:owl-perch.webp}}" alt="" width="1180" height="703"></div>
  </div>
  <div class="ctas">
    <a class="btn-tab" href="#book" data-owl="hoot"><span class="t-under" aria-hidden="true"></span><span class="t-face">Get My Roof Checked<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <a class="btn btn-line" href="tel:+16519776027" data-mag data-owl="peek">Call (651) 977-6027</a>
   </div>
 </div>
 <div class="trust" role="list">
  <span class="stars" role="listitem" aria-label="Five stars"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg></span>
  <span role="listitem">5.0 · 90+ reviews</span><i class="dot" aria-hidden="true"></i>
  <span role="listitem">GAF Systems Plus Certified</span><i class="dot" aria-hidden="true"></i>
  <span role="listitem">Founded 2025</span>
 </div>
</div>
<script>
OWL.reg('hero','14',function(root){
  /* one idea: the Owl's shadow glides over a real roof; point anywhere and it goes to look */
  var sec = root.querySelector('section'), band = root.querySelector('.band'), shd = root.querySelector('.shd'), h1 = root.querySelector('.h1');
  OWL.split(h1, 110); OWL.reveal(h1); requestAnimationFrame(function(){ sec.classList.add('go'); });
  var W = 0, H = 0, sw = 0, sh = 0;
  function size(){ W = band.clientWidth; H = band.clientHeight; sw = shd.offsetWidth; sh = sw*703/1180; }
  size(); addEventListener('resize', size);
  var pos = {x: W*.5, y: H*.42}, rot = 0, aim = null, raf = 0, last = 0, t0 = performance.now(), seen = true;
  function place(){ shd.style.transform = 'translate(' + (pos.x - sw*.55).toFixed(1) + 'px,' + (pos.y - sh*.5).toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)'; }
  if (OWL.reduce){ band.classList.add('on'); place(); return; }
  pos = {x: W*1.25, y: H*.15};
  function loop(now){ raf = 0; var dt = Math.min(64, now - (last || now)); last = now; var t = (now - t0)/1000;
    /* a slow circle over the middle of the roof, unless the visitor points somewhere */
    var tx = aim ? aim.x : W*.5 + Math.cos(t*.42)*W*.2, ty = aim ? aim.y : H*.48 + Math.sin(t*.42)*H*.16;
    var k = 1 - Math.pow(aim ? .93 : .965, dt/16.7), vx = (tx - pos.x)*k; pos.x += vx; pos.y += (ty - pos.y)*k;
    rot += ((Math.max(-14, Math.min(14, vx*1.6))) - rot)*(1 - Math.pow(.9, dt/16.7));
    place(); if (seen) raf = requestAnimationFrame(loop); }
  function kick(){ if (!raf){ last = 0; raf = requestAnimationFrame(loop); } }
  setTimeout(function(){ band.classList.add('on'); kick(); }, 350);
  band.addEventListener('pointermove', function(e){ var r = band.getBoundingClientRect(); aim = {x: e.clientX - r.left, y: e.clientY - r.top}; });
  band.addEventListener('pointerleave', function(){ aim = null; });
  band.addEventListener('pointerdown', function(e){ if (e.pointerType !== 'mouse'){ var r = band.getBoundingClientRect(); aim = {x: e.clientX - r.left, y: e.clientY - r.top}; setTimeout(function(){ aim = null; }, 2600); } });
  if ('IntersectionObserver' in window) new IntersectionObserver(function(e){ seen = e[0].isIntersecting; if (seen) kick(); }).observe(band);
});
</script>
</section>
