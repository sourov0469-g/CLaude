<section class="sec hero11" aria-labelledby="h11-a">
<style>
.hero11{overflow:hidden;padding-top:clamp(24px,3.4vw,52px);padding-bottom:clamp(28px,3.4vw,52px)}
.hero11 .g{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:clamp(16px,3vw,44px)}
.hero11 .eyebrow{display:inline-flex;align-items:center;gap:12px;margin:0 0 10px;font-weight:600;font-size:16px;color:var(--ink-70)}
.hero11 .eyebrow svg{width:56px;height:10px;flex:none;overflow:visible}
.hero11 .eyebrow path{fill:none;stroke:var(--amber);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.77,0,.175,1) .4s}
.hero11.go .eyebrow path{stroke-dashoffset:0}
.hero11 .h1{font-size:clamp(40px,4.7vw,72px)}
.hero11 .lede{margin:20px 0 30px;max-width:34ch}
.hero11 .ctas{display:flex;flex-direction:column;gap:22px;max-width:390px}
.hero11 .ctas .btn-tab{width:100%}
.hero11 .ctas .btn-tab svg{width:20px;height:20px}
.hero11 .ctas .btn{width:100%;min-height:60px;font-size:18px}
.hero11 .stage{position:relative;aspect-ratio:1180/1130;max-width:720px;width:100%;justify-self:center}
.hero11 .card{position:absolute;left:12.7%;top:50.6%;width:74.6%;height:48.7%;padding:10px;border-radius:24px;background:#FFFDF7;box-shadow:0 2px 0 #fff inset,0 40px 60px -36px rgba(23,17,29,.55)}
.hero11 .card div{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden}
.hero11 .card img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.45) brightness(.8) contrast(.95);transition:filter 1.4s cubic-bezier(.22,.61,.36,1)}
.hero11 .card div::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(70,78,96,.38),rgba(70,78,96,.12));transition:opacity 1.4s}
.hero11 .dry .card img{filter:none}
.hero11 .dry .card div::after{opacity:0}
.hero11 .owl{position:absolute;left:0;top:0;width:100%;height:auto;z-index:2;transform-origin:67% 82%;transform:translateY(-22%) scale(.9) rotate(-4deg);opacity:0;transition:transform 1s cubic-bezier(.2,.9,.25,1.18),opacity .45s;filter:drop-shadow(0 14px 12px rgba(23,17,29,.28))}
.hero11 .landed .owl{transform:none;opacity:1}
.hero11 .owl.breathe{animation:h11b 6s ease-in-out infinite}
@keyframes h11b{50%{translate:0 -4px;scale:1.006}}
.hero11 canvas{position:absolute;left:-4%;top:-6%;width:108%;height:108%;z-index:3;pointer-events:none}
.hero11 .pour{position:absolute;right:2%;bottom:-2%;z-index:4;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;background:var(--paper);box-shadow:0 4px 0 rgba(23,17,29,.1),0 14px 26px -14px rgba(23,17,29,.4);font-weight:700;font-size:15px;transition:transform .2s}
.hero11 .pour:hover{transform:translateY(-2px)}
.hero11 .pour:active{transform:translateY(2px)}
.hero11 .pour svg{width:20px;height:20px}
.hero11 .pour[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.hero11 .pour:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hero11 .trust{margin-top:clamp(18px,3vw,34px)}
@media (max-width:900px){.hero11 .g{grid-template-columns:minmax(0,1fr)}.hero11 .stage{order:-1;max-width:560px}.hero11 .ctas{max-width:none}.hero11 .lede{max-width:none;margin:16px 0 24px}.hero11 .pour{right:auto;left:0;top:0;bottom:auto}}
@media (prefers-reduced-motion:reduce){.hero11 .pour{display:none}.hero11 .owl{transition:none}.hero11 .owl.breathe{animation:none}.hero11 .card img,.hero11 .card div::after{transition:none}.hero11 .eyebrow path{stroke-dashoffset:0;transition:none}}
</style>
<div class="wrap">
 <div class="g">
  <div class="txt">
   <p class="eyebrow"><svg viewBox="0 0 56 10" aria-hidden="true"><path pathLength="1" d="M2 6 C14 1, 26 9, 38 4 S52 5, 54 4"/></svg>Family-owned roofers in Shoreview, Minnesota</p>
   <h1 class="h1" id="h11-a">Under Our Wing,<br>Your Nest Is Safe</h1>
   <p class="lede">A leak, storm damage or a tired old roof? We’ll fix it properly. We Give a Hoot.</p>
   <div class="ctas">
    <a class="btn-tab" href="#book" data-owl="hoot"><span class="t-under" aria-hidden="true"></span><span class="t-face">Get My Roof Checked<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <a class="btn btn-line" href="tel:+16519776027" data-mag data-owl="peek">Call (651) 977-6027</a>
   </div>
  </div>
  <div class="stage" data-owl="say:Dry under here">
   <div class="card"><div><img src="{{A:hero-pines.webp}}" alt="A family home with a shingle roof among tall pines" width="1200" height="750"></div></div>
   <img class="owl" src="{{A:owl-perch.webp}}" alt="A great horned owl lands on the picture and spreads its wings over the house" width="1180" height="703">
   <canvas aria-hidden="true"></canvas>
   <button class="pour" type="button" aria-pressed="false" data-owl="hoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 15a4 4 0 1 1 1.2-7.8A5 5 0 0 1 18 9a3.5 3.5 0 0 1-.5 7H7z"/><path d="M9 19l-1 2M13 19l-1 2M17 19l-1 2"/></svg>Make It Pour</button>
  </div>
 </div>
 <div class="trust" role="list">
  <span class="stars" role="listitem" aria-label="Five stars"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z"/></svg></span>
  <span role="listitem">5.0 · 90+ reviews</span><i class="dot" aria-hidden="true"></i>
  <span role="listitem">GAF Systems Plus Certified</span><i class="dot" aria-hidden="true"></i>
  <span role="listitem">Founded 2025</span>
 </div>
</div>
<script>
OWL.reg('hero','11',function(root){
  /* one idea: rain falls on a real home until the Owl lands on it; from then the wings take the rain and the house brightens */
  var sec = root.querySelector('section'), stage = root.querySelector('.stage'), owl = root.querySelector('.owl'), cv = root.querySelector('canvas'), pour = root.querySelector('.pour'), h1 = root.querySelector('.h1');
  OWL.split(h1, 120); OWL.reveal(h1); requestAnimationFrame(function(){ sec.classList.add('go'); });
  var ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), W = 0, H = 0, ox = 0, oy = 0, mw = 0, mh = 0, mask = null;
  var drops = [], splash = [], storm = 0, landed = false, visible = true, raf = 0, last = 0, stormT = 0;
  function build(){ var r = cv.getBoundingClientRect(); if (!r.width) return; W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    /* the wing silhouette at its landed place (layout box, unaffected by the landing transform) */
    var sr = stage.getBoundingClientRect(); ox = sr.left - r.left; oy = sr.top - r.top; mw = Math.round(owl.offsetWidth); mh = Math.round(owl.offsetHeight);
    if (!owl.naturalWidth || !mw) return; var off = document.createElement('canvas'); off.width = mw; off.height = mh; var o = off.getContext('2d'); o.drawImage(owl, 0, 0, mw, mh);
    try { mask = o.getImageData(0, 0, mw, mh).data; } catch (e){ mask = null; } }
  function wing(x, y){ if (!landed || !mask) return false; var mx = Math.round(x - ox), my = Math.round(y - oy); if (mx < 0 || my < 0 || mx >= mw || my >= mh) return false; return mask[(my*mw + mx)*4 + 3] > 150; }
  function spawn(n){ for (var i = 0; i < n; i++) drops.push({x: Math.random()*W*1.15 - W*.08, y: -Math.random()*H*.5, v: 6.5 + Math.random()*4.5, l: 10 + Math.random()*12}); }
  function frame(now){ raf = 0; var dt = Math.min(48, now - (last || now)); last = now; var f = dt/16.7;
    ctx.clearRect(0, 0, W, H);
    var want = storm ? 230 : 80; if (drops.length < want) spawn(Math.min(14, want - drops.length));
    var wind = storm ? 2.4 : 1; ctx.lineCap = 'round';
    for (var i = drops.length - 1; i >= 0; i--){ var d = drops[i]; d.y += d.v*(storm ? 1.3 : 1)*f; d.x += wind*f;
      var hit = wing(d.x, d.y), ground = d.y > H - 6;
      if (hit || ground){ for (var k = 0; k < (hit ? 3 : 2); k++) splash.push({x: d.x, y: d.y, vx: (Math.random() - .5)*3 - (hit ? 1 : 0), vy: -Math.random()*2.4 - .6, t: 1, a: hit});
        if (drops.length > want) drops.splice(i, 1); else { d.x = Math.random()*W*1.15 - W*.08; d.y = -20 - Math.random()*80; } continue; }
      ctx.strokeStyle = 'rgba(23,17,29,' + (storm ? .34 : .22) + ')'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - wind*2.2, d.y - d.l); ctx.stroke(); }
    for (var j = splash.length - 1; j >= 0; j--){ var s = splash[j]; s.x += s.vx*f; s.y += s.vy*f; s.vy += .22*f; s.t -= .045*f; if (s.t <= 0){ splash.splice(j, 1); continue; }
      ctx.fillStyle = s.a ? 'rgba(234,162,33,' + (s.t*.9).toFixed(2) + ')' : 'rgba(23,17,29,' + (s.t*.3).toFixed(2) + ')'; ctx.beginPath(); ctx.arc(s.x, s.y, s.a ? 1.9 : 1.3, 0, 6.3); ctx.fill(); }
    if (visible) raf = requestAnimationFrame(frame); }
  function go(){ if (!raf && !OWL.reduce){ last = 0; raf = requestAnimationFrame(frame); } }
  function land(){ stage.classList.add('landed');
    setTimeout(function(){ landed = true; stage.classList.add('dry'); if (!OWL.reduce) owl.classList.add('breathe'); }, OWL.reduce ? 0 : 950); }
  function ready(){ build(); go(); setTimeout(land, OWL.reduce ? 0 : 1300); }
  if (OWL.reduce){ stage.classList.add('landed', 'dry'); landed = true; }
  if (owl.complete && owl.naturalWidth) ready(); else owl.addEventListener('load', ready);
  addEventListener('resize', build);
  if ('IntersectionObserver' in window) new IntersectionObserver(function(e){ visible = e[0].isIntersecting; if (visible) go(); }).observe(stage);
  pour.addEventListener('click', function(){ storm = storm ? 0 : 1; pour.setAttribute('aria-pressed', storm ? 'true' : 'false'); clearTimeout(stormT);
    if (storm) stormT = setTimeout(function(){ storm = 0; pour.setAttribute('aria-pressed', 'false'); }, 6000);
    if (OWL.reduce){ pour.setAttribute('aria-pressed', 'false'); storm = 0; } });
});
</script>
