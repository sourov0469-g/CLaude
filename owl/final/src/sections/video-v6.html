<script>
OWL.reg('video','6',function(root){
  var M = [[0, 'Rafters and new decking'], [3.1, 'GAF shingles carried up'], [6.4, 'One of the crew, shingle in hand'], [9.2, 'Walking a finished roof'], [13, 'OSB carried in for the next roof']];
  var front = root.querySelector('.front'), vid = root.querySelector('video'), sill = root.querySelector('.sill'), lamp = root.querySelector('.lamp'), pp = root.querySelector('.pp'), h2 = root.querySelector('h2'), cur = -1;
  OWL.split(h2);
  function setPP(){ var p = vid.paused; pp.setAttribute('aria-label', p ? 'Play the film' : 'Pause the film'); pp.querySelector('.ic').setAttribute('d', p ? 'M6 3l11 7-11 7z' : 'M5 3h3.5v14H5zM11.5 3H15v14h-3.5z'); }
  pp.addEventListener('click', function(){ if (vid.paused) OWL.play(vid); else vid.pause(); setTimeout(setPP, 50); }); vid.addEventListener('play', setPP); vid.addEventListener('pause', setPP);
  root.querySelector('.full').addEventListener('click', function(){ OWL.ytModal('ehKLv5DF2TQ'); });
  function tick(){ var t = vid.currentTime || 0, i = 0; M.forEach(function(m, j){ if (t >= m[0]) i = j; }); if (i !== cur){ cur = i; sill.textContent = M[i][1]; lamp.classList.toggle('on', i % 2 === 1); } }
  vid.addEventListener('timeupdate', tick); tick(); setPP();
  if (OWL.reduce){ vid.pause(); front.classList.add('open'); OWL.reveal(h2); setPP(); return; }
  if ('IntersectionObserver' in window){ var io = new IntersectionObserver(function(e){ if (e[0].isIntersecting){ io.disconnect(); front.classList.add('open'); OWL.reveal(h2); } }, {threshold:.35}); io.observe(front); } else front.classList.add('open');
});
</script>
