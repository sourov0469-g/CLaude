<section class="sec ss2" id="svc-steps" aria-labelledby="ss2-h">
<style>
.ss2{text-align:center}
.ss2 .lede{margin:12px auto 0;max-width:46ch}
.ss2 .course{display:flex;justify-content:center;gap:6px;margin:clamp(28px,4vw,44px) auto 0;max-width:1100px;padding-top:26px;perspective:900px}
.ss2 .tab{position:relative;flex:1;min-width:0;height:clamp(78px,9vw,112px);border-radius:8px 8px 12px 12px;background:linear-gradient(180deg,#3a3142,#2a2131);color:var(--cream);box-shadow:0 6px 0 #17111D,0 16px 22px -12px rgba(23,17,29,.6);transform-origin:50% 0;transition:transform .45s cubic-bezier(.3,1.4,.5,1),background .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700}
.ss2 .tab:nth-child(even){margin-top:18px}
.ss2 .tab .num{font-size:clamp(20px,2.4vw,30px);font-weight:800;letter-spacing:-.02em}
.ss2 .tab .nm{font-size:12px;font-weight:600;opacity:.75;padding:0 6px;line-height:1.2}
.ss2 .tab.done{background:linear-gradient(180deg,#F3B84A,var(--amber));color:var(--ink);box-shadow:0 6px 0 var(--amber-edge),0 16px 22px -12px rgba(199,135,26,.7)}
.ss2 .tab[aria-selected="true"]{transform:rotateX(28deg) translateY(-10px);background:linear-gradient(180deg,#F3B84A,var(--amber));color:var(--ink);box-shadow:0 6px 0 var(--amber-edge),0 0 0 4px rgba(234,162,33,.35),0 26px 30px -10px rgba(199,135,26,.8)}
.ss2 .card{display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,36px);align-items:center;max-width:860px;margin:clamp(24px,3vw,36px) auto 0;padding:clamp(22px,3vw,36px);border-radius:28px;background:var(--paper);text-align:left;box-shadow:0 2px 0 #fff inset,0 30px 60px -40px rgba(23,17,29,.5)}
.ss2 .card svg{width:clamp(80px,10vw,120px);height:auto;color:var(--ink)}
.ss2 .card .n{font-weight:700;font-size:14px;letter-spacing:.14em;color:var(--ink-70)}
.ss2 .card h3{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.03em;margin:4px 0 8px}
.ss2 .card p{font-size:18px;color:var(--ink-70)}
.ss2 .ctl{display:flex;justify-content:center;gap:12px;margin-top:22px}
.ss2 .ctl button{width:54px;height:54px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 rgba(23,17,29,.1),0 12px 22px -14px rgba(23,17,29,.5);display:grid;place-items:center}
.ss2 .ctl button:active{transform:translateY(3px)}
.ss2 .ctl button:disabled{opacity:.4}
@media (max-width:760px){.ss2 .tab .nm{display:none}.ss2 .card{grid-template-columns:1fr;text-align:center}.ss2 .card svg{margin:0 auto}}
</style>
<div class="wrap">
 <h2 class="h2 rv" id="ss2-h">How a Roof Replacement Runs</h2>
 <p class="lede rv">Seven steps, laid like a course of shingles. Lift one to read it.</p>
 <div class="course" role="tablist" aria-label="Steps of a roof replacement"></div>
 <div class="card" role="tabpanel" aria-live="polite"><svg viewBox="0 0 64 64" aria-hidden="true"></svg><div><span class="n"></span><h3></h3><p></p></div></div>
 <div class="ctl"><button type="button" class="pv" aria-label="Previous step"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><button type="button" class="nx" aria-label="Next step"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
</div>
<script>
OWL.reg('svc-steps','1',function(root){
  var course = root.querySelector('.course'), card = root.querySelector('.card'), pv = root.querySelector('.pv'), nx = root.querySelector('.nx'), tabs = [], cur = 0;
  OWL.STEPS.forEach(function(s, i){ var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-label', 'Step ' + (i + 1) + ': ' + s.n); b.dataset.owl = 'peek';
    b.innerHTML = '<span class="num" aria-hidden="true">0' + (i + 1) + '</span><span class="nm" aria-hidden="true">' + s.n + '</span>'; b.addEventListener('click', function(){ set(i); });
    b.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight'){ e.preventDefault(); set(Math.min(tabs.length - 1, i + 1), true); } if (e.key === 'ArrowLeft'){ e.preventDefault(); set(Math.max(0, i - 1), true); } });
    course.appendChild(b); tabs.push(b); });
  function set(i, focus){ cur = i; var s = OWL.STEPS[i];
    tabs.forEach(function(t, j){ t.setAttribute('aria-selected', j === i); t.tabIndex = j === i ? 0 : -1; t.classList.toggle('done', j < i); if (j === i && focus) t.focus(); });
    card.querySelector('svg').innerHTML = s.ico; card.querySelector('.n').textContent = 'STEP 0' + (i + 1) + ' OF 07'; card.querySelector('h3').textContent = s.n; card.querySelector('p').textContent = s.t;
    pv.disabled = i === 0; nx.disabled = i === tabs.length - 1; }
  pv.addEventListener('click', function(){ set(Math.max(0, cur - 1)); }); nx.addEventListener('click', function(){ set(Math.min(tabs.length - 1, cur + 1)); });
  set(0);
});
</script>
</section>
