<section class="rs people p3" id="people" data-sky="day" aria-labelledby="p3-h">
<style>
/* V3 · Two names (Lando: big type with photographs placed on it). "Tim Brown" and "Noah Bergland" set very large; point at a
   name (or tap it) and that family's photo opens beside it in a growing mask; "and the crew" opens the crew. Photos never
   shown wider than their own pixels. */
.p3{padding:clamp(100px,13vh,150px) clamp(16px,4vw,64px) clamp(90px,11vh,130px);overflow:hidden}
.p3 .in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:center;min-height:min(78vh,760px)}
.p3 .k{margin:0 0 18px;font-size:16px;font-weight:700;color:var(--ink-70)}
.p3 h2{margin:0;font-size:inherit;font-weight:inherit}
.p3 .names{list-style:none;margin:0;padding:0}
.p3 .names button{display:block;width:100%;margin:0;padding:6px 0;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:var(--ink-50);transition:color .3s}
.p3 .names button b{display:block;font-size:clamp(46px,7.2vw,124px);font-weight:900;line-height:.95;letter-spacing:-.05em}
.p3 .names button span{display:block;margin-top:4px;font-size:clamp(15px,1.2vw,18px);font-weight:700;letter-spacing:0;color:var(--ink-70)}
.p3 .names button.crew b{font-size:clamp(30px,3.6vw,60px)}
.p3 .names button[aria-pressed="true"]{color:var(--ink)}
.p3 .names button[aria-pressed="true"] b{text-decoration:underline;text-decoration-color:var(--call);text-decoration-thickness:.07em;text-underline-offset:.12em}
.p3 .names button:focus-visible{outline:3px solid var(--acc);outline-offset:4px;border-radius:8px}
.p3 .stage{position:relative;height:min(64vh,580px)}
.p3 .pane{position:absolute;inset:0;display:grid;place-items:center;clip-path:circle(0% at 50% 50%);transition:clip-path .8s cubic-bezier(.16,1,.3,1)}
.p3 .pane.on{clip-path:circle(75% at 50% 50%)}
.p3 .pane figure{margin:0;display:grid;justify-items:center;gap:12px}
.p3 .pane img{display:block;width:auto;height:auto;max-width:min(calc(var(--nw) * 1px),100%);max-height:min(54vh,500px);border-radius:20px}
.p3 .pane img.cut{border-radius:0;filter:drop-shadow(0 26px 30px rgba(0,0,0,.3))}
.p3 .pane figcaption{font-size:15px;font-weight:700;color:var(--ink-70);text-align:center;max-width:40ch}
.p3 .pane figcaption b{color:var(--ink)}
.p3 .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.p3 .two img{max-height:min(44vh,400px)}
.p3 .foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px 26px;margin:10px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:15px;font-weight:700;color:var(--ink)}
.p3 .foot span{color:var(--ink-70);font-weight:600}
@media (max-width:900px){.p3 .in{grid-template-columns:1fr;min-height:0}.p3 .stage{height:auto;min-height:330px;order:2}.p3 .foot{order:3}.p3 .pane{position:absolute}.p3 .pane img{max-width:min(calc(var(--nw) * .55px),100%);max-height:300px}.p3 .two img{max-height:220px}}
@media (prefers-reduced-motion:reduce){.p3 .pane,.p3 .names button{transition:none}}
</style>
<div class="in">
 <div>
  <p class="k" id="p3-h">Who shows up? Two families, by name.</p>
  <ul class="names" aria-labelledby="p3-h"></ul>
 </div>
 <div class="stage" aria-live="polite"></div>
 <p class="foot">Family-owned <span>· founded 2025 · Shoreview, MN</span> GAF Systems Plus certified <span>· We Give a Hoot</span></p>
</div>
<script>
(function(){
  var sec = document.currentScript.closest('section'), list = sec.querySelector('.names'), stage = sec.querySelector('.stage');
  var N = [
    { b: 'Tim Brown', s: 'Co-founder · the Browns', fig: '<figure><img class="cut" src="{{A:browns.webp}}" alt="Tim Brown with his wife and their children" style="--nw:620" width="620" height="471"><figcaption><b>The Browns.</b> Tim Brown, co-founder, with his family.</figcaption></figure>' },
    { b: 'Noah Bergland', s: 'Co-founder · the Berglands', fig: '<figure><div class="two"><img class="cut" src="{{A:berglands.webp}}" alt="Noah Bergland with his wife and their children" style="--nw:558" width="558" height="620"><img src="{{A:fam-noah.webp}}" alt="Noah Bergland on a ladder at a roof edge" style="--nw:700" width="700" height="543"></div><figcaption><b>The Berglands.</b> Noah Bergland, co-founder, with his family, and on the job.</figcaption></figure>' },
    { b: 'and the crew', s: 'GAF Systems Plus certified', crew: 1, fig: '<figure><div class="two"><img src="{{A:fam-crew.webp}}" alt="An Owl roofer smiling on a job, crew behind him" style="--nw:900" width="900" height="546"><img src="{{A:svc-check.webp}}" alt="One of Owl’s crew walking on a roof" style="--nw:560" width="560" height="373"></div><figcaption><b>Owl’s crew.</b> On the job, about your home from start to finish.</figcaption></figure>' }];
  var panes = N.map(function(n){ var d = document.createElement('div'); d.className = 'pane'; d.innerHTML = n.fig; d.setAttribute('aria-hidden', 'true'); stage.appendChild(d); return d; });
  var btns = N.map(function(n, i){ var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button'; if (n.crew) b.className = 'crew'; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<b>' + n.b + '</b><span>' + n.s + '</span>'; li.appendChild(b); list.appendChild(li);
    b.addEventListener('click', function(){ show(i); }); b.addEventListener('mouseenter', function(){ if (matchMedia('(hover:hover)').matches) show(i); }); b.addEventListener('focus', function(){ show(i); }); return b; });
  var cur = -1;
  function show(i){ if (i === cur) return; cur = i; btns.forEach(function(b, j){ b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); }); panes.forEach(function(p, j){ p.classList.toggle('on', j === i); p.setAttribute('aria-hidden', j === i ? 'false' : 'true'); }); sec.dataset.name = i + 1; }
  show(0);
})();
</script>
</section>
