<section class="rs people" id="people" data-sky="dusk" aria-labelledby="pp-h">
<style>
/* V1 · Split cover (MERSI; kept, repaired). Owl's own photos are 558–900 px wide: they are now FRAMED at or below their own
   pixels on two muted halves (no more stretching to 1440 px), the chapters CROSSFADE (no more two families stacked mid-turn),
   and on phones the heading and the card keep clear of faces. */
.people{height:330vh}
.people .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--deep)}
.people .cv{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;opacity:0;transition:opacity .7s ease;pointer-events:none}
.people .cv.on{opacity:1}
.people .half{position:relative;display:grid;place-items:center;padding:96px clamp(16px,3vw,48px) 150px;overflow:hidden}
.people .half.l{background:var(--deep)}.people .half.r{background:var(--deep-2)}
.people .half img{display:block;width:100%;height:auto;max-width:min(calc(var(--nw) * 1px),100%);max-height:calc(100vh - 290px);object-fit:contain;border-radius:18px;transition:scale 1.2s cubic-bezier(.16,1,.3,1),translate .9s cubic-bezier(.16,1,.3,1)}
.people .half img.cut{border-radius:0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.people .half img.ph{box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.people .cv:not(.on) img{translate:0 18px;scale:.98}
.people .half .say{margin:0;font-size:clamp(30px,3.4vw,54px);font-weight:900;line-height:1;letter-spacing:-.035em;color:var(--on-deep);max-width:11ch}
.people .half .say em{font-style:normal;color:var(--acc-deep)}
.people .seam{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.22);z-index:2}
.people .card{position:absolute;z-index:3;left:50%;bottom:clamp(28px,6vh,60px);translate:-50% 0;width:min(760px,calc(100% - 32px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:16px 22px;border-radius:8px;background:var(--cc,var(--surface));color:var(--ink);box-shadow:0 30px 50px -30px rgba(0,0,0,.6);transition:background .6s}
.people .card .nm{font-size:clamp(22px,2.2vw,32px);font-weight:900;letter-spacing:-.025em;line-height:1}
.people .card .nm small{display:block;margin-top:6px;font-size:14px;font-weight:700;letter-spacing:0}
.people .card .mk{width:clamp(70px,7vw,100px);opacity:.55;--logo-ink:color-mix(in srgb,var(--ink) 60%,transparent);--logo-acc:color-mix(in srgb,var(--ink) 60%,transparent)}
.people .card .mk .logo{width:100%;height:auto;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5)) drop-shadow(0 -1px 0 rgba(0,0,0,.2))}
.people .card .rt{text-align:right;font-size:14px;font-weight:700;line-height:1.4}
.people .card .rt b{display:block;font-size:16px;font-weight:900}
.people .card .tx{transition:opacity .3s,translate .4s cubic-bezier(.16,1,.3,1)}
.people .card.swap .tx{opacity:0;translate:0 8px}
.people h2{position:absolute;z-index:3;left:clamp(16px,3vw,44px);top:clamp(84px,11vh,110px);margin:0;font-size:clamp(28px,2.6vw,40px);font-weight:900;line-height:1;letter-spacing:-.03em;color:var(--on-deep)}
.people .dots{position:absolute;z-index:3;right:clamp(14px,3vw,44px);top:clamp(76px,10vh,100px);display:flex;gap:2px}
.people .dots button{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer}
.people .dots button i{width:12px;height:12px;border-radius:50%;border:2px solid var(--on-deep)}
.people .dots button[aria-current="true"] i{background:var(--acc-deep);border-color:var(--acc-deep);scale:1.3}
.people .dots button:focus-visible{outline:3px solid var(--on-deep);outline-offset:-4px}
.people .tag{position:absolute;left:50%;translate:-50% 0;top:calc(100% - 140px);z-index:2;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
@media (max-width:860px){
 .people .cv{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
 .people .half{padding:12px 16px}
 .people .half.l{align-items:end}.people .half.r{align-items:start}
 .people .half img{max-width:min(calc(var(--nw) * .55px),100%);max-height:calc(50vh - 180px)}
 .people .half .say{font-size:28px;text-align:center}
 .people .seam{display:none}.people .tag{display:none}
 .people .card{grid-template-columns:1fr auto;gap:12px;padding:12px 14px;bottom:88px}.people .card .mk{display:none}.people .card .rt b{font-size:14px}.people .card .rt{font-size:13px}
 .people h2{top:80px;font-size:24px}.people .dots{top:108px;left:8px;right:auto}
 .people .half.l{padding-top:160px}.people .half.r{padding-bottom:200px}}
@media (prefers-reduced-motion:reduce){.people .cv,.people .half img,.people .card,.people .card .tx{transition:none}}
</style>
<div class="stage">
 <div class="covers"></div>
 <span class="seam" aria-hidden="true"></span>
 <h2 id="pp-h">Who shows up? Family.</h2>
 <div class="dots" role="group" aria-label="The people behind Owl"></div>
 <div class="card" aria-live="polite"><span class="nm tx"></span><span class="mk" aria-hidden="true">{{LOGO}}</span><span class="rt tx"></span></div>
</div>
<script>
(function(){
  var sec = document.currentScript.closest('section'), wrap = sec.querySelector('.covers'), card = sec.querySelector('.card'), dots = sec.querySelector('.dots');
  /* Owl's own photos only, framed at no more than their own pixels (nw = natural width). The right half of the Browns chapter is
     words, not a stock house: there is no photo of Tim on a job, and a stranger's house would say something untrue. */
  var P = [
    { l: '<img class="cut" src="{{A:browns.webp}}" alt="Tim Brown with his wife and their children" style="--nw:620" width="620" height="471">', r: '<p class="say">Two families. <em>One crew.</em> Founded 2025.</p>', nm: 'The Browns', sm: 'Tim Brown, co-founder', rt: '<b>Family-owned</b>Founded 2025 · Shoreview, MN', cc: 'var(--surface)' },
    { l: '<img class="cut" src="{{A:berglands.webp}}" alt="Noah Bergland with his wife and their children" style="--nw:558" width="558" height="620">', r: '<img class="ph" src="{{A:fam-noah.webp}}" alt="Noah Bergland on a ladder at a roof edge" style="--nw:700" width="700" height="543">', nm: 'The Berglands', sm: 'Noah Bergland, co-founder', rt: '<b>On the job</b>Co-founder, ladder in hand', cc: 'var(--wash)' },
    { l: '<img class="ph" src="{{A:fam-crew.webp}}" alt="An Owl roofer smiling on a job, crew behind him" style="--nw:900" width="900" height="546">', r: '<img class="ph" src="{{A:svc-check.webp}}" alt="One of Owl’s crew walking on a roof" style="--nw:560" width="560" height="373">', nm: 'Owl’s crew', sm: 'GAF Systems Plus certified', rt: '<b>We Give a Hoot</b>About your home, start to finish', cc: 'var(--acc-wash)' }];
  var cvs = P.map(function(x){ var d = document.createElement('div'); d.className = 'cv'; d.innerHTML = '<div class="half l">' + x.l + '</div><div class="half r">' + x.r + '</div>'; wrap.appendChild(d); return d; });
  var db = P.map(function(x, i){ var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', x.nm + ': ' + x.sm); b.innerHTML = '<i aria-hidden="true"></i>';
    b.addEventListener('click', function(){ var top = sec.getBoundingClientRect().top + scrollY, span = sec.offsetHeight - innerHeight; scrollTo({ top: top + span * ((i + .5) / P.length), behavior: OWL.reduce ? 'instant' : 'smooth' }); }); dots.appendChild(b); return b; });
  var cur = -1;
  function text(i){ var x = P[i]; card.querySelector('.nm').innerHTML = x.nm + '<small>' + x.sm + '</small>'; card.querySelector('.rt').innerHTML = x.rt; card.style.setProperty('--cc', x.cc); }
  function show(i){ if (i === cur) return; cvs.forEach(function(c, j){ c.classList.toggle('on', j === i); c.setAttribute('aria-hidden', j === i ? 'false' : 'true'); });
    db.forEach(function(b, j){ b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    if (cur < 0 || OWL.reduce) text(i); else { card.classList.add('swap'); setTimeout(function(){ text(i); card.classList.remove('swap'); }, 280); }
    cur = i; sec.dataset.cover = i + 1; }
  function read(){ var r = sec.getBoundingClientRect(), span = sec.offsetHeight - innerHeight, p = Math.max(0, Math.min(.999, -r.top / span)); show(Math.floor(p * P.length)); }
  addEventListener('scroll', read, { passive: true }); addEventListener('resize', read); read();
})();
</script>
</section>
