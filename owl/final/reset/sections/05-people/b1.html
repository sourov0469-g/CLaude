<section class="rs people" id="people" data-sky="dusk" aria-labelledby="pp-h">
<style>
.people{height:330vh}
.people .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--deep)}
.people .cv{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
.people .half{position:relative;overflow:hidden}
.people .half img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:translate .9s cubic-bezier(.33,1,.68,1),scale 1.2s cubic-bezier(.16,1,.3,1)}
.people .cv .l img{translate:0 100%}.people .cv .r img{translate:0 -100%}
.people .cv.on .l img,.people .cv.on .r img{translate:0 0}
.people .cv.past .l img{translate:0 -100%}.people .cv.past .r img{translate:0 100%}
.people .cv.on img{scale:1.04}
.people .seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(255,255,255,.5);z-index:2}
.people .card{position:absolute;z-index:3;left:50%;top:50%;translate:-50% -50%;width:min(720px,calc(100% - 32px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:18px 22px;border-radius:6px;background:var(--cc,var(--acc));color:var(--ink);box-shadow:0 30px 50px -30px rgba(0,0,0,.6);transition:background .6s}
.people .card .nm{font-size:clamp(22px,2.4vw,34px);font-weight:900;letter-spacing:-.025em;line-height:1}
.people .card .nm small{display:block;margin-top:6px;font-size:14px;font-weight:700;letter-spacing:0}
.people .card .mk{width:clamp(70px,8vw,110px);opacity:.55;--logo-ink:color-mix(in srgb,var(--ink) 60%,transparent);--logo-acc:color-mix(in srgb,var(--ink) 60%,transparent)}
.people .card .mk .logo{width:100%;height:auto;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5)) drop-shadow(0 -1px 0 rgba(0,0,0,.2))}
.people .card .rt{text-align:right;font-size:14px;font-weight:700;line-height:1.4}
.people .card .rt b{display:block;font-size:16px;font-weight:900}
.people .card .tx{transition:opacity .35s,translate .45s cubic-bezier(.16,1,.3,1)}
.people .card.swap .tx{opacity:0;translate:0 10px}
.people h2{position:absolute;z-index:3;left:clamp(16px,3vw,44px);bottom:clamp(90px,12vh,120px);margin:0;max-width:10ch;font-size:clamp(36px,4.6vw,72px);font-weight:900;line-height:.95;letter-spacing:-.04em;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.people .dots{position:absolute;z-index:3;right:clamp(14px,3vw,44px);bottom:clamp(90px,12vh,120px);display:flex;gap:4px}
.people .dots button{width:44px;height:44px;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer}
.people .dots button i{width:12px;height:12px;border-radius:50%;border:2px solid #fff;transition:background .3s,scale .3s}
.people .dots button[aria-current="true"] i{background:#fff;scale:1.3}
.people .dots button:focus-visible{outline:3px solid #fff;outline-offset:-4px}
.people .tag{position:absolute;z-index:3;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:700;top:84px}
.people .tag.tl{left:clamp(14px,3vw,44px)}.people .tag.tr{right:clamp(14px,3vw,44px)}
@media (max-width:860px){.people .cv{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.people .cv .l img{translate:-100% 0}.people .cv .r img{translate:100% 0}.people .cv.past .l img{translate:100% 0}.people .cv.past .r img{translate:-100% 0}
 .people .seam{left:0;right:0;top:50%;bottom:auto;width:auto;height:2px;margin:-1px 0 0}.people .card{grid-template-columns:1fr auto;gap:12px;padding:14px 16px}.people .card .mk{display:none}.people .card .rt b{font-size:14px}.people h2{font-size:34px;bottom:auto;top:120px}.people .tag.tr{top:auto;bottom:calc(50% + 50px);left:clamp(14px,3vw,44px);right:auto}.people .tag.tl{top:84px}}
@media (prefers-reduced-motion:reduce){.people .half img,.people .card,.people .card .tx{transition:none}}
</style>
<div class="stage">
 <div class="covers"></div>
 <span class="seam" aria-hidden="true"></span>
 <div class="card" aria-live="polite"><span class="nm tx"></span><span class="mk" aria-hidden="true">{{LOGO}}</span><span class="rt tx"></span></div>
 <h2 id="pp-h">Who shows up? Family.</h2>
 <span class="tag tl" aria-hidden="true"></span><span class="tag tr" aria-hidden="true"></span>
 <div class="dots" role="group" aria-label="The people behind Owl"></div>
</div>
<script>
(function(){
  var sec = document.currentScript.closest('section'), wrap = sec.querySelector('.covers'), card = sec.querySelector('.card'), dots = sec.querySelector('.dots'), tl = sec.querySelector('.tag.tl'), tr = sec.querySelector('.tag.tr');
  var P = [
    { l: '{{A:browns.webp}}', la: 'Tim Brown with his wife and their children', r: '{{A:hero-nest-home.webp}}', ra: '', nm: 'The Browns', sm: 'Tim Brown, co-founder', rt: '<b>Family-owned</b>Founded 2025 · Shoreview, MN', tl: 'The Browns', tr: 'Illustrative photo', cc: 'var(--acc)' },
    { l: '{{A:berglands.webp}}', la: 'Noah Bergland with his wife and their children', r: '{{A:fam-noah.webp}}', ra: 'Noah Bergland on a ladder at a roof edge', nm: 'The Berglands', sm: 'Noah Bergland, co-founder', rt: '<b>On the job</b>Co-founder, ladder in hand', tl: 'The Berglands', tr: 'Noah Bergland', cc: 'var(--surface)' },
    { l: '{{A:fam-crew.webp}}', la: 'An Owl roofer smiling on a job, crew behind him', r: '{{A:svc-check.webp}}', ra: 'One of Owl’s crew walking on a roof', nm: 'Owl’s crew', sm: 'GAF Systems Plus certified', rt: '<b>We Give a Hoot</b>About your home, start to finish', tl: 'Owl’s crew', tr: 'Owl’s crew', cc: 'var(--acc-wash)' }];
  var cvs = P.map(function(x){ var d = document.createElement('div'); d.className = 'cv'; d.innerHTML = '<div class="half l"><img src="' + x.l + '" alt="' + x.la + '"></div><div class="half r"><img src="' + x.r + '" alt="' + x.ra + '"></div>'; wrap.appendChild(d); return d; });
  var db = P.map(function(x, i){ var b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', x.nm + ': ' + x.sm); b.innerHTML = '<i aria-hidden="true"></i>';
    b.addEventListener('click', function(){ var top = sec.getBoundingClientRect().top + scrollY, span = sec.offsetHeight - innerHeight; scrollTo({ top: top + span * ((i + .5) / P.length), behavior: OWL.reduce ? 'instant' : 'smooth' }); }); dots.appendChild(b); return b; });
  var cur = -1;
  function text(i){ var x = P[i]; card.querySelector('.nm').innerHTML = x.nm + '<small>' + x.sm + '</small>'; card.querySelector('.rt').innerHTML = x.rt; card.style.setProperty('--cc', x.cc); tl.textContent = x.tl; tr.textContent = x.tr; }
  function show(i){ if (i === cur) return; cvs.forEach(function(c, j){ c.classList.toggle('on', j === i); c.classList.toggle('past', j < i); c.setAttribute('aria-hidden', j === i ? 'false' : 'true'); });
    db.forEach(function(b, j){ b.setAttribute('aria-current', j === i ? 'true' : 'false'); });
    if (cur < 0 || OWL.reduce) text(i); else { card.classList.add('swap'); setTimeout(function(){ text(i); card.classList.remove('swap'); }, 300); }
    cur = i; sec.dataset.cover = i + 1; }
  function read(){ var r = sec.getBoundingClientRect(), span = sec.offsetHeight - innerHeight, p = Math.max(0, Math.min(.999, -r.top / span)); show(Math.floor(p * P.length)); }
  addEventListener('scroll', read, { passive: true }); addEventListener('resize', read); read();
})();
</script>
</section>
