<section class="rs finder" id="finder" data-sky="day" aria-labelledby="fd-q">
<style>
.finder .box{position:relative;height:100vh;height:100svh;min-height:640px;overflow:hidden}
/* the scene: what Owl will do about YOUR case (dark, full-bleed, under the gate) */
.finder .scene{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;gap:clamp(24px,5vw,80px);padding:110px clamp(20px,5vw,90px) 90px;background:radial-gradient(120% 90% at 78% 40%,var(--deep-2) 0%,var(--deep) 62%);color:var(--on-deep)}
.finder .sc-k{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--acc-deep);font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.finder .sc-h{margin:0;font-size:clamp(40px,5.6vw,88px);font-weight:900;line-height:.98;letter-spacing:-.04em;text-wrap:balance;max-width:12ch}
.finder .sc-l{margin:22px 0 0;font-size:clamp(17px,1.4vw,21px);line-height:1.5;color:var(--on-deep-70);max-width:42ch}
.finder .sc-a{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:30px}
.finder .sc-a .btn{min-height:58px;font-size:18px}
.finder .sc-more[hidden]{display:none}
.finder .sc-more{color:var(--on-deep);font-weight:700;text-decoration:underline;text-underline-offset:5px;min-height:44px;display:inline-flex;align-items:center}
.finder .arch{position:relative;justify-self:center;width:min(100%,460px);aspect-ratio:3/4;border-radius:999px 999px 28px 28px;overflow:hidden;box-shadow:0 40px 70px -30px rgba(0,0,0,.7),0 0 0 10px color-mix(in srgb,var(--on-deep) 8%,transparent)}
.finder .arch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder .arch .ph-tag{position:absolute;left:50%;bottom:16px;translate:-50% 0;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
.finder .scene .txt>*,.finder .arch{transition:opacity .5s,translate .7s cubic-bezier(.16,1,.3,1)}
.finder .scene.swap .txt>*,.finder .scene.swap .arch{opacity:0;translate:0 26px}
/* the gate: the first act is a choice (Quiet Cubes), light, over the scene; it retracts upward with a curved edge */
.finder .gate{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px clamp(16px,4vw,48px) 60px;text-align:center;background:linear-gradient(180deg,var(--sky-b),var(--ground));clip-path:ellipse(160% 100% at 50% 0%);transition:clip-path 1.15s cubic-bezier(.7,0,.2,1)}
.finder .gate.up{clip-path:ellipse(160% 0% at 50% 0%);pointer-events:none}
.finder .gate.gone{visibility:hidden}
.finder .q{margin:0;font-size:clamp(40px,6vw,96px);font-weight:900;line-height:.98;letter-spacing:-.045em;text-wrap:balance;max-width:14ch;color:var(--ink)}
.finder .qs{margin:16px 0 0;font-size:18px;color:var(--ink-70)}
.finder .pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:clamp(28px,4vw,44px);max-width:1320px}
.finder .pill{display:inline-flex;align-items:center;gap:12px;min-height:64px;padding:8px 18px 8px 8px;border:0;border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 0 0 1px var(--line),0 14px 26px -18px rgba(0,0,0,.45);transition:background .25s,box-shadow .25s}
.finder .pill .ic,.rbar .dock .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--wash);color:var(--ink);flex:none}
.finder .pill .ic svg,.rbar .dock .ic svg{width:24px;height:24px}
@media (hover:hover) and (pointer:fine){.finder .pill:hover{box-shadow:0 0 0 2px var(--acc),0 18px 28px -18px rgba(0,0,0,.5)}}
.finder .pill[aria-checked="true"]{background:var(--acc);color:var(--on-acc)}
.finder .pill[aria-checked="true"] .ic,.rbar .dock button[aria-checked="true"] .ic{background:rgba(255,255,255,.18);color:var(--on-acc)}
.finder .pill:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
/* the dock: after the choice, the pills live in the top bar, page-wide */
.rbar .dock{display:flex;gap:6px;margin:0 auto;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 0 0 1px var(--line),0 10px 20px -16px rgba(0,0,0,.5);opacity:0;translate:0 -16px;pointer-events:none;transition:opacity .45s .5s,translate .6s cubic-bezier(.16,1,.3,1) .5s}
.rbar .dock.on{opacity:1;translate:none;pointer-events:auto}
.rbar .dock button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;min-width:44px;padding:4px 14px 4px 4px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:800;white-space:nowrap;cursor:pointer}
.rbar .dock .ic{width:32px;height:32px}.rbar .dock .ic svg{width:18px;height:18px}
.rbar .dock button[aria-checked="true"]{background:var(--acc);color:var(--on-acc)}
.rbar .dock button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:1180px){.rbar .dock button span{display:none}.rbar .dock button{padding:4px}.rbar .dock button[aria-checked="true"] span{display:inline;padding-right:8px}}
@media (max-width:860px){
 .finder .box{height:auto;min-height:0;display:flex;flex-direction:column}
 .finder .gate{order:-1}
 .finder:not([data-case]) .scene{display:none}
 .finder .sc-call{display:none}
 .finder .gate{position:relative;min-height:100svh;clip-path:none;transition:none}.finder .gate.up{display:none}
 .finder .scene{position:relative;grid-template-columns:minmax(0,1fr);padding:120px 20px 120px;gap:28px}
 .finder .arch{order:-1;width:min(78%,340px)}
 .finder .pills{display:grid;grid-template-columns:1fr 1fr;width:100%}
 .finder .pill{font-size:16px;padding:6px 12px 6px 6px;gap:10px;min-height:60px;text-align:left}
 .finder .pill .ic{width:44px;height:44px}
 .rbar .dock{position:fixed;left:12px;right:12px;top:66px;justify-content:space-between;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){.finder .gate,.finder .scene .txt>*,.finder .arch,.rbar .dock{transition:none}}
</style>
<div class="box">
 <div class="scene" aria-live="polite">
  <div class="txt"><p class="sc-k"></p><h3 class="sc-h"></h3><p class="sc-l"></p>
   <div class="sc-a"><a class="btn btn-amber btn-call sc-call" href="tel:+16519776027">Call about it</a><a class="sc-more" href="#nothing">See how it goes ↓</a></div></div>
  <div class="arch"><img alt=""><span class="ph-tag"></span></div>
 </div>
 <div class="gate">
  <h2 class="q" id="fd-q">What’s going on up there?</h2>
  <p class="qs">Pick the closest. You can change it any time.</p>
  <div class="pills" role="radiogroup" aria-labelledby="fd-q"></div>
 </div>
</div>
<script>
(function(){
  var sec = document.currentScript.closest('section'), gate = sec.querySelector('.gate'), pills = sec.querySelector('.pills'), scene = sec.querySelector('.scene');
  var C = [
    { k: 'leak', n: 'A leak', img: '{{A:stock/finder-leak.webp}}', alt: 'Rain pouring over a gutter edge (illustrative photo)', tag: 'Illustrative photo', h: 'A leak? We’ll find it and stop it.', l: 'We trace where the water gets in, fix it, and show you photos of what we found.', s: 'Roof Repair', a: 'Call about my leak' },
    { k: 'stain', n: 'A ceiling stain', img: '{{A:stock/finder-stain.webp}}', alt: 'An attic under the roof, where a ceiling stain is traced (illustrative photo)', tag: 'Illustrative photo', h: 'A stain? We look above it.', l: 'Water travels before it shows, so we check the roof and the attic above the stain, then fix what’s causing it.', s: 'Wise Check + Roof Repair', a: 'Call about the stain' },
    { k: 'shingles', n: 'Missing shingles', img: '{{A:stock/finder-shingles.webp}}', alt: 'A weathered roof with damaged, lifting shingles (illustrative photo)', tag: 'Illustrative photo', h: 'Shingles gone? We’ll put them back.', l: 'We replace what’s missing and look over the rest while we’re up there.', s: 'Roof Repair', a: 'Call about my shingles' },
    { k: 'storm', n: 'After a storm', img: '{{A:stock/finder-storm.webp}}', alt: 'Houses under a heavy storm sky (illustrative photo)', tag: 'Illustrative photo', h: 'Storm hit? We’ll check it properly.', l: 'Hail and wind leave marks that are easy to miss from the ground. We look closely and show you what we find.', s: 'Storm Damage Help', a: 'Call about storm damage' },
    { k: 'old', n: 'It’s getting old', img: '{{A:stock/finder-old.webp}}', alt: 'An older house and roof under a grey sky (illustrative photo)', tag: 'Illustrative photo', h: 'Getting old? We’ll tell you straight.', l: 'A Wise Check shows where it stands. If it’s time, we replace it, backed by our 10-year workmanship warranty.', s: 'Wise Check · Roof Replacement', a: 'Call about my roof' },
    { k: 'unsure', n: 'Not sure', img: '{{A:stock/finder-unsure.webp}}', alt: 'A roofer kneeling to look over a shingle roof (illustrative photo)', tag: 'Illustrative photo', h: 'Not sure? That’s what we’re for.', l: 'We look over the roof and attic and show you photos and video of what we saw. Then you decide.', s: 'Wise Check Inspections', a: 'Call and ask' }];
  /* a drawn symbol per case for the pills and the dock: each case photo is shown once, in the scene (no repeats) */
  var SV = function(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
  var ICON = { leak: SV('<path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/>'), stain: SV('<path d="M3 6h18"/><path d="M8 6c0 3 2 3 2 6s-3 3-3 6"/><circle cx="15" cy="13" r="3.2"/>'),
    shingles: SV('<path d="M3 10l9-6 9 6"/><path d="M5 14h4v4H5zM10 14h4M15 14h4v4h-4"/><path d="M10 18h4"/>'), storm: SV('<path d="M7 16a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.6 9 3.5 3.5 0 0 1 17 16"/><path d="M12 13l-2 4h3l-2 4"/>'),
    old: SV('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'), unsure: SV('<path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.4-1.5 1.2-1.5 2.2V15"/><path d="M12 18.5h.01"/>') };
  RESET.cases = C;
  function mk(c, i, small){ var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false'); b.tabIndex = i ? -1 : 0; b.dataset.k = c.k;
    b.innerHTML = '<span class="ic" aria-hidden="true">' + ICON[c.k] + '</span>' + (small ? '<span>' + c.n + '</span>' : c.n); if (!small) b.className = 'pill'; return b; }
  var gp = C.map(function(c, i){ var b = mk(c, i); pills.appendChild(b); return b; });
  var dock = document.createElement('div'); dock.className = 'dock'; dock.setAttribute('role', 'radiogroup'); dock.setAttribute('aria-label', 'Your roof problem'); dock.hidden = false;
  var dp = C.map(function(c, i){ var b = mk(c, i, true); b.setAttribute('aria-label', c.n); dock.appendChild(b); return b; });
  var bar = document.querySelector('.rbar'); bar.insertBefore(dock, bar.querySelector('.pal'));
  function radio(list, k){ list.forEach(function(b){ var on = b.dataset.k === k; b.setAttribute('aria-checked', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1; }); }
  function keys(list){ list.forEach(function(b, i){ b.addEventListener('keydown', function(e){ var m = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!m) return; e.preventDefault(); var n = list[(i + m + list.length) % list.length]; n.focus(); n.click(); }); }); }
  keys(gp); keys(dp);
  var cur = '';
  function fill(c){ scene.querySelector('.sc-k').textContent = c.s; scene.querySelector('.sc-h').textContent = c.h; scene.querySelector('.sc-l').textContent = c.l;
    var im = scene.querySelector('.arch img'); im.src = c.img; im.alt = c.alt;
    scene.querySelector('.ph-tag').textContent = c.tag;
    var call = scene.querySelector('.sc-call'); call.setAttribute('aria-label', c.a + ', (651) 977-6027'); var w = call.querySelector('.bl');
    if (w){ w.innerHTML = ''; c.a.split('').forEach(function(ch, j){ var e = document.createElement('i'); e.textContent = ch; e.dataset.c = ch; e.style.setProperty('--i', j); w.appendChild(e); }); } else call.textContent = c.a; }
  function choose(k, from){ var c = C.find(function(x){ return x.k === k; }); if (!c || k === cur) return; var first = !cur; cur = k;
    radio(gp, k); radio(dp, k); sec.dataset.case = k; RESET.setCase(k);
    if (first){ fill(c); if (OWL.reduce){ gate.classList.add('up', 'gone'); } else { gate.classList.add('up'); setTimeout(function(){ gate.classList.add('gone'); }, 1200); }
      gate.setAttribute('aria-hidden', 'true'); dock.classList.add('on');
      if (from === 'gate') setTimeout(function(){ var h = scene.querySelector('.sc-h'); h.tabIndex = -1; h.focus({ preventScroll: true }); }, OWL.reduce ? 0 : 900);
      if (innerWidth <= 860) scene.scrollIntoView({ behavior: OWL.reduce ? 'instant' : 'smooth' }); }
    else if (OWL.reduce) fill(c);
    else { scene.classList.add('swap'); setTimeout(function(){ fill(c); scene.classList.remove('swap'); }, 320); } }
  gp.forEach(function(b){ b.addEventListener('click', function(){ choose(b.dataset.k, 'gate'); }); });
  dp.forEach(function(b){ b.addEventListener('click', function(){ choose(b.dataset.k, 'dock'); if (sec.getBoundingClientRect().bottom < 0 || sec.getBoundingClientRect().top > innerHeight) sec.scrollIntoView({ behavior: OWL.reduce ? 'instant' : 'smooth' }); }); });
  /* another section (the hero's question) can open a case here */
  RESET.openCase = function(k){ choose(k, 'gate'); sec.scrollIntoView({ behavior: OWL.reduce ? 'instant' : 'smooth' }); };
  var more = scene.querySelector('.sc-more');
  document.addEventListener('DOMContentLoaded', function(){ if (!document.getElementById('nothing')) more.hidden = true; OWL.buttons(sec); });
})();
</script>
</section>
