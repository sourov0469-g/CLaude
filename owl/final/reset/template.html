<script>
{{JS:src/base.js}}
window.RESET = window.RESET || {};
/* every video file is owned by ONE section (OWL-FIX-DIAGNOSIS §1, §4): the crew film by the hero, nothing else repeats */
window.RESET_MEDIA = { crewloop: '{{A:crew.mp4}}', rise: '{{A:stock/hero-rise.mp4}}', drone: '{{A:stock/nothing-drone.mp4}}', nailer: '{{A:stock/nothing-nailer.mp4}}' };
/* every video plays from a Blob URL decoded once from its file (iOS Safari stalls on large data: video), and is primed with a muted
   play-then-pause so a scrubbed film paints its frames on phones too */
window.RESET.video = function(n){ var c = RESET._v || (RESET._v = {}); if (c[n]) return c[n]; var d = RESET_MEDIA[n]; if (!d) return '';
  try { var i = d.indexOf(','), type = d.slice(5, d.indexOf(';')), bin = atob(d.slice(i + 1)), a = new Uint8Array(bin.length); for (var k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
    return (c[n] = URL.createObjectURL(new Blob([a], { type: type }))); } catch (e){ return (c[n] = d); } };
window.RESET.prime = function(v){ v.muted = true; v.playsInline = true; var p = v.play(); if (p && p.then) p.then(function(){ if (v.dataset.scrub) v.pause(); }).catch(function(){}); };
</script>

<div class="vpanel" role="dialog" aria-modal="false" aria-labelledby="vp-h" hidden><div class="vp-in"><p class="vp-h" id="vp-h">Versions of each section</p><p class="vp-s">The starred one is the best: the version the homepage shows. Pick another to see it in place.</p><div class="vp-rows"></div><div class="vp-foot"><a class="vp-best" href="?">Show the bests</a><button class="vp-x" type="button">Close</button></div></div></div>
<main id="main">
{{SECTIONS}}
<script>/* stamp the chosen version of each section (?<id>=K, else the default, the best); the rest stay inert records */
(function(){ var q = new URLSearchParams(location.search), R = window.RESET, by = {}, order = [];
  [].forEach.call(document.querySelectorAll('main > template.rv'), function(t){ var s = t.dataset.sec; if (!by[s]){ by[s] = []; order.push(s); } by[s].push(t); });
  R.versions = {}; R.order = order;
  order.forEach(function(s){ var list = by[s], def = +list[0].dataset.def, want = +q.get(s),
      pick = list.filter(function(t){ return +t.dataset.v === want; })[0] || list.filter(function(t){ return +t.dataset.v === def; })[0] || list[0];
    R.versions[s] = { label: list[0].dataset.label, def: def, cur: +pick.dataset.v, list: list.map(function(t){ return { v: +t.dataset.v, name: t.dataset.name }; }) };
    list[0].parentNode.insertBefore(pick.content.cloneNode(true), list[0]); });
})();
</script>
